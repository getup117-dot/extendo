<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#191320">
<meta name="description" content="早押しで問題を途中で止めて、好きな答えを言おう。司会者が残りをつないで、その答えを正解にしてくれるクイズ。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="エクステン堂">
<meta property="og:title" content="八百長クイズ｜エクステン堂">
<meta property="og:description" content="早押しで問題を途中で止めて、好きな答えを言おう。司会者が残りをつないで、その答えを正解にしてくれる。">
<meta property="og:url" content="https://extendo.getup117.workers.dev/yaocho/">
<meta property="og:image" content="https://extendo.getup117.workers.dev/img/ogp_yaocho.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<title>八百長クイズ｜エクステン堂</title>
<link rel="stylesheet" href="style.css">
<script defer src="game.js"></script>
</head>
<body>
<main>
  <header class="hero">
    <div class="title">
      <p class="station">◆ クイズ番組 開演中</p>
      <h1>八百長<span>クイズ</span></h1>
      <p class="tagline">途中で止めて、好きな答えを言おう。</p>
    </div>
  </header>
  <section class="cabinet" aria-label="クイズ">
    <div class="hud"><strong id="round">第1問</strong><span id="mode"></span></div>
    <div id="question" class="question" aria-live="polite">問題を準備中…</div>
    <div id="reading" class="actions" hidden>
      <button id="buzz" class="buzz" type="button">早押し！</button>
      <button id="reveal" type="button">続きを読む</button>
    </div>
    <form id="entry" hidden>
      <label for="answer">あなたの答え</label>
      <div class="answer-row">
        <input id="answer" required maxlength="60" autocomplete="off" placeholder="答えを入力">
        <button id="submit" class="primary" type="submit">解答する</button>
      </div>
      <div id="examples" class="examples"></div>
      <button id="back" class="quiet" type="button">出題に戻る</button>
    </form>
    <p id="notice" role="status" hidden></p>
    <section id="result" hidden>
      <h2 id="verdict"></h2>
      <p id="completed"></p>
      <details id="original"><summary>本来の問題を見る</summary><p id="original-text"></p></details>
      <button id="next" class="primary" type="button">次の問題 →</button>
    </section>
  </section>
</main>
<div id="cutin" class="cutin" hidden aria-live="assertive">
  <div class="cutin-vignette"></div>
  <p class="cutin-label">あなたの答え</p>
  <p id="cutin-answer" class="cutin-answer"></p>
  <div class="cutin-band">
    <div class="cutin-face"></div>
    <p id="cutin-line" class="cutin-line"></p>
  </div>
  <p id="cutin-stamp" class="cutin-stamp" hidden>正解！</p>
</div>
</body>
</html>
