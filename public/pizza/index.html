// ---------- state ----------

// ---------- input ----------
function hit(key,stamp){
  if(!running) return;
  const age=stamp?Math.max(0,Math.min(.1,(performance.now()-stamp)/1000)):0;
  const t=now()-age-calib;
  sfxTap();
  let best=null,bd=1e9;
  for(const n of notes){ if(n.done||n.victim) continue; const d=Math.abs(n.t-t); if(d<bd){bd=d;best=n;} if(n.t-t>WIN_CATCH) break; }
  if(!best||bd>WIN_CATCH){ playVoice(key,0,0,.9); return; }
  best.done=true;
  if(best.type!==key||bd>WIN_G){ playVoice(key,0,0,.9); registerMiss(best); return; }
  // voice lands on the beat: early taps wait for the grid, late taps skip into the syllable
  {const err=t-best.t, pc=VOICE_PC[key];
   if(err<0) playVoice(key,ac.currentTime+Math.max(0,-err-lat()-pc));
   else playVoice(key,0,Math.min(err,pc));
   calib=Math.max(-.07,Math.min(.07,calib+err*.06));}
  const perfect=bd<=WIN_P;
  combo++;maxCombo=Math.max(maxCombo,combo);
  missStreak=0;
  {const lv=comboLv(combo); if(lv>hype){hype=lv;cheerAt=performance.now();bigBurst=true;sfxHypeUp(lv);}}
  sparkAtGate=true;
  if(perfect)cnt.p++;else cnt.g++;
  score+=((perfect?1000:500)*(best.muay?2:1)+Math.min(combo,100)*10)*(feverOn(t)?2:1);
  judge={k:perfect?'perfect':'good',t:performance.now()};
  if(perfect&&best.muay){callout={txt:best.type==='hiji'?'エルボー！':'膝！',t:performance.now()};sfxNice();}
  fx.push({t:performance.now(),col:COLORS[best.type],big:best.muay});
  sfxHit(perfect,combo);
}
function registerMiss(n){
  combo=0;missStreak++;if(missStreak>=2&&hype>0){hype--;}cnt.m++;judge={k:'miss',t:performance.now()};shake=performance.now();sfxMiss();
  if(navigator.vibrate) try{navigator.vibrate(40)}catch(e){}
}
document.querySelectorAll('.btn').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('on');hit(k,e.timeStamp);});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>b.classList.remove('on')));
});
const KEYS={a:'hiji',ArrowLeft:'hiji',s:'pizza',ArrowDown:'pizza',d:'hiza',ArrowRight:'hiza',j:'hiji',k:'pizza',l:'hiza'};
addEventListener('keydown',e=>{const k=KEYS[e.key];if(k&&!e.repeat){hit(k,e.timeStamp);const b=document.querySelector(`.btn[data-k=${k}]`);b.classList.add('on');setTimeout(()=>b.classList.remove('on'),90);}});

   const pal=NEON_COL;
   const burst=(x,y,cnt,spd,life,big)=>{for(let i=0;i<cnt;i++){const a=Math.random()*Math.PI*2,v=spd*(.45+Math.random()*.55);
       parts.push({x,y,px:x,py:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life,max:life,c:pal[Math.floor(Math.random()*(big?pal.length:3))],r:(big?2.6:1.8)*Math.max(.6,sc*2.2)});}};
   if(sparkAtGate){sparkAtGate=false;const c=4+hype*5;for(let i=0;i<c;i++){const a=-Math.PI/2+(Math.random()-.3)*2.2,v=(220+Math.random()*380)*sc*2;
       parts.push({x:lineX,y:laneMid,px:lineX,py:laneMid,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.3+hype*.04,max:.3+hype*.04,c:pal[Math.floor(Math.random()*(hype>=3?5:2))],r:1.6*Math.max(.6,sc*2.2)});}}
   const top=110*sc*2, bot=laneTop-60*sc;
   if(bigBurst){bigBurst=false;for(let k=0;k<2+Math.min(hype,3);k++)burst(W*(.2+Math.random()*.6),top+Math.random()*(bot-top),30+hype*12,(260+hype*40)*sc*2,1.1+hype*.08,true);}
   if(running&&t>0&&hype>=2){const kb2=Math.floor(bp(t));const every=hype>=5?1:hype>=4?2:4;
     if(kb2!==lastFw&&kb2%every===0){lastFw=kb2;burst(W*(.15+Math.random()*.7),top+Math.random()*(bot-top),16+hype*10,(180+hype*35)*sc*2,.9+hype*.1,hype>=4);}}
   if(fvOn){const hb=Math.floor(bp(t)*2);
     if(hb!==lastFvH){lastFvH=hb;for(let k=0;k<2;k++)burst(W*(.1+Math.random()*.8),top+Math.random()*(bot-top+200*sc),46,(420+Math.random()*200)*sc*2,1.3,true);}
     for(const side of [0,1]){for(let k=0;k<2;k++){const x=side?W-10*sc:10*sc,y=H-30*sc,a=-Math.PI/2+(side?-1:1)*(.15+Math.random()*.3),v=(380+Math.random()*130)*sc*2;
       parts.push({x,y,px:x,py:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1.1,max:1.1,c:pal[Math.floor(Math.random()*pal.length)],r:2.2*Math.max(.6,sc*2.2)});}}}
   if(parts.length>(fvOn?1100:520))parts.splice(0,parts.length-(fvOn?1100:520));
   ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
   for(const q of parts){q.px=q.x;q.py=q.y;q.vx*=.985;q.vy=q.vy*.985+260*sc*2*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;
     const a=Math.max(0,q.life/q.max);ctx.globalAlpha=a;ctx.strokeStyle=q.c;ctx.lineWidth=q.r*(.5+a);
     ctx.beginPath();ctx.moveTo(q.px-(q.x-q.px)*3,q.py-(q.y-q.py)*3);ctx.lineTo(q.x,q.y);ctx.stroke();
     ctx.fillStyle=q.c;ctx.globalAlpha=a*(.6+.4*Math.random());ctx.beginPath();ctx.arc(q.x,q.y,q.r*(.8+a*.9),0,7);ctx.fill();}
   ctx.restore();parts=parts.filter(q=>q.life>0);}

  // judge text
  if(judge){const p=(pn-judge.t)/600;if(p<1){const im=IMG['judgment_'+judge.k];
    if(im.complete){const sz=1+(p<.12?(.12-p)*1.6:0);const w=560*sc*sz,h=112*sc*sz;ctx.globalAlpha=1-p*p;ctx.drawImage(im,ox+540*sc-w/2,laneTop-121*sc-h/2-p*12*sc,w,h);ctx.globalAlpha=1;}}}
  ctx.restore();

  const midY=laneTop-330*sc;
  // level banner
  if(fvA>0){const pop=1+.12*pulse+(pn-feverAt<300?(1-(pn-feverAt)/300)*.8:0);const hue=(t*240)%360;
    ctx.save();ctx.globalAlpha=fvA;ctx.translate(W/2,midY);ctx.scale(pop,pop);ctx.rotate(Math.sin(t*6)*.04);ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font=`900 ${150*sc}px Outfit`;ctx.lineJoin='round';ctx.lineWidth=16*sc;ctx.strokeStyle=`hsl(${hue},100%,55%)`;ctx.shadowColor=`hsl(${(hue+90)%360},100%,60%)`;ctx.shadowBlur=36;ctx.strokeText('FEVER!!',0,0);
    ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.fillText('FEVER!!',0,0);
    ctx.font=`900 ${40*sc}px Outfit`;ctx.fillStyle='#ffc23d';ctx.fillText('SCORE ×2',0,96*sc);ctx.restore();}
  else if(lvBanner&&lvBanner.lv!=='fever'){const p=(pn-lvBanner.t)/1400;if(p<1){ctx.save();const a=p<.15?p/.15:p>.75?(1-p)/.25:1;ctx.globalAlpha=a;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='#ff3fae';ctx.shadowColor='#ff3fae';ctx.shadowBlur=22;ctx.font=`900 ${92*sc}px Outfit`;ctx.fillText(lvBanner.lv==='fever'?'FEVER!!':'LEVEL '+(lvBanner.lv+1),W/2,midY);
    ctx.shadowBlur=0;ctx.fillStyle='rgba(255,255,255,.85)';ctx.font=`600 ${30*sc}px Outfit`;ctx.fillText(lvBanner.lv==='fever'?'FINAL DROP':'MUAY THAI SPEED UP',W/2,midY+72*sc);ctx.restore();}}
  // NICE callout
  if(callout){const p=(pn-callout.t)/1000;if(p<1){const cy=laneTop-330*sc+((lvBanner&&pn-lvBanner.t<1400)||fvA>0?160*sc:0);
    const pop=p<.14?1.7-.7*(p/.14):1+.03*Math.sin(p*30)*(1-p);const a=p>.7?(1-p)/.3:1;
    ctx.save();ctx.globalAlpha=a;ctx.translate(W/2,cy);ctx.scale(pop,pop);ctx.rotate(-.06);ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font=`900 ${64*sc}px Outfit`;ctx.fillStyle='#22e6ff';ctx.shadowColor='#22e6ff';ctx.shadowBlur=20;ctx.fillText('NICE',0,-78*sc);
    ctx.font=`800 ${120*sc}px 'M PLUS Rounded 1c'`;ctx.lineJoin='round';ctx.lineWidth=14*sc;ctx.strokeStyle='#ff3fae';ctx.shadowColor='#ff3fae';ctx.shadowBlur=26;ctx.strokeText(callout.txt,0,30*sc);
    ctx.shadowBlur=0;const gr=ctx.createLinearGradient(0,-30*sc,0,90*sc);gr.addColorStop(0,'#fff6c8');gr.addColorStop(1,'#ffc23d');ctx.fillStyle=gr;ctx.fillText(callout.txt,0,30*sc);
    ctx.restore();}}
  // HUD
  if(running){
    ctx.textBaseline='top';ctx.textAlign='left';ctx.fillStyle='rgba(200,230,255,.65)';ctx.font=`600 ${26*sc}px Outfit`;ctx.fillText('SCORE',ox+54*sc,118*sc);
    ctx.fillStyle='#fff';ctx.font=`900 ${78*sc}px Outfit`;ctx.fillText(score.toLocaleString(),ox+50*sc,150*sc);
    // progress
    const pr=Math.max(0,Math.min(1,t/SONG_END));const px=ox+666*sc,py=142*sc,pw=360*sc,ph=24*sc;
    if(IMG.progress_track.complete)ctx.drawImage(IMG.progress_track,px,py,pw,ph);
    if(IMG.progress_fill.complete&&pr>0){const f=IMG.progress_fill;ctx.drawImage(f,0,0,f.naturalWidth*pr,f.naturalHeight,px,py,pw*pr,ph);}
    if(combo>=3){const cy=laneTop+320*sc+40*sc;ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,.92)';ctx.shadowColor='#22e6ff';ctx.shadowBlur=14;ctx.font=`900 ${130*sc*(1+pulse*.06)}px Outfit`;ctx.fillText(combo,W/2,cy);
      ctx.shadowBlur=0;ctx.font=`600 ${26*sc}px Outfit`;ctx.fillStyle='rgba(200,230,255,.6)';ctx.fillText('COMBO',W/2,cy+140*sc);}
    // count-in
    if(bp(t)<LEAD){const bpt=bp(t),bi=Math.floor(bpt);let s='';if(bi>=LEAD-8&&bi<LEAD-4)s='READY';else if(bi>=LEAD-4)s=['4','3','2','1'][bi-(LEAD-4)]||'';
      if(bi<LEAD-8){const a=Math.min(1,t/1.2)*(bi>=LEAD-11?Math.max(0,1-(bpt-(LEAD-11))/3):1);ctx.save();ctx.globalAlpha=a;ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillStyle='rgba(200,230,255,.7)';ctx.font=`600 ${28*sc}px Outfit`;ctx.fillText('NOW PLAYING',W/2,midY-70*sc);
        ctx.fillStyle='#fff';ctx.shadowColor='#ff3fae';ctx.shadowBlur=24;ctx.font=`900 ${84*sc}px Outfit`;ctx.fillText('NEON MUAY THAI',W/2,midY+10*sc);ctx.restore();}
      if(s&&t>=0){ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=`rgba(255,255,255,${.4+.6*(1-beatPhase)})`;ctx.shadowColor='#22e6ff';ctx.shadowBlur=18;ctx.font=`900 ${110*sc}px Outfit`;ctx.fillText(s,W/2,midY);ctx.shadowBlur=0;}}
  }
}
requestAnimationFrame(frame);
try{initAudio();}catch(e){}
})();
</script>
