<script>
'use strict';
// ===== 基本 =====
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),gameEl=$('game');
let W=390,H=700,DPR=1,SAFE_T=0,SAFE_B=0,PW=136;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const FONT='MCR,"Hiragino Maru Gothic ProN",sans-serif';

function resize(){
  W=Math.min(window.innerWidth,480);H=window.innerHeight;
  DPR=Math.min(window.devicePixelRatio||1,2.5);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cv.style.width=W+'px';cv.style.height=H+'px';gameEl.style.width=W+'px';PW=clamp(W*.36,112,136);
  const cs=getComputedStyle($('safe'));
  SAFE_T=parseFloat(cs.paddingTop)||0;SAFE_B=parseFloat(cs.paddingBottom)||0;
}
window.addEventListener('resize',resize);resize();

// ===== 画像 =====
const IMG_NAMES=['bg-ground-tile','bg-tea-row','bg-tea-spiral','boss-barrier','boss-leaf-bullet','boss-queen-angry','boss-queen-defeated','boss-queen-normal','boss-warning','chameleon-barley-tea','chameleon-damage','chameleon-matcha','chameleon-move','chameleon-neutral-master','chameleon-pre-eat','chameleon-red-tea','chameleon-roasted-tea','chameleon-swallow','enemy-bee','enemy-beetle','enemy-small-pest','fx-hit-pop','fx-leaf-burst','fx-move-dust','fx-target-ring','pickup-barley-tea','pickup-matcha-ring','pickup-red-tea','pickup-roasted-tea','projectile-needle','result-tea-pillar','result-victory-stamp','title-background','title-logo','title-start-button','tongue-barley-tea','tongue-matcha','tongue-normal','tongue-red-tea','tongue-roasted-tea','ui-heart-empty','ui-heart-full','ui-level-pip','ui-matcha-whisk','ui-pause'];
const IMG={};
function loadImages(){
  return Promise.all(IMG_NAMES.map(n=>new Promise(r=>{const i=new Image();i.onload=()=>{IMG[n]=i;r()};i.onerror=()=>r();i.src='img/'+n+'.png';})));
}
// 中心基準で描く。w指定でhは比率維持
function dimg(n,x,y,w,h,flip,alpha,rot){
  const im=IMG[n];if(!im)return;
  if(h==null)h=w*im.height/im.width;
  ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);if(flip)ctx.scale(-1,1);
  if(alpha!=null)ctx.globalAlpha=alpha;
  ctx.drawImage(im,-w/2,-h/2,w,h);ctx.restore();
}

// ===== 音 =====
let AC=null,soundOn=true;
try{soundOn=localStorage.getItem('mc_sound')!=='off'}catch(e){}
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}
function tone(f1,f2,dur,type,vol,delay){
  if(!AC||!soundOn)return;delay=delay||0;
  const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol||.1,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.03);
}
const SFX={
  eat(){const c=G?Math.min(G.combo,14):0,f=1+c*.07;tone(480*f,1150*f,.09,'sine',.13)},
  tea(){tone(880,880,.09,'triangle',.09);tone(1320,1320,.16,'triangle',.08,.08)},
  hit(){tone(220,55,.24,'square',.07)},
  clang(){tone(1500,1100,.07,'triangle',.06)},
  pop(){tone(300,140,.12,'triangle',.08)},
  ring(){tone(660,990,.12,'sine',.07);tone(990,1320,.12,'sine',.06,.1)},
  matcha(){[523,659,784,1047].forEach((f,i)=>tone(f,f,.14,'triangle',.09,i*.07))},
  warn(){tone(440,440,.18,'square',.05);tone(440,440,.18,'square',.05,.28)},
  boom(){tone(160,40,.35,'sawtooth',.06)},
  win(){[784,659,784,1047,1319].forEach((f,i)=>tone(f,f,.18,'triangle',.08,i*.12))},
  lose(){[523,440,349].forEach((f,i)=>tone(f,f*.98,.22,'triangle',.07,i*.16))},
};

// ===== データ =====

const curKind=()=>G.matchaT>0?'matcha':G.type;
const lvEff=()=>G.matchaT>0?3:G.lv;
function range(){return clamp(H*.27,170,240)*TEA[curKind()].rng*(1+.08*Math.max(0,lvEff()-1))}
function mouth(){const k=PW/136;return{x:G.p.x+G.face*56*k,y:G.p.y-17*k}}

// ===== 入力 =====
const ptr={down:false,id:null,lx:0,ly:0};
function evPos(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();initAudio();if(AC&&AC.state==='suspended')AC.resume();
  const p=evPos(e);
  if(mode==='title'){
    const by=titleBtnY();
    const pl=diffPills();for(const q of pl){if(p.x>q.x&&p.x<q.x+q.w&&p.y>q.y-6&&p.y<q.y+q.h+6){diff=q.k;try{localStorage.setItem('mc_diff',diff)}catch(e){}SFX.pop();return}}
    if(Math.abs(p.y-by)<40&&Math.abs(p.x-W/2)<140){startGame()}
    return;
  }
  if(mode!=='play')return;
  if(G&&G.celebrate&&G.celebrate.t>1.2){G.celebrate.t=G.celebrate.dur;return}
  const top=SAFE_T+10;
  if(p.x>W-56&&p.y<top+44){pauseGame();return}
  ptr.down=true;ptr.id=e.pointerId;ptr.lx=p.x;ptr.ly=p.y;
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
});
cv.addEventListener('pointermove',e=>{
  if(!ptr.down||e.pointerId!==ptr.id||mode!=='play')return;
  const p=evPos(e);G.mvx+=p.x-ptr.lx;G.mvy+=p.y-ptr.ly;ptr.lx=p.x;ptr.ly=p.y;
});
const up=e=>{if(e.pointerId===ptr.id)ptr.down=false};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play')pauseGame()});

// ===== 生成 =====
function spawnEnemy(k,xf){
  const x=40+clamp(xf+rand(-.04,.04),0,1)*(W-80);
  G.enemies.push({k,x,x0:x,y:-40,hp:EN[k].hp,vy:(k==='pest'?rand(95,120):k==='beetle'?rand(62,72):115)*G.D.spd,t:rand(0,6),st:'enter',ty:H*rand(.15,.28),life:0,shootT:1.0,flash:0,caught:false,dead:false});
}
function queuePattern(){
  let pool=POOLS[0][1];for(const [t,p] of POOLS)if(G.t>=t)pool=p;
  const pat=PAT[pick(pool)],mir=Math.random()<.5;
  let lastD=0;for(const [d,k,xf] of pat){G.queue.push({at:G.t+d,k,xf:mir?1-xf:xf});lastD=Math.max(lastD,d)}
  G.patT=(lastD+clamp(2.0-G.t*.014,1.2,2.0))*G.D.gap;
}
function spawnTea(){
  const cur=G.type,others=TEA_KINDS.filter(k=>k!==cur);
  G.forkN++;
  if(G.forkN%2===0){ // 分かれ道：左右に2つ
    let a,b;if(cur==='normal'){const s=TEA_KINDS.slice().sort(()=>Math.random()-.5);a=s[0];b=s[1]}else{a=cur;b=pick(others)}
    const id=++G.pairSeq,l=Math.random()<.5;
    G.pickups.push({k:a,x:W*(l?.28:.72),y:-40,t:0,pair:id});
    G.pickups.push({k:b,x:W*(l?.72:.28),y:-40,t:0,pair:id});
  }else{
    const k=(cur!=='normal'&&Math.random()<.5)?cur:pick(cur==='normal'?TEA_KINDS:others);
    G.pickups.push({k,x:rand(80,W-80),y:-40,t:0});
  }
}
function burstLeaves(x,y,n,spd){
  const cols=['#8CDC45','#B8F23B','#6FB83A','#FFF06A'];
  for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),v=rand(.5,1)*(spd||260);G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,rot:rand(0,6),vr:rand(-10,10),t:0,dur:rand(.35,.6),c:pick(cols),s:rand(5,9)})}
}
function addFx(img,x,y,w,dur,s0,s1,rot){G.fx.push({img,x,y,w,dur,t:0,s0:s0||1,s1:s1||1,rot:rot||0})}
function addText(s,x,y,dur,col,size){G.texts.push({s,x,y,dur,t:0,col:col||'#FFF8DF',size:size||18})}
function pushHist(k){if(k==='normal')return;if(G.history[G.history.length-1]!==k)G.history.push(k)}

// ===== 被弾・取得 =====
function hurt(){
  if(G.matchaT>0||G.inv>0||G.phase==='end')return;
  if(G.lv>0){G.lv--;if(G.lv===0){G.type='normal'}addText(G.lv>0?TEA[G.type].name+' Lv'+G.lv:'色がぬけた…',G.p.x,G.p.y-60,1.1,'#FFB3B0',17)}
  else G.life--;
  G.inv=1.4;G.dmgT=.45;G.shake=.25;addFx('fx-hit-pop',G.p.x,G.p.y,64,.25,.7,1.2);SFX.hit();
  try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}
  if(G.life<=0)endGame(false);
}
function takeTea(k){
  if(G.type===k)G.lv=Math.min(3,G.lv+1);else{G.type=k;G.lv=Math.max(1,G.lv)}
  G.maxLv=Math.max(G.maxLv,G.lv);
  if(G.matchaT<=0)pushHist(k);
  addText(TEA[k].name+(G.lv>=3?' MAX':' Lv'+G.lv)+'　'+TEA[k].tip,G.p.x,G.p.y-62,1.2,'#FFF06A',19);burstLeaves(G.p.x,G.p.y,8,220);
  addFx('fx-leaf-burst',G.p.x,G.p.y,120,.3,.5,1.3);SFX.tea();
}
function activateMatcha(){
  G.matchaT=MATCHA_TIME;G.gauge=0;G.ring=null;G.matchaUses++;pushHist('matcha');
  for(let i=0;i<5;i++)addFx('fx-leaf-burst',G.p.x+rand(-50,50),G.p.y+rand(-50,30),rand(70,120),.45,.4,1.4,rand(0,6));
  SFX.matcha();tone(1800,200,.35,'sawtooth',.03);G.tg.lock=null;G.cutin={t:0,dur:1.15};
}
function addGauge(v){
  if(G.matchaT>0||G.ring||G.phase==='end'||(G.boss&&G.boss.st==='dying'))return;
  G.gauge=Math.min(100,G.gauge+v*G.D.gauge*(G.phase==='boss'?3:1));
  if(G.gauge>=100){
    G.ring={x:G.p.x<W/2?W-64:64,y:H-SAFE_B-150,t:0};SFX.ring();
    if(!G.hint2){G.hint2=true;addText('リングに触れて抹茶モード！',W/2,H*.55,3,'#B8F23B',19)}
  }
}
function killEnemy(e,eaten){
  e.dead=true;const d=EN[e.k];
  G.combo=G.comboT>0?G.combo+1:1;G.comboT=1.6;G.comboPop=.15;
  const pts=Math.round(d.sc*(1+.25*lvEff())*(1+Math.min(G.combo,20)*.1)/10)*10;
  G.score+=pts;G.eaten++;addGauge(d.g);
  addText('+'+pts,e.x,e.y-24,.55,'#FFF06A',15);
  burstLeaves(e.x,e.y,eaten?4:8);
  if(e.k!=='pest')G.stop=.05;
  if(!eaten){addFx('fx-leaf-burst',e.x,e.y,90,.25,.5,1.2);SFX.eat()}
}

// ===== 舌 =====
function inCone(dx,dy,wide){return dy<-4&&Math.abs(dx)<=-dy*(wide?1.4:1.0)}
function validTarget(o,rng){
  const p=G.p;
  if(o.isBoss){const b=G.boss;if(!b||b.st!=='fight')return false;const dx=b.x-p.x,dy=b.y-p.y;return inCone(dx,dy,true)&&Math.hypot(dx,dy)-80<=rng}
  if(o.dead||o.caught||o.flee||o.y<-10)return false;
  const dx=o.x-p.x,dy=o.y-p.y;return inCone(dx,dy)&&Math.hypot(dx,dy)-(o.r||EN[o.k].r)<=rng;
}
function findTarget(){
  const rng=range(),p=G.p;let best=null,bd=1e9;
  if(G.matchaT>0&&G.boss&&validTarget(BOSS_REF,rng))return BOSS_REF;
  const cands=G.enemies.slice();
  if(G.matchaT>0)for(const s of G.shots)cands.push(s);
  for(const o of cands){if(!validTarget(o,rng))continue;const d=Math.hypot(o.x-p.x,o.y-p.y);if(d<bd){bd=d;best=o}}
  if(!best&&G.boss&&validTarget(BOSS_REF,rng))best=BOSS_REF;
  return best;
}
const BOSS_REF={isBoss:true};
function targetPoint(o){
  if(o.isBoss){const b=G.boss,m=mouth(),dx=b.x-m.x,dy=b.y-m.y,d=Math.hypot(dx,dy)||1;return{x:b.x-dx/d*70,y:b.y-dy/d*70}}
  return{x:o.x,y:o.y};
}
function updateTongue(dt){
  const T=G.tg,m=mouth(),kind=curKind(),def=TEA[kind],rng=range();
  T.cd-=dt;T.lockT-=dt;
  if(T.lock&&!validTarget(T.lock,rng*1.15))T.lock=null;
  if(!T.lock||T.lockT<=0){const n=findTarget();if(n!==T.lock){T.lock=n;T.lockT=.28}else if(n)T.lockT=.28}
  if(T.st==='idle'){
    T.tx=m.x;T.ty=m.y;
    if(T.cd<=0&&T.lock){
      T.st='out';T.kind=kind;T.target=T.lock;T.carry=null;T.hitDone=false;
      const tp=targetPoint(T.target);
      if(kind==='red'){const dx=tp.x-m.x,dy=tp.y-m.y,d=Math.hypot(dx,dy)||1;T.gx=m.x+dx/d*rng;T.gy=m.y+dy/d*rng}
      else{T.gx=tp.x;T.gy=tp.y}
      G.face=tp.x>=G.p.x?1:-1;
    }
  }
  if(T.st==='out'){
    if(T.kind!=='red'&&T.target&&(T.target.isBoss?G.boss&&G.boss.st==='fight':!T.target.dead&&!T.target.gone)){const tp=targetPoint(T.target);T.gx=tp.x;T.gy=tp.y}
    const sp=(T.kind==='matcha'?2600:2000)*(1+Math.min(G.combo,30)*.012);
    const dx=T.gx-T.tx,dy=T.gy-T.ty,d=Math.hypot(dx,dy);
    if(d<=sp*dt){T.tx=T.gx;T.ty=T.gy;tongueHit();T.st='back'}
    else{T.tx+=dx/d*sp*dt;T.ty+=dy/d*sp*dt}
  }else if(T.st==='back'){
    const sp=2300,dx=m.x-T.tx,dy=m.y-T.ty,d=Math.hypot(dx,dy);
    if(d<=sp*dt){
      T.tx=m.x;T.ty=m.y;T.st='idle';T.cd=TEA[T.kind].cd*(1-.15*Math.max(0,lvEff()-1))/(1+Math.min(G.combo,30)*.025);
      if(T.carry){const c=T.carry;T.carry=null;
        c.gone=true;if(c.isShot)G.score+=50;
        G.swT=.28;addFx('fx-leaf-burst',m.x,m.y,96,.22,.5,1.25);SFX.eat();
      }
    }else{T.tx+=dx/d*sp*dt;T.ty+=dy/d*sp*dt}
    if(T.carry){T.carry.x=T.tx;T.carry.y=T.ty}
  }
}
function damageEnemy(e,dmg,canCarry){
  if(e.dead)return;
  e.hp-=dmg;e.flash=.12;
  if(e.hp<=0){
    if(canCarry&&!G.tg.carry){killEnemy(e,true);e.caught=true;G.tg.carry=e}
    else killEnemy(e,false);
  }else{addFx('fx-hit-pop',e.x,e.y,46,.18,.6,1.1);SFX.pop()}
}
function tongueHit(){
  const T=G.tg,kind=T.kind,lv=lvEff(),o=T.target;
  let dmg=TEA[kind].dmg+(kind==='barley'&&lv>=3?1:0);
  if(kind==='red'){
    const m=mouth(),w=12+lv*3;
    for(const e of G.enemies){if(e.dead||e.caught)continue;if(segDist(m.x,m.y,T.tx,T.ty,e.x,e.y)<=EN[e.k].r+w)damageEnemy(e,dmg,true)}
    if(G.boss&&G.boss.st==='fight'&&segDist(m.x,m.y,T.tx,T.ty,G.boss.x,G.boss.y)<=90)hitBoss(dmg);
    return;
  }
  if(!o)return;
  if(o.isBoss){hitBoss(dmg)}
  else if(o.isShot){if(!o.dead){o.dead=true;o.isShot=true;T.carry=o;o.caught=true}}
  else damageEnemy(o,dmg,true);
  if(kind==='roasted'){
    const R=52+lv*10;
    G.fx.push({splat:true,x:T.tx,y:T.ty,r:R,t:0,dur:.3});SFX.boom();G.shake=Math.max(G.shake,.08);burstLeaves(T.tx,T.ty,6,300);
    for(const e of G.enemies){if(e===o||e.dead||e.caught)continue;if(Math.hypot(e.x-T.tx,e.y-T.ty)<=R+EN[e.k].r*.5)damageEnemy(e,1,false)}
    if(o.isBoss)hitBoss(1,true);
  }
  if(kind==='barley'){
    for(const e of G.enemies){if(e===o||e.dead||e.caught)continue;if(Math.hypot(e.x-T.tx,e.y-T.ty)<=30+EN[e.k].r)damageEnemy(e,dmg,false)}
  }
}
function segDist(x1,y1,x2,y2,px,py){const dx=x2-x1,dy=y2-y1,l=dx*dx+dy*dy||1;let t=((px-x1)*dx+(py-y1)*dy)/l;t=clamp(t,0,1);return Math.hypot(px-(x1+t*dx),py-(y1+t*dy))}

// ===== ボス =====
function hitBoss(dmg,silent){
  const b=G.boss;if(!b||b.st!=='fight')return;
  const T=G.tg;
  if(b.barrier){
    if(curKind()==='matcha'){b.barrier=false;b.bDown=12;addText('バリア破壊！',b.x,b.y+90,1.2,'#B8F23B',22);for(let i=0;i<6;i++)addFx('fx-leaf-burst',b.x+rand(-110,110),b.y+rand(-90,90),rand(70,110),.4,.4,1.3);SFX.boom();}
    else if(!silent){addFx('fx-hit-pop',T.tx,T.ty,44,.15,.6,1);SFX.clang();addGauge(1.5);
      if(!G.hint3){G.hint3=true;addText('バリアは抹茶モードで破れる！',W/2,H*.5,2.6,'#B8F23B',18)}}
    return;
  }
  if(curKind()==='matcha')dmg*=.6;
  b.hp-=dmg;b.flash=.1;G.score+=Math.round(20*dmg);addGauge(1.2*dmg);burstLeaves(T.tx,T.ty,3,240);
  if(!silent){addFx('fx-hit-pop',T.tx,T.ty,52,.18,.6,1.15);SFX.pop()}
  if(!b.angry&&b.hp>0&&b.hp<=G.D.boss/2){b.angry=true;addText('女王が怒った！',W/2,H*.42,1.6,'#FF776F',24);SFX.warn()}
  if(b.hp<=0){b.hp=0;b.st='dying';b.dt=0;G.shots=[];G.score+=5000;SFX.boom();G.tg.lock=null;G.shake=.6;G.slowT=.9;G.flashT=.35;G.ring=null;G.texts=[];G.pickups=[];try{navigator.vibrate&&navigator.vibrate([40,40,120])}catch(e){}burstLeaves(b.x,b.y,40,520);for(const e of G.enemies)if(!e.dead)damageEnemy(e,99,false)}
}
function updateBoss(dt){
  const b=G.boss;b.t+=dt;b.flash-=dt;
  if(b.st==='enter'){b.y+=80*dt;if(b.y>=b.ty){b.y=b.ty;b.st='fight';b.t=0;if(G.matchaT<=0&&!G.ring)addGauge(100)}return}
  if(b.st==='dying'){
    b.dt+=dt;b.y+=18*dt;
    if((b.dt*7|0)!==((b.dt-dt)*7|0))addFx('fx-leaf-burst',b.x+rand(-120,120),b.y+rand(-80,80),rand(60,120),.35,.4,1.3,rand(0,6));
    if(b.dt>.75&&!b.cut){b.cut=true;startCelebrate()}
    return;
  }
  b.x=W/2+Math.sin(b.t*.85)*(W/2-110);b.y=b.ty+Math.sin(b.t*1.7)*12;
  if(!b.barrier&&G.matchaT<=0){b.bDown-=dt;if(b.bDown<=0){b.barrier=true;addText('バリア復活',b.x,b.y+90,1,'#FFF06A',17)}}
  b.atk-=dt;
  if(b.atk<=0){
    b.atkN=(b.atkN||0)+1;
    if(b.atkN%3===0){ // 全方位にゆっくり
      const n=Math.max(8,(b.angry?16:12)+G.D.fan*2),sp=112*G.D.shot,off=b.t;
      for(let i=0;i<n;i++){const a=off+i/n*Math.PI*2;G.shots.push({isShot:true,k:'leaf',x:b.x,y:b.y+20,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:10,ang:a})}
    }else{
      const n=Math.max(2,(b.angry?4:3)+G.D.fan),sp=(b.angry?182:165)*G.D.shot,base=Math.atan2(G.p.y-b.y,G.p.x-b.x),spread=.3;
      for(let i=0;i<n;i++){const a=base+(i-(n-1)/2)*spread;G.shots.push({isShot:true,k:'leaf',x:b.x,y:b.y+60,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:10,ang:a})}
    }
    b.atk=(b.angry?1.5:2.0)*G.D.fire;
  }
  b.esc-=dt;if(b.esc<=0){spawnEnemy('pest',pick([.08,.2]));spawnEnemy('pest',pick([.8,.92]));b.esc=b.angry?1.2:1.5}
  if(Math.hypot(G.p.x-b.x,(G.p.y-b.y)*1.25)<105)hurt();
}

// ===== 終了・結果 =====
function endGame(win){
  if(G.phase==='end')return;
  G.phase='end';G.victory=win;G.endT=win?.4:1.0;
  if(!win)SFX.lose();
}
function showResult(){
  mode='result';
  if(G.score>getBest(G.diff))setBest(G.diff,G.score);
  $('card').src=makeCard();
  $('resultOv').classList.add('show');$('resultOv').scrollTop=0;
}

// ===== 更新 =====
function update(dt){
  if(G.phase==='end'){G.endT-=dt;updateFx(dt);if(G.endT<=0)showResult();return}
  G.flashT-=dt;
  if(G.celebrate){const c=G.celebrate;c.t+=dt;updateConfetti(dt);updateFx(dt);if(G.boss)G.boss.dt+=dt;if(c.t>=c.dur)endGame(true);return}
  if(G.cutin){G.cutin.t+=dt;G.mvx=G.mvy=0;if(G.cutin.t>=G.cutin.dur)G.cutin=null;return}
  if(G.stop>0){G.stop-=dt;updateFx(dt*.3);return}
  if(G.slowT>0){G.slowT-=dt;dt*=.3}
  G.comboT-=dt;G.comboPop-=dt;if(G.comboT<=0)G.combo=0;
  G.t+=dt;G.bgY+=55*dt;
  // 移動
  const p=G.p,mx=G.mvx*1.1,my=G.mvy*1.1;G.mvx=G.mvy=0;
  p.x=clamp(p.x+mx,30,W-30);p.y=clamp(p.y+my,H*.2,H-SAFE_B-46);
  const spd=Math.hypot(mx,my)/dt;G.moving=spd>40?.15:Math.max(0,G.moving-dt);
  if(Math.abs(mx)>1.2&&G.tg.st==='idle')G.face=mx>0?1:-1;
  G.dustT-=dt;if(spd>650&&G.dustT<=0){addFx('fx-move-dust',p.x-G.face*20,p.y+30,58,.3,.8,1.1);G.dustT=.14}
  G.inv-=dt;G.dmgT-=dt;G.swT-=dt;G.shake-=dt;
  if(G.matchaT>0){G.matchaT-=dt;if(G.matchaT<=0){G.matchaT=0;pushHist(G.type);for(const e of G.enemies)if(e.rush&&!e.dead)e.flee=true;addText('抹茶モード終了',W/2,H*.45,1,'#FFF8DF',18);G.tg.lock=null}}
  // 出現
  if(G.matchaT>2&&G.phase==='stage'){G.rushT=(G.rushT||0)-dt;if(G.rushT<=0){spawnEnemy('pest',rand(0,1));G.enemies[G.enemies.length-1].rush=true;if(Math.random()<.35){spawnEnemy('pest',rand(0,1));G.enemies[G.enemies.length-1].rush=true}G.rushT=G.phase==='boss'?.5:.32}}
  if(G.phase==='stage'){
    G.patT-=dt;if(G.patT<=0)queuePattern();
    G.nextTea-=dt;if(G.nextTea<=0){spawnTea();G.nextTea=rand(5.5,7)}
    if(G.t>=BOSS_AT){G.phase='warn';G.warnT=1.5;SFX.warn();G.queue=[]}
  }else if(G.phase==='warn'){
    G.warnT-=dt;if(G.warnT<=0){G.phase='boss';G.boss={x:W/2,y:-150,ty:Math.max(H*.22,SAFE_T+160),hp:DIFF[G.diff].boss,st:'enter',t:0,barrier:true,bDown:0,atk:2.4,esc:2.2,angry:false,flash:0}}
  }else if(G.phase==='boss'){
    updateBoss(dt);
    G.nextTea-=dt;if(G.nextTea<=0){spawnTea();G.nextTea=rand(8,10)}
  }
  for(let i=G.queue.length-1;i>=0;i--){const q=G.queue[i];if(G.t>=q.at){spawnEnemy(q.k,q.xf);G.queue.splice(i,1)}}
  if(G.t>G.nextDeco){G.deco.push({x:Math.random()<.5?-30:W+30,y:-200,s:rand(190,240)});G.nextDeco=G.t+rand(13,18)}
  for(const d of G.deco)d.y+=55*dt;G.deco=G.deco.filter(d=>d.y<H+260);
  // 敵
  for(const e of G.enemies){
    if(e.dead||e.caught)continue;e.t+=dt;e.flash-=dt;
    if(e.flee){e.y-=280*dt;if(e.y<-60)e.gone=true;continue}
    if(e.k==='pest'){e.y+=e.vy*dt;e.x=e.x0+Math.sin(e.t*2)*22}
    else if(e.k==='beetle'){e.y+=e.vy*dt}
    else{
      if(e.st==='enter'){e.y+=e.vy*dt;if(e.y>=e.ty){e.st='hover';e.life=0}}
      else if(e.st==='hover'){e.life+=dt;e.x=e.x0+Math.sin(e.life*1.3)*Math.min(70,W*.18);e.shootT-=dt;
        if(e.shootT<=0){const a0=Math.atan2(G.p.y-e.y,G.p.x-e.x),n=(G.t>25||G.phase!=='stage')?3:1;for(let i=0;i<n;i++){const a=a0+(i-(n-1)/2)*.26;G.shots.push({isShot:true,k:'needle',x:e.x,y:e.y+20,vx:Math.cos(a)*180*G.D.shot,vy:Math.sin(a)*180*G.D.shot,r:6,ang:a})}e.shootT=2.3*G.D.fire}
        if(e.life>6.5)e.st='leave'}
      else e.y+=75*dt;
    }
    if(Math.hypot(e.x-p.x,e.y-p.y)<EN[e.k].r+12+G.D.hit){
      if(G.matchaT>0){damageEnemy(e,99,false)}else{e.dead=true;addFx('fx-hit-pop',e.x,e.y,50,.2,.6,1.1);hurt()}
    }
  }
  if(G.wave){const wv=G.wave;wv.r+=1100*dt;
    for(const e of G.enemies){if(!e.dead&&!e.caught&&Math.hypot(e.x-wv.x,e.y-wv.y)<wv.r)damageEnemy(e,99,false)}
    for(const s of G.shots){if(!s.dead&&Math.hypot(s.x-wv.x,s.y-wv.y)<wv.r){s.dead=true;G.score+=50}}
    if(wv.r>Math.hypot(W,H))G.wave=null}
  G.enemies=G.enemies.filter(e=>!e.gone&&!(e.dead&&!e.caught)&&e.y<H+60);
  // 弾
  for(const s of G.shots){
    if(s.dead)continue;s.x+=s.vx*dt;s.y+=s.vy*dt;
    if(Math.hypot(s.x-p.x,s.y-p.y)<s.r+14){if(G.matchaT>0){s.dead=true;G.score+=50;addFx('fx-leaf-burst',s.x,s.y,50,.2,.5,1.1);SFX.eat()}else{s.dead=true;hurt()}}
  }
  G.shots=G.shots.filter(s=>!s.gone&&(!s.dead||s.caught)&&s.y<H+40&&s.y>-60&&s.x>-40&&s.x<W+40);
  // お茶
  for(const k of G.pickups){if(k.got)continue;k.y+=(G.phase==='boss'?70:85)*dt;k.t+=dt;if(Math.hypot(k.x-p.x,k.y-p.y)<24+26){k.got=true;takeTea(k.k);if(k.pair)for(const o of G.pickups)if(o!==k&&o.pair===k.pair&&!o.got){o.got=true;addFx('fx-move-dust',o.x,o.y,60,.3,.8,1.3)}}}
  G.pickups=G.pickups.filter(k=>!k.got&&k.y<H+50);
  if(G.ring){G.ring.t+=dt;if(Math.hypot(G.ring.x-p.x,G.ring.y-p.y)<30+26)activateMatcha()}
  updateTongue(dt);
  updateFx(dt);
}
function updateFx(dt){
  for(const f of G.fx)f.t+=dt;G.fx=G.fx.filter(f=>f.t<f.dur);
  for(const t of G.texts){t.t+=dt;t.y-=18*dt}G.texts=G.texts.filter(t=>t.t<t.dur);
  const damp=Math.pow(.02,dt);for(const q of G.parts){q.t+=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=damp;q.vy=q.vy*damp+260*dt;q.rot+=q.vr*dt}G.parts=G.parts.filter(q=>q.t<q.dur);
}

// ===== 描画 =====
function drawBg(scrollY){
  const tile=IMG['bg-ground-tile'],ts=256;
  if(tile){const oy=scrollY%ts;for(let y=-ts+oy;y<H;y+=ts)for(let x=0;x<W;x+=ts)ctx.drawImage(tile,x,y,ts,ts)}
  else{ctx.fillStyle='#EAF3C8';ctx.fillRect(0,0,W,H)}
  for(const d of (G?G.deco:[]))dimg('bg-tea-spiral',d.x,d.y,d.s,d.s,d.x>W/2,.9);
  const row=IMG['bg-tea-row'];
  if(row){const rw=58,rh=116,oy=scrollY%rh;for(let y=-rh+oy;y<H;y+=rh){ctx.drawImage(row,-20,y,rw,rh);ctx.drawImage(row,W-rw+20,y,rw,rh)}}
}
function drawTongue(){
  const T=G.tg;if(T.st==='idle')return;
  const m=mouth(),dx=T.tx-m.x,dy=T.ty-m.y,len=Math.hypot(dx,dy);if(len<4)return;
  const def=TEA[T.kind],im=IMG[def.tongue];if(!im)return;
  const h=def.th,s=h/im.height,bw=im.width*.12,tw=im.width*.25;
  let db=bw*s,dtw=tw*s,mid=len-db-dtw;
  ctx.save();ctx.translate(m.x,m.y);ctx.rotate(Math.atan2(dy,dx));
  if(mid<0){const k=len/(db+dtw);db*=k;dtw*=k;mid=0}
  ctx.drawImage(im,0,0,bw,im.height,0,-h/2,db,h);
  if(mid>0)ctx.drawImage(im,bw,0,im.width-bw-tw,im.height,db-1,-h/2,mid+2,h);
  ctx.drawImage(im,im.width-tw,0,tw,im.height,db+mid,-h/2,dtw,h);
  ctx.restore();
}
function playerSprite(){
  const k=curKind();
  if(G.dmgT>0)return'chameleon-damage';
  if(k!=='normal')return TEA[k].spr;
  if(G.swT>0)return'chameleon-swallow';
  if(G.tg.st==='out')return'chameleon-pre-eat';
  if(G.moving>0)return'chameleon-move';
  return'chameleon-neutral-master';
}
function drawPlayer(){
  const p=G.p,k=curKind();
  if(G.celebrate)return;
  if(G.inv>0&&G.matchaT<=0&&((G.inv*12)|0)%2===0)return;
  let sx=1,sy=1;
  if(G.swT>0){const q=Math.sin((1-G.swT/.28)*Math.PI);sx=1+q*.08;sy=1-q*.06}
  if(k!=='normal'&&G.tg.st==='out'){sx*=1.03}
  if(G.matchaT>0){ctx.save();ctx.globalAlpha=.25+.12*Math.sin(G.t*10);ctx.fillStyle='#B8F23B';ctx.beginPath();ctx.ellipse(p.x,p.y+4,78,58,0,0,Math.PI*2);ctx.fill();ctx.restore()}
  ctx.save();ctx.translate(p.x,p.y);ctx.scale(sx,sy);
  const im=IMG[playerSprite()];
  if(im){const w=PW,h=w*im.height/im.width;if(G.face<0)ctx.scale(-1,1);ctx.drawImage(im,-w/2,-h/2,w,h)}
  ctx.restore();
}
function drawEnemy(e){
  const d=EN[e.k];let rot=0;
  if(e.flee){dimg(d.img,e.x,e.y,d.w*.8,null,false,.5);return}
  if(e.k==='pest')rot=Math.sin(e.t*4)*.08;
  dimg(d.img,e.x,e.y,d.w,null,false,null,rot);
  if(e.flash>0){ctx.save();ctx.globalAlpha=.5;ctx.globalCompositeOperation='lighter';dimg(d.img,e.x,e.y,d.w);ctx.restore()}
  if(e.k==='beetle'&&e.hp<EN.beetle.hp&&!e.caught){ctx.save();ctx.strokeStyle='#071536';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(e.x-8,e.y-18);ctx.lineTo(e.x+2,e.y-6);ctx.lineTo(e.x-4,e.y+4);ctx.stroke();ctx.restore()}
}
function drawBoss(){
  const b=G.boss;if(!b)return;
  const n=b.st==='dying'?'boss-queen-defeated':b.angry?'boss-queen-angry':'boss-queen-normal';
  const a=b.st==='dying'?clamp(1-(b.dt-1.2)/1.2,0,1):1;
  const w=Math.min(300,W*.8);
  dimg(n,b.x,b.y,w,null,false,a);
  if(b.flash>0){ctx.save();ctx.globalCompositeOperation='lighter';dimg(n,b.x,b.y,w,null,false,.35);ctx.restore()}
  if(b.barrier&&b.st!=='dying'){dimg('boss-barrier',b.x,b.y+6,w*.92,w*.92,false,.85+.1*Math.sin(G.t*6),G.t*.6)}
  if(b.st==='fight'){ // 体力
    const bw=Math.min(220,W*.56),x=W/2-bw/2,y=SAFE_T+48;
    ctx.save();ctx.fillStyle='#FFF8DF';ctx.strokeStyle='#071536';ctx.lineWidth=3;roundRect(x,y,bw,12,6);ctx.fill();ctx.stroke();
    ctx.fillStyle=b.angry?'#FF776F':'#B48763';roundRect(x+3,y+3,(bw-6)*b.hp/G.D.boss,6,3);ctx.fill();ctx.restore();

}
function roundRect(x,y,w,h,r){ctx.beginPath();if(w<0)w=0;r=Math.min(r,w/2,h/2);ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function outlineText(s,x,y,size,col,align,lw){

  if(G.wave){const wv=G.wave,a=clamp(1-wv.r/Math.hypot(W,H),0,1);ctx.save();ctx.globalAlpha=a;ctx.fillStyle='rgba(184,242,59,.12)';ctx.beginPath();ctx.arc(wv.x,wv.y,wv.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#B8F23B';ctx.lineWidth=18;ctx.stroke();ctx.lineWidth=5;ctx.strokeStyle='#071536';ctx.beginPath();ctx.arc(wv.x,wv.y,wv.r+10,0,Math.PI*2);ctx.stroke();ctx.restore()}

  for(const q of G.parts){ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.rot);ctx.globalAlpha=1-q.t/q.dur;ctx.fillStyle=q.c;ctx.strokeStyle='#071536';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,q.s,q.s*.55,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore()}
  ctx.restore();
  if(G.matchaT>0){const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);g.addColorStop(0,'rgba(184,242,59,0)');g.addColorStop(1,'rgba(143,203,58,'+(.32+.1*Math.sin(G.t*8)).toFixed(3)+')');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
  for(const t of G.texts){const a=t.t<.15?t.t/.15:t.t>t.dur-.3?(t.dur-t.t)/.3:1;ctx.save();ctx.globalAlpha=clamp(a,0,1);outlineText(t.s,t.x,t.y,t.size,t.col);ctx.restore()}
  if(G.phase==='warn'){const q=(1.5-G.warnT);const x=W/2+(q<.3?(1-q/.3)*W:0);dimg('boss-warning',x,H*.36,Math.min(320,W*.85),null,false,(G.warnT*3|0)%2?1:.85)}
  drawHUD();
}
function drawCutin(){
  const c=G.cutin,t=c.t,d=c.dur;
  const inQ=clamp(t/.14,0,1),outQ=clamp((d-t)/.16,0,1),a=Math.min(inQ,outQ);
  ctx.save();
  ctx.fillStyle='rgba(7,21,54,'+(.5*a).toFixed(3)+')';ctx.fillRect(0,0,W,H);
  const win=c.kind==='win';
  ctx.translate(W/2,H*.46);ctx.rotate(win?.16:-.2);
  const bh=Math.min(H*.3,230)*a,bw=Math.hypot(W,H)*1.2;
  ctx.fillStyle=win?'#FFF8DF':'#B8F23B';ctx.fillRect(-bw/2,-bh/2,bw,bh);
  // 流れる線
  ctx.save();ctx.beginPath();ctx.rect(-bw/2,-bh/2,bw,bh);ctx.clip();
  for(let i=0;i<14;i++){const y=(-.5+((i*.37)%1))*bh,len=60+(i*53)%140,x=bw/2-((t*1900+i*170)%(bw+300));
    ctx.fillStyle=win?(i%3?'rgba(201,79,73,.35)':'rgba(255,240,106,.9)'):(i%3?'rgba(255,248,223,.75)':'rgba(111,184,58,.8)');ctx.fillRect(win?-x:x,y,len,i%3?5:9)}
  ctx.restore();
  ctx.strokeStyle='#071536';ctx.lineWidth=8;
  ctx.beginPath();ctx.moveTo(-bw/2,-bh/2);ctx.lineTo(bw/2,-bh/2);ctx.moveTo(-bw/2,bh/2);ctx.lineTo(bw/2,bh/2);ctx.stroke();
  // カメレオンが右から飛び込み、少し流れて左へ抜ける
  const im=IMG[win?TEA[G.matchaT>0?'matcha':G.type].spr:'chameleon-matcha'];
  if(im&&bh>10){const cw=Math.min(W*.78,330),ch=cw*im.height/im.width;
    let x;if(t<.22)x=W*1.2*(1-t/.22)+(-W*.1)*(t/.22);else if(t<d-.2)x=-W*.1-(t-.22)*40;else x=-W*.1-(d-.42)*40-((t-(d-.2))/.2)*W*1.3;
    ctx.save();ctx.beginPath();ctx.rect(-bw/2,-bh/2-ch*.35,bw,bh+ch*.35);ctx.clip();if(win)x-=W*.14;ctx.drawImage(im,x-cw/2,-ch*.62,cw,ch);ctx.restore()}
  // 文字
  const label=win?'女王撃破！':'抹茶カメレオン！';
  if(t>.12){const q=clamp((t-.12)/.12,0,1),sc=1.6-.6*q;ctx.save();ctx.translate(win?W*.02:W*.06,bh*.3);ctx.scale(sc,sc);ctx.globalAlpha=q*outQ;
    ctx.font='900 '+Math.min(win?54:44,W*(win?.14:.105))+'px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
    ctx.strokeStyle='#071536';ctx.lineWidth=12;ctx.strokeText(label,0,0);ctx.fillStyle=win?'#FF776F':'#FFF8DF';ctx.fillText(label,0,0);ctx.restore()}
  if(win&&t>.6&&IMG['result-victory-stamp']){const q=clamp((t-.6)/.12,0,1),sc=2.2-1.2*q,sz=Math.min(W*.36,150);
    ctx.save();ctx.translate(W*.34,-bh*.22);ctx.rotate(-.35);ctx.scale(sc,sc);ctx.globalAlpha=q*outQ;ctx.drawImage(IMG['result-victory-stamp'],-sz/2,-sz/2,sz,sz);ctx.restore()}
  ctx.restore();
}
const CONF_COLS=['#B8F23B','#FFF06A','#FF776F','#E8B84C','#8B5A3C','#FFF8DF','#8CDC45'];
function startCelebrate(){
  G.celebrate={t:0,dur:3.4,conf:[]};G.texts=[];
  for(let i=0;i<140;i++)addConfetti(rand(0,W),rand(-H*.6,-10));
  SFX.win();[1047,1319,1568,2093].forEach((f,i)=>tone(f,f,.22,'triangle',.07,.6+i*.1));
}
function addConfetti(x,y){G.celebrate.conf.push({x,y,vx:rand(-40,40),vy:rand(120,260),r:rand(0,6),vr:rand(-8,8),w:rand(6,11),h:rand(10,16),c:pick(CONF_COLS),sw:rand(0,6),leaf:Math.random()<.3})}
function updateConfetti(dt){
  const c=G.celebrate;
  if(c.t<2.2&&Math.random()<.8)for(let i=0;i<3;i++)addConfetti(rand(0,W),-20);
  for(const q of c.conf){q.sw+=dt*4;q.x+=(q.vx+Math.sin(q.sw)*50)*dt;q.y+=q.vy*dt;q.r+=q.vr*dt}
  c.conf=c.conf.filter(q=>q.y<H+30);
}
function drawCelebrate(){
  const c=G.celebrate,t=c.t,a=clamp(t/.3,0,1)*clamp((c.dur-t)/.3,0,1);
  ctx.save();ctx.fillStyle='rgba(7,21,54,'+(.35*a).toFixed(3)+')';ctx.fillRect(0,0,W,H);ctx.restore();
  // 跳ねるカメレオン
  const im=IMG[TEA[G.matchaT>0?'matcha':G.type].spr];
  if(im){const cw=Math.min(W*.5,200),ch=cw*im.height/im.width,jump=Math.abs(Math.sin(t*5.5))*38*clamp(t/.4,0,1);
    ctx.save();ctx.globalAlpha=a;ctx.translate(W/2,H*.62-jump);const sq=1+(jump<6?.06:0);ctx.scale(sq,2-sq);ctx.drawImage(im,-cw/2,-ch/2,cw,ch);ctx.restore()}
  // 紙吹雪
  for(const q of c.conf){ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.r);ctx.globalAlpha=a;ctx.fillStyle=q.c;ctx.strokeStyle='#071536';ctx.lineWidth=1.5;
    if(q.leaf){ctx.beginPath();ctx.ellipse(0,0,q.h*.6,q.w*.45,0,0,Math.PI*2);ctx.fill();ctx.stroke()}else{ctx.fillRect(-q.w/2,-q.h/2*Math.abs(Math.cos(q.sw)),q.w,q.h*Math.abs(Math.cos(q.sw)))}
    ctx.restore()}
  // CONGRATULATIONS!
  const word='CONGRATULATIONS!',cols=['#B8F23B','#FFF06A','#FF776F','#FFF8DF'];
  let fs=44;ctx.font='900 '+fs+'px '+FONT;while(fs>18&&ctx.measureText(word).width>W*.9){fs--;ctx.font='900 '+fs+'px '+FONT}
  const tw=ctx.measureText(word).width;let x=W/2-tw/2;const y0=H*.33;
  ctx.textAlign='left';ctx.textBaseline='middle';ctx.lineJoin='round';
  for(let i=0;i<word.length;i++){const ch=word[i],cw=ctx.measureText(ch).width,lt=t-.15-i*.045;
    if(lt>0){const q=clamp(lt/.22,0,1),drop=(1-q)*-60,sc=q<1?1+.5*(1-q):1+.06*Math.sin(t*6+i*.6),wob=Math.sin(t*5+i*.7)*4;
      ctx.save();ctx.globalAlpha=Math.min(q,a);ctx.translate(x+cw/2,y0+drop+wob);ctx.scale(sc,sc);
      ctx.strokeStyle='#071536';ctx.lineWidth=Math.max(5,fs*.22);ctx.strokeText(ch,-cw/2,0);ctx.fillStyle=cols[i%cols.length];ctx.fillText(ch,-cw/2,0);ctx.restore()}
    x+=cw}
  if(t>1){const q=clamp((t-1)/.3,0,1);ctx.save();ctx.globalAlpha=Math.min(q,a);outlineText('チャドクガの女王をたおした！',W/2,y0+fs*.9+18,Math.min(20,W*.052),'#FFF8DF','center',5);ctx.restore()}
  if(t>1.6){ctx.save();ctx.globalAlpha=a*(.6+.4*Math.sin(t*5));outlineText('タップでつぎへ',W/2,H-SAFE_B-40,14,'#FFF06A','center',4);ctx.restore()}
}
function titleBtnY(){return Math.min(H*.78,H-SAFE_B-120)}
function diffPills(){const gap=8,w=Math.min(108,(W-40-gap*2)/3),h=38,y=titleBtnY()-82,x0=W/2-(w*3+gap*2)/2;return DIFF_KEYS.map((k,i)=>({k,x:x0+i*(w+gap),y,w,h}))}
function drawTitle(){
  titleT+=1/60;
  const bg=IMG['title-background'];
  if(bg){const s=Math.max(W/bg.width,H/bg.height),w=bg.width*s,h=bg.height*s;ctx.drawImage(bg,(W-w)/2,(H-h)/2,w,h)}
  const lw=Math.min(W*.86,360);dimg('title-logo',W/2,SAFE_T+Math.max(90,H*.15),lw);
  const cw=Math.min(W*.6,240);dimg('chameleon-matcha',W/2,H*.5+Math.sin(titleT*2.2)*8,cw);
  const by=titleBtnY(),s=1+.03*Math.sin(titleT*4);
  for(const q of diffPills()){const on=q.k===diff;ctx.save();ctx.fillStyle=on?'#B8F23B':'#FFF8DF';ctx.strokeStyle='#071536';ctx.lineWidth=on?5:3;roundRect(q.x,q.y,q.w,q.h,q.h/2);ctx.fill();ctx.stroke();ctx.restore();
    ctx.font='900 '+(q.w<96?14:16)+'px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#071536';ctx.fillText(DIFF[q.k].name,q.x+q.w/2,q.y+q.h/2+1)}
  dimg('title-start-button',W/2,by,240*s);
  outlineText('指で動かすだけ',W/2,by+56,16,'#FFF8DF','center',4);
  const bst=getBest(diff);if(bst>0)outlineText('ベスト（'+DIFF[diff].name+'） '+bst.toLocaleString('en-US'),W/2,by+82,14,'#FFF06A','center',4);
}

// ===== 本日の一服（共有カード）=====
function makeCard(){
  const c=document.createElement('canvas');c.width=900;c.height=1400;const x=c.getContext('2d');
  const navy='#071536',cream='#FFF8DF';
  const rr=(X,Y,w,h,r)=>{x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()};
  x.fillStyle='#EAF3C8';x.fillRect(0,0,900,1400);
  rr(24,24,852,1352,64);x.fillStyle=cream;x.fill();x.lineWidth=20;x.strokeStyle=navy;x.stroke();
  x.textAlign='center';x.textBaseline='middle';
  x.font='900 70px '+FONT;x.fillStyle=navy;x.fillText('本日の一服',450,118);
  const d=new Date();x.font='800 30px '+FONT;x.fillStyle='#8A8066';x.fillText(d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')+'　'+G.D.name,450,180);
  // 葉っぱ
  x.fillStyle='#A8DD3E';x.strokeStyle=navy;x.lineWidth=7;
  x.beginPath();x.moveTo(90,70);x.bezierCurveTo(134,72,162,96,165,136);x.bezierCurveTo(122,134,95,110,90,70);x.fill();x.stroke();
  x.beginPath();x.moveTo(810,70);x.bezierCurveTo(766,72,738,96,735,136);x.bezierCurveTo(778,134,805,110,810,70);x.fill();x.stroke();
  x.strokeStyle='#D8CBAA';x.lineWidth=8;x.lineCap='round';x.beginPath();x.moveTo(80,222);x.lineTo(820,222);x.stroke();
  // 茶碗
  let layers=G.history.slice(-4);if(!layers.length)layers=['normal'];
  const cx=450,rimY=420,rx=300,ry=74,botY=740;
  const body=()=>{x.beginPath();x.moveTo(cx-rx,rimY);x.bezierCurveTo(cx-rx+6,rimY+250,cx-170,botY,cx,botY);x.bezierCurveTo(cx+170,botY,cx+rx-6,rimY+250,cx+rx,rimY);x.closePath()};
  // 高台
  x.fillStyle='#E9DCC0';x.strokeStyle=navy;x.lineWidth=14;x.lineJoin='round';
  x.beginPath();x.moveTo(cx-95,botY-14);x.lineTo(cx-105,botY+36);x.lineTo(cx+105,botY+36);x.lineTo(cx+95,botY-14);x.closePath();x.fill();x.stroke();
  x.save();body();x.clip();
  const top=rimY+10,hh=(botY-top)/layers.length;
  layers.forEach((k,i)=>{x.fillStyle=TEA[k].col;x.fillRect(0,botY-(i+1)*hh-1,900,hh+2)});
  x.globalAlpha=.18;x.fillStyle='#fff';x.fillRect(cx-rx,top,rx*.5,botY-top);x.globalAlpha=1;
  for(let i=1;i<layers.length;i++){x.strokeStyle='rgba(7,21,54,.25)';x.lineWidth=4;x.beginPath();x.moveTo(0,botY-i*hh);x.lineTo(900,botY-i*hh);x.stroke()}
  x.restore();
  body();x.strokeStyle=navy;x.lineWidth=18;x.stroke();
  x.beginPath();x.ellipse(cx,rimY,rx,ry,0,0,Math.PI*2);x.fillStyle='#F7EFD9';x.fill();x.lineWidth=18;x.stroke();
  x.beginPath();x.ellipse(cx,rimY+4,rx-36,ry-22,0,0,Math.PI*2);x.fillStyle=TEA[layers[layers.length-1]].col;x.fill();x.lineWidth=10;x.stroke();
  x.beginPath();x.ellipse(cx-60,rimY-6,90,14,0,0,Math.PI*2);x.fillStyle='rgba(255,255,255,.35)';x.fill();
  if(G.victory&&IMG['result-tea-pillar']){x.drawImage(IMG['result-tea-pillar'],cx+30,rimY-150,62,152)}
  // 染まり順ラベル
  x.font='800 30px '+FONT;x.fillStyle='#8A8066';
  x.fillText(layers.map(k=>TEA[k].name).join(' → '),450,botY+80);
  // カメレオン
  const fk=G.matchaT>0?'matcha':G.type,ci=IMG[TEA[fk].spr];
  if(ci){const w=250,h=w*ci.height/ci.width;x.drawImage(ci,100,960-h/2,w,h)}
  // はんこ
  if(G.victory&&IMG['result-victory-stamp']){x.save();x.translate(690,962);x.rotate(-.14);x.drawImage(IMG['result-victory-stamp'],-105,-105,210,210);x.restore()}
  else{x.font='900 44px '+FONT;x.fillStyle='#8A8066';x.fillText('またの一服を。',640,962)}
  // 数値
  x.strokeStyle='#D8CBAA';x.lineWidth=8;x.beginPath();x.moveTo(80,1060);x.lineTo(820,1060);x.stroke();
  const cells=[['捕食',G.eaten+' 匹'],['最高レベル','Lv'+G.maxLv],['スコア',G.score.toLocaleString('en-US')],['最終形態',TEA[fk].name]];
  cells.forEach(([l,v],i)=>{const X=i%2?480:100,Y=1110+(i/2|0)*120;
    x.textAlign='left';x.font='800 32px '+FONT;x.fillStyle='#8A8066';x.fillText(l,X,Y);
    x.font='900 54px '+FONT;x.fillStyle=navy;x.fillText(v,X,Y+52)});
  x.textAlign='center';x.font='800 28px '+FONT;x.fillStyle='#8A8066';x.fillText('抹茶カメレオン',450,1338);
  return c.toDataURL('image/png');
}

// ===== ループ =====
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000;last=now;if(dt>.05)dt=.05;
  if(mode==='play')update(dt);
  draw();
  requestAnimationFrame(loop);
}
window.MC={get G(){return G},get mode(){return mode},start:startGame,skipToBoss(){if(G){G.t=BOSS_AT-.1}},fill(){if(G)addGauge(100)}};
Promise.all([loadImages(),document.fonts?document.fonts.load('900 20px MCR','抹茶').catch(()=>{}):0]).then(()=>{last=performance.now();requestAnimationFrame(loop)});
