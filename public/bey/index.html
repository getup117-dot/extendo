<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ベイ出没マップ → Beybe Radar に引っ越しました</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="4;url=/radar/">
<link rel="canonical" href="/radar/">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{display:grid;place-items:center;padding:24px;background:#0f2a35;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;text-align:center}
.card{max-width:420px;width:100%;background:#163441;border:1px solid #2c5160;border-radius:22px;padding:32px 24px}
.mark{width:56px;height:56px;margin:0 auto 18px;border:4px solid #42e4ce;border-radius:50%;display:grid;place-items:center;position:relative}
.mark:before{content:"";position:absolute;width:30px;height:30px;border:4px solid #fff;border-radius:50%}
.mark:after{content:"";width:10px;height:10px;background:#ff6b4a;border-radius:50%;z-index:1}
h1{font-size:20px;line-height:1.5;margin-bottom:12px}
p{font-size:14px;line-height:1.8;color:#b9cbd2}
a.btn{display:block;margin-top:24px;padding:15px;border-radius:14px;background:#ff6b4a;color:#fff;font-weight:800;font-size:16px;text-decoration:none}
small{display:block;margin-top:14px;font-size:12px;color:#8aa3ad}
</style>
</head>
<body>
<main class="card">
  <div class="mark" aria-hidden="true"></div>
  <h1>ベイ出没マップは<br>「Beybe Radar」に引っ越しました</h1>
  <p>近くのブレーダー探しも、出没予定の登録も、新しいアプリでできます。ニックネームだけですぐ始められます。</p>
  <a class="btn" href="/radar/">Beybe Radar をひらく</a>
  <small>数秒後に自動で移動します</small>
</main>
<script>setTimeout(function(){location.replace('/radar/'+location.hash.replace(/^#admin$/,''))},4000)</script>
</body>
</html>
