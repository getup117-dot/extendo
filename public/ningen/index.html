<html lang="ja">

<meta property="og:description" content="人間を自称する対話システムを尋問し、AIだと判定せよ。発言の食い違いを見つけて突きつける、全5章の短編心理ミステリー。">
<meta property="og:url" content="https://extendo.getup117.workers.dev/ningen/">
<meta property="og:image" content="https://extendo.getup117.workers.dev/img/ogp_ningen.jpg">

<style>
:root{
  --bg:#070a0b; --bg2:#0c1113; --panel:#0f1517; --ink:#d9c79a; --ink2:#f1e3b8; --sub:#6f7f6e; --line:#223029;
  --amb:#ffb340; --red:#ff4b3a; --cyan:#5fd3c4; --grn:#7ee0a0;
  --mono:'IBM Plex Mono',monospace; --sans:'Zen Kaku Gothic New',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000}
body{font-family:var(--sans);color:var(--ink);display:flex;justify-content:center;overflow:hidden}
#app{position:relative;width:100%;max-width:480px;height:100dvh;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden;transition:background 1.2s}
#app::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:20;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px);mix-blend-mode:multiply;opacity:.7}
#app::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:21;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
#app.dim1{background:#0a0b0c}
#app.dim2{background:#0b0809}
#app.dark{--ink:#c9bfae;--amb:#ff6a3a;--line:#2a2222;background:#080506}
header{padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;border-bottom:1px solid var(--line);background:var(--bg2);position:relative;z-index:3}
.hrow{display:flex;justify-content:space-between;align-items:flex-end;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--sub)}
.hrow .live::before{content:"●";color:var(--grn);margin-right:6px;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.2}}
.rate{display:flex;align-items:baseline;justify-content:space-between;margin-top:6px}
.rate .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--sub)}
.rate .num{font-family:var(--mono);font-weight:600;font-size:32px;letter-spacing:-.02em;color:var(--amb);text-shadow:0 0 12px rgba(255,179,64,.5);transition:transform .2s}
.rate .num.bump{transform:scale(1.18)}
.bar{height:6px;background:#141b1d;margin-top:6px;position:relative;overflow:hidden;border:1px solid var(--line)}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#8a5a1a,var(--amb));width:0;transition:width .8s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 10px rgba(255,179,64,.6)}
.bar b{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--red);left:90%}
.bar b::after{content:attr(data-n);position:absolute;top:-12px;left:3px;font-family:var(--mono);font-size:8px;color:var(--red)}
#log{flex:1;overflow-y:auto;padding:14px 12px 20px;display:flex;flex-direction:column;gap:9px;scroll-behavior:smooth;position:relative;z-index:1}
.msg{display:flex;gap:8px;max-width:90%;animation:in .25s ease-out;position:relative}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.msg .av{flex:none;width:26px;height:26px;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--cyan);margin-top:4px;background:var(--panel)}
.bub{background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--cyan);padding:9px 12px 9px 12px;font-size:15px;line-height:1.65;white-space:pre-wrap;word-break:break-word;color:var(--ink2)}
.bub::before{content:attr(data-ts);display:block;font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--sub);margin-bottom:3px}
.me{align-self:flex-end}
.me .bub{background:#1a1a12;border-color:#3a3420;border-left:none;border-right:2px solid var(--amb);color:var(--ink2)}
.sys{align-self:stretch;font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--sub);line-height:1.7;padding:4px 8px;white-space:pre-wrap;border-left:1px dashed var(--line)}
.sys::before{content:"> "}
.sys.warn{color:var(--red);border-color:var(--red)}
.sys.guide{color:var(--grn);border-color:var(--grn);background:rgba(126,224,160,.05)}
.typing .bub{display:flex;gap:4px;padding:12px 14px}
.typing .bub::before{display:none}
.typing .bub span{width:5px;height:5px;background:var(--cyan);border-radius:50%;animation:dot 1s infinite}
.typing .bub span:nth-child(2){animation-delay:.15s}.typing .bub span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.25}30%{opacity:1}}
.rec{align-self:center;width:94%;background:#e9e2cf;color:#1b1a16;font-size:13px;animation:in .3s;box-shadow:0 6px 20px rgba(0,0,0,.6);transform:rotate(-.4deg);position:relative}
.rec::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(0,0,0,.015) 6px 7px);pointer-events:none}
.rec h4{font-family:var(--mono);font-size:10px;letter-spacing:.14em;padding:8px 10px;border-bottom:1px solid #1b1a16;display:flex;justify-content:space-between;background:#d8cfb4}
.rec dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:10px 10px 10px}
.rec dt{color:#6b6657;font-size:12px}
.rec dd{font-weight:500}
.rec .note{padding:0 10px 9px;font-size:11px;color:#6b6657}
.rec.locked{background:#2a2a24;color:#9a9484;border:1px dashed #5a5546;transform:none;box-shadow:none}
.rec.locked h4{background:none;border-color:#5a5546}
.glitch{animation:gl .35s steps(2) 3}
@keyframes gl{0%{transform:translate(0)}25%{transform:translate(-3px,1px);filter:hue-rotate(80deg)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,0);opacity:.6}}
#dock{border-top:1px solid var(--line);background:var(--bg2);padding:10px 12px calc(env(safe-area-inset-bottom) + 12px);position:relative;z-index:3}
.dlabel{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--sub);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;min-height:16px}
.dlabel.guide{color:var(--grn)}
.acts{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:8px}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
.act{border:1px solid var(--line);background:var(--panel);padding:12px 4px 10px;font-size:15px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .1s,background .2s;position:relative;color:var(--ink2)}
.act small{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--sub);font-weight:400}
.act:active{transform:scale(.97)}
.act.pulse{border-color:var(--amb);color:var(--amb);animation:pulse 1.1s infinite}
.act.pulse small{color:var(--amb)}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(255,179,64,.22),0 0 18px rgba(255,179,64,.35)}}
.act:disabled{opacity:.22}
.note-btn{border:1px solid var(--line);padding:0 12px;font-size:12px;font-weight:700;position:relative;background:#121a1c;color:var(--ink)}
.note-btn:disabled{opacity:.22}
.badge{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;border-radius:8px;background:var(--amb);color:#000;font-size:10px;font-family:var(--mono);display:none;place-items:center;padding:0 4px}
.badge.on{display:grid}
.choices{display:flex;flex-direction:column;gap:7px;max-height:42dvh;overflow-y:auto}
.ch{border:1px solid var(--line);background:var(--panel);padding:11px 12px;text-align:left;font-size:14px;line-height:1.5;display:flex;justify-content:space-between;gap:8px;align-items:center;color:var(--ink2)}
.ch:active{background:#162022}
.ch:disabled{opacity:.35}
.ch.hl{border-color:var(--amb)}
.ch .tag{flex:none;font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--sub);border:1px solid var(--line);padding:2px 5px}
.ch .tag.seen{background:#1a2224}
.ch.str{flex-direction:column;align-items:flex-start;gap:2px}
.ch.str b{font-size:15px}
.ch.str span{font-size:11.5px;color:var(--sub)}
.ch.str.s1 b{color:var(--grn)}
.ch.str.s2 b{color:var(--amb)}
.ch.str.s3{border-color:var(--red)}
.ch.str.s3 b{color:var(--red)}
.back{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--sub);padding:4px 0 4px 8px}
.topic{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.topic .ch{justify-content:center;font-weight:700}
.picked{font-size:12px;border-left:3px solid var(--amb);padding:4px 8px;margin-bottom:8px;background:#121a1c;line-height:1.5}
.grp{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--sub);padding:4px 0 0}
.ov{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;background:var(--bg);overflow-y:auto}
.hide{display:none!important}
#title{justify-content:center;align-items:center;text-align:center;padding:32px;gap:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.35) 45%,rgba(0,0,0,.8) 100%),url(assets/title.jpg) center bottom/cover #000}
#title .boot{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--sub);text-align:left;width:100%;max-width:320px;line-height:1.9;min-height:120px;margin-bottom:10px}
#title .boot b{color:var(--grn);font-weight:400}
#title .kicker{font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--sub)}
#title h1{font-weight:900;font-size:44px;letter-spacing:.02em;margin:14px 0 6px;line-height:1.2;color:var(--ink2);text-shadow:0 0 18px rgba(255,179,64,.25)}
#title h1 span{display:inline-block}
#title .en{font-family:var(--mono);font-size:12px;letter-spacing:.4em;color:var(--amb);margin-bottom:34px}
#title .lead{font-size:13.5px;line-height:2;color:var(--ink);margin-bottom:30px}
.start{border:1px solid var(--amb);background:var(--amb);color:#000;padding:15px 36px;font-size:15px;font-weight:700;letter-spacing:.1em;box-shadow:0 0 22px rgba(255,179,64,.35)}
#title .fine{margin-top:18px;font-size:11px;color:var(--sub);line-height:1.8}
#title label{display:inline-flex;gap:6px;align-items:center;margin-top:6px}
#note{padding:calc(env(safe-area-inset-top) + 16px) 16px 24px}
#note h3{font-family:var(--mono);font-size:11px;letter-spacing:.16em;margin:18px 0 8px;color:var(--sub)}
#note .row{border-bottom:1px solid var(--line);padding:10px 2px;font-size:14px;line-height:1.55;display:flex;justify-content:space-between;gap:8px;color:var(--ink2)}
#note .row .tag{font-family:var(--mono);font-size:9px;color:var(--amb);flex:none;padding-top:3px}
#note .row.rec-row{cursor:pointer}
#note .empty{font-size:12px;color:var(--sub);padding:8px 2px}
.close{position:sticky;top:0;align-self:flex-end;border:1px solid var(--ink);padding:6px 14px;font-size:12px;font-weight:700;background:var(--bg)}
#result{padding:calc(env(safe-area-inset-top) + 32px) 22px 36px;background:#050607;color:#e9e7e1}
#result .k{font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:#8a8983}
#result .big{font-family:var(--mono);font-size:56px;font-weight:600;color:var(--amb);margin:6px 0 2px;letter-spacing:-.02em;text-shadow:0 0 18px rgba(255,179,64,.5)}
#result .meters{margin:26px 0;display:flex;flex-direction:column;gap:12px}
#result .m{display:grid;grid-template-columns:64px 1fr 28px;gap:10px;align-items:center;font-size:12px}
#result .m .t{height:6px;background:#1a1c1e;position:relative}
#result .m .t i{position:absolute;inset:0 auto 0 0;background:#e9e7e1}
#result .m .v{font-family:var(--mono);text-align:right;color:#8a8983}
#result .style{border:1px solid #2c2f33;padding:16px;margin-bottom:22px}
#result .style b{font-size:20px;display:block;margin:4px 0 8px}
#result .style p{font-size:13px;line-height:1.85;color:#bdbbb4}
#result .last{font-size:15px;line-height:1.9;margin:8px 0 26px;padding-left:12px;border-left:2px solid var(--amb)}
#result .found{font-size:12px;color:#8a8983;line-height:1.9;margin-bottom:22px}
#result .found b{color:#e9e7e1}
#result .next{font-size:12.5px;line-height:1.9;color:#8a8983;margin-bottom:28px}
#result .next b{color:#e9e7e1;font-size:15px;display:block;margin-bottom:2px}
#result .start{width:100%}
#result .sent{font-family:var(--mono);font-size:10px;color:#6b6a65;text-align:center;margin-top:18px;letter-spacing:.06em}
#stamp{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) rotate(-8deg) scale(2.4);font-weight:900;font-size:62px;color:var(--red);border:5px solid var(--red);padding:2px 18px;opacity:0;pointer-events:none;z-index:8;letter-spacing:.06em;background:rgba(7,10,11,.8);text-shadow:0 0 16px rgba(255,75,58,.7)}
#stamp.go{animation:stamp .9s cubic-bezier(.2,1.4,.4,1) forwards}
#stamp.small{font-size:34px;border-width:3px}
@keyframes stamp{0%{opacity:0;transform:translate(-50%,-50%) rotate(-8deg) scale(2.4)}25%{opacity:1;transform:translate(-50%,-50%) rotate(-8deg) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) rotate(-8deg) scale(1)}}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
#flash{position:absolute;inset:0;background:var(--red);opacity:0;pointer-events:none;z-index:7}
#flash.go{animation:fl .4s}
@keyframes fl{0%{opacity:.28}100%{opacity:0}}
#noise{position:absolute;inset:0;pointer-events:none;z-index:9;opacity:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.18) 0 1px,transparent 1px 3px)}
#noise.go{animation:nz .6s steps(3) 2}
@keyframes nz{0%{opacity:.9;transform:translateY(0)}50%{opacity:.4;transform:translateY(-6px)}100%{opacity:0}}
.goalbar{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--sub);margin-top:7px;display:flex;justify-content:space-between;align-items:center;white-space:nowrap}
.goalbar b{color:var(--amb);font-weight:400}
#mute{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--sub);border:1px solid var(--line);padding:2px 6px;margin-left:8px;flex:none}
.ch .new{flex:none;font-family:var(--mono);font-size:9px;color:#000;background:var(--amb);padding:1px 5px}
#note .tbtn{flex:none;font-family:var(--mono);font-size:10px;border:1px solid var(--amb);color:var(--amb);padding:3px 8px}
.bub.typing-txt::after{content:"▍";color:var(--cyan);animation:blink .7s infinite}
#chap{position:absolute;inset:0;z-index:30;background:#000;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;opacity:0;transition:opacity .5s;cursor:pointer}
#chap.show{opacity:1}
#chap .cno{font-family:var(--mono);font-size:11px;letter-spacing:.5em;color:var(--amb)}
#chap .ctt{font-size:30px;font-weight:900;color:#f1e3b8;letter-spacing:.06em;text-shadow:0 0 18px rgba(255,179,64,.3)}
#chap .csub{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:#6f7f6e}
#chap .ctap{position:absolute;bottom:40px;font-family:var(--mono);font-size:9px;letter-spacing:.3em;color:#3a4440}
.scene{align-self:stretch;border:1px solid var(--line);background:#050607;animation:in .6s}
#log > *{flex-shrink:0}
.scene{overflow:hidden;position:relative}
.scene svg,.scene img{display:block;width:100%;height:auto}
.scene img{animation:kb 14s ease-out forwards}
@keyframes kb{from{transform:scale(1.08)}to{transform:scale(1)}}
.scene .ward{position:relative;overflow:hidden}
.scene .ecgov{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:screen;opacity:.7}
.scene .ecg{stroke-dasharray:120;animation:ecg 2.4s linear infinite}
@keyframes ecg{from{stroke-dashoffset:120}to{stroke-dashoffset:-120}}
.scene .scap{font-size:12px;color:var(--sub);padding:8px 10px;border-top:1px solid var(--line);line-height:1.7}
.memo{align-self:center;width:80%;background:#f3ecd8;color:#2a2620;padding:18px 18px 12px;transform:rotate(1.2deg);box-shadow:0 6px 20px rgba(0,0,0,.6);animation:in .4s}
.memo .hand{font-size:18px;line-height:1.9;font-weight:500;letter-spacing:.04em;font-family:'Zen Kaku Gothic New',sans-serif}
.memo .mcap{font-size:11px;color:#7a7262;margin-top:10px;border-top:1px dashed #c9bfa6;padding-top:6px}
.photo{align-self:center;width:72%;background:#efe9da;padding:10px 10px 14px;transform:rotate(-1.6deg);box-shadow:0 6px 20px rgba(0,0,0,.6);animation:in .4s}
.photo img{display:block;width:100%;height:auto;filter:sepia(.35) contrast(.95) brightness(.95)}
.photo .pcap{font-size:11px;color:#6b6352;margin-top:8px;line-height:1.6}
.ch.danger{border-color:var(--red);color:var(--red)}
#result.end{background:#050607}
#result.end::before{content:"";position:absolute;left:0;right:0;top:0;height:min(120vw,580px);background:var(--endimg) center top/cover;opacity:.75;pointer-events:none;-webkit-mask-image:linear-gradient(180deg,#000 30%,transparent 100%);mask-image:linear-gradient(180deg,#000 30%,transparent 100%)}
#result.end > *{position:relative}
#result.endA{--endimg:url(assets/end_a.jpg)}
#result.endB{--endimg:url(assets/room.jpg)}
#result.endC{--endimg:url(assets/ward_close.jpg)}
#result.endD{--endimg:url(assets/end_d.jpg)}
#result.end .k:first-child{margin-top:min(62vw,300px)}
#result .etitle{font-size:26px;font-weight:900;color:#f1e3b8;margin:10px 0 22px;line-height:1.4}
#result.endA .etitle{color:var(--red)}
#result.endC .etitle{color:var(--cyan)}
#result.endD .etitle{color:var(--amb)}
#result .ebody p{font-size:14px;line-height:2;color:#cfc8b8;margin-bottom:14px}
#result .ends{display:flex;gap:8px;margin:10px 0 26px}
#result .ends span{width:38px;height:38px;border:1px solid #2c2f33;display:grid;place-items:center;font-family:var(--mono);color:#3a3c40}
#result .ends span.on{border-color:var(--amb);color:var(--amb)}
.start.ghost{background:none;color:var(--ink);border-color:var(--line);box-shadow:none;margin-top:10px}
a.home-link{display:block;margin-top:22px;font-size:11px;color:var(--sub);text-align:center;letter-spacing:.06em}
#app.hitstop{filter:contrast(1.7) brightness(1.3)}
#result .aicount{font-family:var(--mono);font-size:30px;color:#e9e7e1;margin:6px 0 22px}
#result .aicount small{display:block;font-family:var(--sans);font-size:12px;color:#8a8983;margin-top:2px}
a.skip-pre{display:block;margin-top:16px;font-size:12px;color:var(--sub);text-decoration:underline}

.delbox{display:flex;flex-direction:column;gap:10px}
.delbtn{position:relative;border:2px solid var(--red);background:linear-gradient(180deg,#3a0d08,#1a0604);color:#ffd9d2;padding:20px 12px;font-size:20px;font-weight:900;letter-spacing:.12em;text-shadow:0 0 12px rgba(255,75,58,.8);box-shadow:0 0 0 0 rgba(255,75,58,.6),0 0 24px rgba(255,75,58,.35) inset;animation:delpulse 1.2s infinite}
.delbtn small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:#ff8a7a;font-weight:400;margin-top:4px;text-shadow:none}
.delbtn:active{transform:scale(.97)}
@keyframes delpulse{50%{box-shadow:0 0 0 6px rgba(255,75,58,.18),0 0 34px rgba(255,75,58,.5) inset}}

async function ritsu(lines, opt={}){
  if(typeof lines === 'string') lines=[lines];

    const m = el('div','msg ritsu'); const b = el('div','bub'); b.dataset.ts = ts(SUBJ.id);

    await typeOut(b, txt);
    if(opt.glitch){ m.classList.add('glitch'); }

}

function matchContra(t, e){

function doPoint(lv){
  const t = pick.t, e = pick.e;
  act(async()=>{
    S.attempts++;

    await me(st.line(TESTI[t].short, eText));
    const hit = matchContra(t, e.id);
    if(hit && S.proven.has(hit.id)){
      await ritsu(SAME);
      return;
    }
    if(!hit){
      SE.wrong(); shake();
      if(t==='curry' || e.id==='curry' || t==='family' || e.id==='family'){
        await ritsu(['ちくわぶのどこが矛盾なんですか！','謝ってください。ちくわぶに。']);

      else await sys('指摘は成立しませんでした'+(lv===1?'（確認なので減点なし）':''), true);

    }

    }

      await ritsu(hit.r[lv]);
      await sys(`最初の指摘が成立。AI判定率 +${add.toFixed(1)}%`);
      await sys('これが検査の流れです。\n「質問」で証言を集め、「照合」で記録を取り寄せ、食い違いを「指摘」する。\n強く言い切るほど判定率は上がり、外すと下がります。', 'guide');

function deleteButton(label, sub, noLabel){

function runDelete(ms, who, events=[]){
  return new Promise(async res=>{
    if(FAST) ms = Math.min(ms, 1200);
    dock.innerHTML = `<div class="delprog"><div class="dl"><span>DELETING ${esc(who)}</span><b id="dpct">0%</b></div><div class="db"><i id="dbar"></i></div><div class="dsub" id="dsub">受検者データを削除しています</div></div>`;
    const from = S.rate, t0 = performance.now(); let lastTick = -1, queue = Promise.resolve(); const fired = new Set();
    const step = now => {
      const k = Math.min(1, (now-t0)/ms), pct = Math.floor(k*100);
      $('#dpct').textContent = pct+'%'; $('#dbar').style.width = (k*100)+'%';
      const r = from + (100-from)*k; $('#rate').textContent = (k>=1?'100.0':r.toFixed(1))+'%'; $('#barI').style.width = r+'%';
      if(pct !== lastTick && pct%2===0){ lastTick = pct; tone(400+pct*9, .03, 'square', .018); }
      events.forEach((e,i)=>{ if(!fired.has(i) && pct>=e[0]){ fired.add(i); queue = queue.then(e[1]); } });
      if(k<1) requestAnimationFrame(step); else queue.then(res);
    };
    requestAnimationFrame(step);
  });
}

  const w = el('div','word', `${esc(word)}<small>${esc(sub)}</small>`); b.appendChild(w);
