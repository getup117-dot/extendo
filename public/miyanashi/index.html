*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#1b1430}
body{display:flex;justify-content:center;font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation;overscroll-behavior:none;-webkit-touch-callout:none}
#phone{width:100%;max-width:420px;min-height:100%;background:linear-gradient(160deg,#dfe2ea,#a7acbc 60%,#8d93a5);padding:10px 10px 16px;display:flex;flex-direction:column;align-items:center;gap:8px}
#brand{font-size:10px;font-weight:900;letter-spacing:3px;color:#5c6274}
#screen{width:min(100%,calc((100dvh - 190px) * 0.8));background:#000;border:4px solid #3a3d48;border-radius:8px;overflow:hidden}
#status{display:flex;justify-content:space-between;align-items:center;background:#0b1a44;color:#cfe3ff;font-size:10px;padding:2px 6px;font-weight:bold;letter-spacing:1px}
.ant{display:inline-flex;align-items:flex-end;gap:1px;height:9px;margin-right:3px}
.ant i{display:block;width:3px;background:#cfe3ff}
.bat{display:inline-block;width:18px;height:8px;border:1px solid #cfe3ff;padding:1px;position:relative}
.bat::after{content:"";position:absolute;right:-3px;top:2px;width:2px;height:3px;background:#cfe3ff}
.bat i{display:block;height:100%;width:70%;background:#7dff9a}
canvas{display:block;width:100%;aspect-ratio:240/300;image-rendering:pixelated;touch-action:manipulation}
#soft{display:flex;justify-content:space-between;background:#0b1a44;padding:3px 4px}
#soft button{background:none;border:none;color:#ffe680;font-size:11px;font-weight:bold;font-family:inherit;padding:2px 6px}
#keys{width:100%;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.key{position:relative;border:none;border-radius:14px 14px 20px 20px;background:linear-gradient(#ffffff,#d6d9e2);box-shadow:0 4px 0 #6d7180,0 6px 10px rgba(0,0,0,.3);padding:9px 4px 10px;font-family:inherit;color:#222;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:78px;overflow:hidden;touch-action:manipulation}
.key.on{transform:translateY(3px);box-shadow:0 1px 0 #6d7180}
.key .n{font-size:22px;font-weight:900;line-height:1}
.key .l{font-size:10.5px;font-weight:900;line-height:1.25;position:relative;z-index:2}
.key .cd{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(40,40,60,.35);z-index:1}
.key .g{position:absolute;left:0;bottom:0;height:6px;width:0;background:linear-gradient(90deg,#ff8a00,#ffd23f);z-index:1}
#k1 .n{color:#e8383d}#k2 .n{color:#1aa6d6}#k3 .n{color:#ff8a00}
.key.full{animation:glow .35s infinite alternate}
@keyframes glow{from{background:#fff6c0}to{background:#ffc94a}}
#hint{font-size:9px;color:#5c6274;font-weight:bold}
</style>

let AC=null,master=null,muted=false;
function initAudio(){if(AC){if(AC.state==='suspended')AC.resume().catch(()=>{});return;}try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);}catch(e){AC=null;}}
function tone(f,d,type='square',v=.15,f2=null,delay=0){if(!AC||muted)return;const t=AC.currentTime+delay;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03);}
const SFX={
hop(){tone(220,.25,'square',.12,880);},
land(){tone(130,.18,'triangle',.3,45);tone(90,.12,'square',.06,40);},
tele(){tone(1500,.35,'sawtooth',.07,300);tone(1900,.3,'square',.04,500,.05);},
nya(){[0,.16,.32].forEach((d,i)=>tone(700+i*120,.15,'sine',.22,1150+i*100,d));tone(520,.45,'square',.07,1300,.55);},
kill(){tone(660,.08,'square',.1,1320);},
hurt(){tone(220,.35,'sawtooth',.16,55);},
boss(){tone(320,.1,'square',.16,150);tone(150,.22,'square',.12,70,.08);},
warn(){for(let i=0;i<5;i++)tone(880,.12,'square',.1,null,i*.3);},
clear(){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.2,'square',.12,null,i*.12));},
over(){[392,349,311,262].forEach((f,i)=>tone(f,.3,'triangle',.18,null,i*.25));},
ng(){tone(150,.12,'square',.08);},
sel(){tone(988,.06,'square',.08);tone(1319,.1,'square',.08,null,.06);}
};
const N=n=>440*Math.pow(2,(n-69)/12);
const MEL=[72,0,76,79,76,0,72,0,74,0,77,81,79,77,76,74,72,0,76,79,84,0,81,79,77,76,74,76,72,0,0,0];
const MELB=[64,64,0,67,0,64,70,0,69,69,0,67,0,65,64,0,64,64,0,67,0,72,71,0,70,0,69,0,67,0,68,0];
const BASS=[48,48,55,55,53,53,55,55],BASSB=[40,40,43,43,46,46,47,47];
let bgm=null,bStep=0,bNext=0;
function bgmStart(type){if(!AC)return;bgm=type;bStep=0;bNext=AC.currentTime+.05;}
function bgmStop(){bgm=null;}
function bgmTick(){if(!AC||!bgm||muted||S.paused)return;const sp=bgm==='boss'?.11:.13;const mel=bgm==='boss'?MELB:MEL,bs=bgm==='boss'?BASSB:BASS;
 if(bNext<AC.currentTime-.2)bNext=AC.currentTime+.02;
 while(bNext<AC.currentTime+.12){const dl=Math.max(0,bNext-AC.currentTime);const m=mel[bStep%32];if(m)tone(N(m),sp*.9,'square',.04,null,dl);if(bStep%4===0)tone(N(bs[(bStep/4)%8]),sp*3.6,'triangle',.1,null,dl);bStep++;bNext+=sp;}}

/* ---------- データ ---------- */
const STAGES=[
 {name:'商店街',sky:['#6fc0ff','#d4f0ff'],bld:'#6c8fc8',win:'#ffe9a0',gnd:'#d69a55',gnd2:'#b3773a'},
 {name:'テレビ局',sky:['#ff8f63','#ffe0a8'],bld:'#8a5a8f',win:'#ffd0f0',gnd:'#9a9aa8',gnd2:'#76768a'},
 {name:'モヤモヤ城',sky:['#1f1442','#6a3c8f'],bld:'#140c28',win:'#c58cff',gnd:'#4b3a5c',gnd2:'#33263f'}];
const S={state:'title',t:0,scroll:0,stage:1,hi:0,paused:false,score:0,hp:3,enemies:[],fx:[],gag:null,lock:0,shake:0,flash:0,nyaT:0};
try{S.hi=+localStorage.getItem('miyanashi_hi')||0;}catch(e){}
const P={x:22,by:GR,vy:0,air:false,pose:'idle',poseT:0,inv:0,teleCD:0,beam:0};

/* ---------- 進行 ---------- */
function newGame(){S.stage=1;S.score=0;S.hp=3;S.gauge=0;startStage();}
function startStage(){S.enemies=[];S.fx=[];S.kills=0;S.spawned=0;S.need=12+S.stage*6;S.spawnT=1.2;S.boss=null;S.combo=0;S.comboT=0;S.nyaT=0;S.state='intro';S.st=0;
 Object.assign(P,{by:GR,vy:0,air:false,pose:'idle',poseT:0,inv:0,teleCD:0,beam:0});bgmStart('main');}
function showGag(text,col,d=.75){S.gag={text,col,t:d,d};}
function addScore(n,x,y,col='#fff'){S.score+=n;S.fx.push({type:'txt',s:'+'+n,x,y,t:0,d:.8,col});}
function poof(x,y,col='#fff'){for(let i=0;i<8;i++){const a=i/8*Math.PI*2;S.fx.push({type:'pt',x,y,vx:Math.cos(a)*70,vy:Math.sin(a)*70-20,t:0,d:.45,col});}}
function box(e){const t=e.ground?e.y:e.y-e.h/2;return{l:e.x,r:e.x+e.w,t,b:t+e.h};}
function pbox(){return{l:P.x+7,r:P.x+25,t:P.by-46,b:P.by};}
function ov(a,b){return a.l<b.r&&a.r>b.l&&a.t<b.b&&a.b>b.t;}

function makeEnemy(kind,x){const st=S.stage;const e={kind,x,t:0,dead:false,hp:1,proj:false};
 if(kind==='bug'){e.w=28;e.h=18;e.ground=true;e.y=GR-e.h;e.vx=38+st*10+Math.random()*12;}
 if(kind==='rock'){e.w=32;e.h=26;e.ground=true;e.y=GR-e.h;e.vx=26+st*5;e.hp=st;}
 if(kind==='bird'){e.w=28;e.h=16;e.ground=false;e.high=st>1&&Math.random()<.4;e.baseY=e.high?146:194;e.y=e.baseY;e.vx=48+st*10+Math.random()*12;}
 if(kind==='ball'){e.w=16;e.h=16;e.ground=true;e.y=GR-16;e.vx=95+st*15;e.proj=true;}
 if(kind==='bubble'){e.w=18;e.h=18;e.ground=false;e.high=Math.random()<.3;e.baseY=e.high?146:194;e.y=e.baseY;e.vx=78+st*12;e.proj=true;}
 S.enemies.push(e);return e;}
function spawn(){const st=S.stage,r=Math.random();const pr=st===1?[.6,1]:st===2?[.42,.8]:[.35,.75];
 const kind=r<pr[0]?'bug':r<pr[1]?'bird':'rock';makeEnemy(kind,W+8);
 if(st>=2&&Math.random()<.18){makeEnemy(kind==='bird'?'bug':'bird',W+40);S.spawned++;}}

function kill(e){if(e.dead)return;e.dead=true;S.combo++;S.comboT=3;const b=box(e);const cx=(b.l+b.r)/2,cy=(b.t+b.b)/2;
 const mult=1+Math.floor(S.combo/10)*.5;
 if(e.proj){addScore(Math.round(200*mult),cx,cy-10,'#ffe680');if(S.boss&&!S.boss.dying)S.fx.push({type:'star',x:cx,y:cy,tx:S.boss.x+28,ty:S.boss.y+20,t:0,d:.32});S.gauge=Math.min(100,S.gauge+6);}
 else{S.kills++;addScore(Math.round((e.kind==='rock'?300:100)*mult),cx,cy-10);S.gauge=Math.min(100,S.gauge+(e.kind==='rock'?14:8));}
 poof(cx,cy,e.kind==='bird'||e.kind==='bubble'?'#dfe6f0':'#c99cff');SFX.kill();}
function hitGround(e){if(e.kind==='rock'&&e.hp>1){e.hp--;e.x+=18;e.hurtT=.2;SFX.boss();S.fx.push({type:'txt',s:'ガキン!',x:e.x+16,y:e.y-6,t:0,d:.5,col:'#ffd23f'});return;}kill(e);}
function landWave(){SFX.land();S.shake=.15;S.fx.push({type:'wave',x:P.x+16,y:GR,t:0,d:.35});
 for(const e of S.enemies){if(e.dead||!e.ground)continue;if(e.x<P.x+118&&e.x+e.w>P.x-12)hitGround(e);}}
function hurt(){if(P.inv>0)return;S.hp--;P.inv=1.6;S.combo=0;S.shake=.3;S.flash=.15;SFX.hurt();showGag('いてっ！','#aaa',.5);
 if(S.hp<=0){S.state='over';S.lock=1.2;bgmStop();SFX.over();saveHi();}}
function saveHi(){if(S.score>S.hi){S.hi=S.score;S.newHi=true;try{localStorage.setItem('miyanashi_hi',S.hi);}catch(e){}}else S.newHi=false;}
function bossDamage(n){const B=S.boss;if(!B||B.dying)return;B.hp-=n;B.flash=.2;SFX.boss();S.shake=.12;
 if(B.hp<=0){B.hp=0;B.dying=2.2;S.enemies.forEach(e=>{if(!e.dead){e.dead=true;const b=box(e);poof((b.l+b.r)/2,(b.t+b.b)/2);}});bgmStop();addScore(5000,B.x+30,B.y-10,'#ffd23f');}}

function gag(k){
 if(S.state!=='play'||S.paused||S.nyaT>0)return;
 if(k===1){if(P.air){SFX.ng();return;}P.air=true;P.vy=-275;P.pose='hop';P.poseT=0;SFX.hop();showGag('お股ホッピング！','#ff4d6d');}
 if(k===2){if(P.teleCD>0){SFX.ng();return;}P.teleCD=.7;P.beam=.3;P.pose='tele';P.poseT=.35;SFX.tele();showGag('眉間からテレパシー！','#29c8ff');}
 if(k===3){if(S.gauge<100){SFX.ng();showGag('ゲージが足りない…','#bbb',.5);return;}S.gauge=0;S.nyaT=1.5;P.pose='nya';P.poseT=1.9;SFX.nya();}
}
function nyaResolve(){S.flash=.3;S.shake=.4;
 for(const e of S.enemies)if(!e.dead)kill(e);
 if(S.boss&&!S.boss.dying){bossDamage(6);S.fx.push({type:'txt',s:'-6',x:S.boss.x+30,y:S.boss.y-8,t:0,d:1,col:'#ff8a00'});}
 for(let i=0;i<9;i++)S.fx.push({type:'cat',x:-20-i*22,y:GR-14-(i%3)*34-Math.random()*10,t:0,d:2.2,v:180+Math.random()*60});}

function update(dt){
 S.t+=dt;S.lock=Math.max(0,S.lock-dt);bgmTick();
 if(S.paused)return;
 S.scroll+=dt*(S.state==='play'?24:12);
 S.shake=Math.max(0,S.shake-dt);S.flash=Math.max(0,S.flash-dt);
 if(S.gag){S.gag.t-=dt;if(S.gag.t<=0)S.gag=null;}
 updFx(dt);
 if(S.state==='intro'){S.st+=dt;if(S.st>2.2)S.state='play';return;}
 if(S.state==='warn'){S.st+=dt;if(S.st>2.4){S.state='play';S.boss={x:262,y:GR-45,w:60,h:45,hp:10+S.stage*4,max:10+S.stage*4,atkT:2.2,flash:0,dying:0,t:0};}return;}
 if(S.state==='clear'){S.st+=dt;return;}
 if(S.state!=='play')return;
 if(S.nyaT>0){S.nyaT-=dt;if(S.nyaT<=0){S.nyaT=0;nyaResolve();}return;}
 // player
 if(P.air){P.vy+=900*dt;P.by+=P.vy*dt;if(P.by>=GR){P.by=GR;P.air=false;P.vy=0;landWave();}}
 P.inv=Math.max(0,P.inv-dt);P.teleCD=Math.max(0,P.teleCD-dt);P.beam=Math.max(0,P.beam-dt);
 if(P.poseT>0){P.poseT-=dt;if(P.poseT<=0)P.pose=P.air?'hop':'idle';}
 if(S.comboT>0){S.comboT-=dt;if(S.comboT<=0)S.combo=0;}
 // spawn
 if(!S.boss){
  if(S.spawned<S.need){S.spawnT-=dt;if(S.spawnT<=0){spawn();S.spawned++;S.spawnT=Math.max(.6,1.7-S.stage*.25-S.spawned*.015)+Math.random()*.4;}}
  else if(S.enemies.length===0){S.state='warn';S.st=0;bgmStop();SFX.warn();return;}
 }
 // enemies
 for(const e of S.enemies){if(e.dead)continue;e.t+=dt;e.x-=e.vx*dt;if(e.hurtT)e.hurtT-=dt;
  if(!e.ground){if(e.high&&e.x<150)e.baseY+=(194-e.baseY)*Math.min(1,dt*2.5);e.y=e.baseY+Math.sin(e.t*5)*4;}}
 // beam
 if(P.beam>0){const by=P.by-40;for(const e of S.enemies){if(e.dead||e.ground)continue;if(e.x+e.w>P.x+16&&Math.abs(e.y-by)<15)kill(e);}}
 // stomp & collision
 const pb=pbox();
 for(const e of S.enemies){if(e.dead)continue;const b=box(e);
  if(e.ground&&P.air&&P.vy>0&&pb.r>b.l+2&&pb.l<b.r-2&&P.by>=b.t&&P.by<=b.t+12){hitGround(e);P.vy=-200;S.fx.push({type:'txt',s:'ふみっ!',x:P.x+16,y:P.by-58,t:0,d:.5,col:'#ff4d6d'});continue;}
  if(ov(pb,b)){if(P.inv<=0){e.dead=true;poof((b.l+b.r)/2,(b.t+b.b)/2,'#888');hurt();if(S.state!=='play')return;}}
  if(b.r<-10)e.dead=true;}
 S.enemies=S.enemies.filter(e=>!e.dead);
 // boss
 const B=S.boss;
 if(B){B.t+=dt;B.flash=Math.max(0,B.flash-dt);
  if(B.dying){B.dying-=dt;if(Math.random()<.4)poof(B.x+Math.random()*60,B.y+Math.random()*45,['#ffd23f','#ff4d6d','#c99cff'][Math.floor(Math.random()*3)]);
   if(B.dying<=0){S.boss=null;const bonus=S.hp*1000;S.score+=bonus;S.bonus=bonus;S.state='clear';S.st=0;SFX.clear();}}
  else if(B.x>172){B.x-=70*dt;}
  else{B.atkT-=dt;if(B.atkT<=0){const r=Math.random();const k=r<.42?'ball':r<.84?'bubble':'bug';const e=makeEnemy(k,B.x-6);if(k==='bubble')e.y=e.baseY;
    B.atkT=Math.max(.75,1.9-S.stage*.25-(1-B.hp/B.max)*.5)+Math.random()*.3;B.mouth=.25;}
   if(B.mouth)B.mouth=Math.max(0,B.mouth-dt);}}
}
function updFx(dt){for(const f of S.fx){f.t+=dt;if(f.type==='pt'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=200*dt;}
 if(f.type==='cat')f.x+=f.v*dt;
 if(f.type==='star'&&f.t>=f.d&&!f.done){f.done=true;bossDamage(1);}}
 S.fx=S.fx.filter(f=>f.t<f.d);}

/* ---------- 描画 ---------- */
function txt(s,x,y,size,fill,stroke='#000',align='center',sw=3){if(typeof align==='number'){sw=align;align='center';}ctx.font=`900 ${size}px ${FONT}`;ctx.textAlign=align;ctx.textBaseline='middle';if(stroke){ctx.lineWidth=sw;ctx.strokeStyle=stroke;ctx.lineJoin='round';ctx.strokeText(s,x,y);}ctx.fillStyle=fill;ctx.fillText(s,x,y);}
function dspr(s,x,y,sc=2){ctx.drawImage(s,Math.round(x),Math.round(y),s.width*sc,s.height*sc);}
function drawBG(){const st=STAGES[S.stage-1];const g=ctx.createLinearGradient(0,0,0,GR);g.addColorStop(0,st.sky[0]);g.addColorStop(1,st.sky[1]);ctx.fillStyle=g;ctx.fillRect(0,0,W,GR);
 if(S.stage===3){ctx.fillStyle='#fff';for(let i=0;i<30;i++){const x=(i*53)%W,y=(i*29)%120;if((i+Math.floor(S.t*2))%5)ctx.fillRect(x,y,1,1);}ctx.fillStyle='#fff3b0';ctx.beginPath();ctx.arc(190,50,16,0,7);ctx.fill();ctx.fillStyle=st.sky[0];ctx.beginPath();ctx.arc(184,46,14,0,7);ctx.fill();}
 else{ctx.fillStyle='rgba(255,255,255,.85)';for(let i=0;i<3;i++){const x=((i*110-S.scroll*.15)%330+330)%330-60;const y=40+i*22;ctx.fillRect(x,y,40,8);ctx.fillRect(x+8,y-6,22,6);}}
 if(S.stage===2){ctx.fillStyle='#c0392b';const tx=((150-S.scroll*.1)%400+400)%400-60;ctx.fillRect(tx+10,70,4,GR-70);ctx.fillRect(tx,120,24,4);ctx.fillRect(tx+4,95,16,3);ctx.fillStyle=(Math.floor(S.t*2)%2)?'#ff4040':'#600';ctx.fillRect(tx+10,64,4,4);}
 for(let i=0;i<9;i++){const bw=30,x=((i*34-S.scroll*.35)%306+306)%306-34;const h=36+((i*37)%5)*13+(S.stage===3&&i%3===0?30:0);ctx.fillStyle=st.bld;ctx.fillRect(x,GR-h,bw,h);
  if(S.stage===3&&i%3===0){ctx.fillRect(x+4,GR-h-8,6,8);ctx.fillRect(x+20,GR-h-8,6,8);}
  ctx.fillStyle=st.win;for(let wy=GR-h+6;wy<GR-8;wy+=10)for(let wx=x+5;wx<x+bw-5;wx+=9)if(((wx+wy+i)>>2)%3)ctx.fillRect(wx,wy,4,5);}
 ctx.fillStyle=st.gnd;ctx.fillRect(0,GR,W,H-GR);ctx.fillStyle=st.gnd2;for(let x=-(S.scroll%16);x<W;x+=16){ctx.fillRect(x,GR,8,3);ctx.fillRect(x+4,GR+16,8,2);}ctx.fillRect(0,GR+30,W,2);}
function drawPlayer(){if(P.inv>0&&Math.floor(P.inv*14)%2)return;
 const walking=P.pose!=='nya'&&P.pose!=='tele'&&!P.air&&P.pose!=='hop';
 const img=P.pose==='nya'?IMG.nya:P.pose==='tele'?IMG.point:walking?IMG.walk[Math.floor(S.t*8)%4]:IMG.hop;
 ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(P.x+4,GR-2,24,3);
 const shake=P.pose==='hop'&&!P.air?0:0;dimg(img,P.x+16+shake,P.by,walking?50:52);
 if(P.pose==='tele'){const gx=P.x+18,gy=P.by-40;ctx.fillStyle='rgba(127,227,255,.5)';ctx.beginPath();ctx.arc(gx,gy,6+Math.sin(S.t*40)*1.5,0,7);ctx.fill();ctx.fillStyle='#e8fbff';ctx.beginPath();ctx.arc(gx,gy,3,0,7);ctx.fill();}
 if(P.pose==='nya'&&Math.floor(S.t*6)%2)txt('にゃ!',P.x+2,P.by-56,8,'#fff','#c96a12',2);}
function drawBeam(){if(P.beam<=0)return;const by=P.by-40,x0=P.x+18,k=P.beam/.3;const th=3+10*k;
 ctx.fillStyle='rgba(41,200,255,.45)';ctx.fillRect(x0,by-th,W-x0,th*2);ctx.fillStyle='#bff4ff';ctx.fillRect(x0,by-th/3,W-x0,th/1.5);
 ctx.strokeStyle='#fff';ctx.lineWidth=1;for(let i=0;i<5;i++){const x=x0+((S.t*400+i*48)%(W-x0));ctx.beginPath();ctx.ellipse(x,by,4,th+3,0,0,7);ctx.stroke();}}
function drawEnemies(){for(const e of S.enemies){const b=box(e);
 if(e.kind==='bug')dspr(Math.floor(e.t*6)%2?SP.bug:SP.bug2,e.x,b.t);
 else if(e.kind==='bird')dspr(SP.bird,e.x,b.t);
 else if(e.kind==='rock'){if(e.hurtT>0&&Math.floor(e.hurtT*30)%2)continue;dspr(SP.rock,e.x,b.t);if(e.hp>1)txt('×'+e.hp,e.x+16,b.t-5,8,'#fff');}
 else if(e.kind==='ball'){const cx=e.x+8,cy=b.t+8;ctx.fillStyle=PAL.M;ctx.beginPath();ctx.arc(cx,cy,8,0,7);ctx.fill();ctx.fillStyle=PAL.m;ctx.beginPath();ctx.arc(cx-1,cy-1,6,0,7);ctx.fill();ctx.strokeStyle='#ffd23f';ctx.lineWidth=1.5;const a=e.t*10;ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*6,cy+Math.sin(a)*6);ctx.lineTo(cx-Math.cos(a)*6,cy-Math.sin(a)*6);ctx.stroke();}
 else if(e.kind==='bubble'){const cx=e.x+9,cy=e.y;ctx.fillStyle='rgba(200,170,255,.55)';ctx.beginPath();ctx.arc(cx,cy,9,0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.stroke();ctx.fillStyle='#fff';ctx.fillRect(cx-4,cy-5,3,3);txt('モヤ',cx,cy+1,6,PAL.M,null);}
 if(e.high&&e.baseY<190&&e.x<W){ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillRect(e.x+10,GR-2,8,2);}}}
function drawBoss(){const B=S.boss;if(!B)return;if(B.flash>0&&Math.floor(B.flash*30)%2)return;if(B.dying&&Math.floor(B.dying*12)%2)return;
 const bob=Math.sin(B.t*3)*2;dspr(SP.boss,B.x,B.y+bob,3);if(B.mouth){ctx.fillStyle='#000';ctx.fillRect(B.x+18,B.y+bob+30,24,6);}
 ctx.fillStyle='rgba(180,140,255,.25)';ctx.beginPath();ctx.ellipse(B.x+30,B.y+22+bob,38,32,0,0,7);ctx.fill();}
function drawFx(){for(const f of S.fx){const k=f.t/f.d;
 if(f.type==='pt'){ctx.fillStyle=f.col;ctx.fillRect(f.x-1.5,f.y-1.5,3,3);}
 if(f.type==='txt'){ctx.globalAlpha=1-k;txt(f.s,f.x,f.y-k*14,9,f.col);ctx.globalAlpha=1;}
 if(f.type==='wave'){ctx.strokeStyle=`rgba(255,240,180,${1-k})`;ctx.lineWidth=3;const r=10+k*110;ctx.beginPath();ctx.ellipse(f.x,f.y,r,r*.25,0,Math.PI,0);ctx.stroke();ctx.beginPath();ctx.ellipse(f.x,f.y,r*.6,r*.15,0,Math.PI,0);ctx.stroke();}
 if(f.type==='star'){const x=f.x+(f.tx-f.x)*k,y=f.y+(f.ty-f.y)*k-Math.sin(k*Math.PI)*30;drawStar(x,y,6,'#ffd23f',S.t*10);}
 if(f.type==='cat'){dspr(SP.cat,f.x,f.y+Math.abs(Math.sin(f.t*18))*-4,2);if(Math.floor(f.t*4)%2)txt('にゃ',f.x+10,f.y-8,7,'#fff','#c96a12',2);}}}
function drawStar(x,y,r,col,rot=0){ctx.fillStyle=col;ctx.beginPath();for(let i=0;i<10;i++){const a=rot+i*Math.PI/5,rr=i%2?r*.45:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}ctx.fill();ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.stroke();}
function burst(x,y,rx,ry,col){ctx.fillStyle=col;ctx.beginPath();const n=18;for(let i=0;i<n*2;i++){const a=i*Math.PI/n,rr=i%2?.78:1;ctx.lineTo(x+Math.cos(a)*rx*rr,y+Math.sin(a)*ry*rr);}ctx.closePath();ctx.fill();ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.stroke();}
function heart(x,y,on){ctx.fillStyle=on?'#ff3b5c':'#444';const p=[[1,0],[2,0],[4,0],[5,0],[0,1],[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[0,2],[1,2],[2,2],[3,2],[4,2],[5,2],[6,2],[1,3],[2,3],[3,3],[4,3],[5,3],[2,4],[3,4],[4,4],[3,5]];for(const[a,b]of p)ctx.fillRect(x+a*1.4,y+b*1.4,1.4,1.4);}
function drawHUD(){ctx.fillStyle='rgba(0,0,30,.72)';ctx.fillRect(0,0,W,30);
 txt('STAGE'+S.stage,4,8,8,'#7fe3ff',null,'left');txt('SCORE '+String(S.score).padStart(6,'0'),62,8,8,'#fff',null,'left');
 for(let i=0;i<3;i++)heart(196+i*14,3,i<S.hp);
 if(S.boss){txt('ダイモヤモヤ',4,21,7,'#ffb0ff',null,'left');ctx.fillStyle='#222';ctx.fillRect(56,18,100,6);ctx.fillStyle='#ff3bd0';ctx.fillRect(56,18,100*S.boss.hp/S.boss.max,6);ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.strokeRect(56,18,100,6);}
 else txt('モヤモヤ軍団 あと'+Math.max(0,S.need-S.spawned+S.enemies.length)+'体',4,21,7,'#ffe680',null,'left');
 txt('にゃ',164,21,7,'#ff9a2e',null,'left');ctx.fillStyle='#222';ctx.fillRect(186,18,50,6);ctx.fillStyle=S.gauge>=100?(Math.floor(S.t*8)%2?'#ffd23f':'#ff8a00'):'#ff8a00';ctx.fillRect(186,18,50*S.gauge/100,6);ctx.strokeStyle='#fff';ctx.strokeRect(186,18,50,6);
 if(S.combo>=3)txt(S.combo+' COMBO!',P.x+20,P.by-64,9,'#ffe680','#c0392b');}
function drawGag(){const g=S.gag;if(!g)return;const k=1-g.t/g.d;const sc=k<.15?.5+k/.15*.6:k<.25?1.1-(k-.15):1;
 ctx.save();ctx.translate(W/2,58);ctx.scale(sc,sc);ctx.rotate(-.04);ctx.globalAlpha=g.t<.15?g.t/.15:1;
 burst(0,0,112,24,'#fff');txt(g.text,0,1,g.text.length>8?17:19,g.col,'#000',4);ctx.restore();ctx.globalAlpha=1;}
function drawCutin(){const k=1-S.nyaT/1.5;ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);
 ctx.save();ctx.translate(W/2,140);ctx.rotate(-.12);ctx.fillStyle='#ff8a00';ctx.fillRect(-200,-46,400,92);ctx.fillStyle='#ffd23f';for(let i=-10;i<10;i++)ctx.fillRect(i*24+((S.t*200)%24),-46,10,92);ctx.restore();
 const px=Math.min(62,-60+k*600);dimg(IMG.nya,px,214,150);
 for(let i=0;i<6;i++){const cx=(i*47+S.t*120)%280-20;dspr(SP.cat,cx,30+(i%3)*14+Math.sin(S.t*8+i)*4,2);}
 if(k>.2){const s=Math.min(1,(k-.2)*6);ctx.save();ctx.translate(166,120);ctx.scale(s,s);ctx.rotate(-.12);txt('おじ',0,-22,22,'#fff','#c0392b',5);txt('にゃにゃ',0,6,22,'#fff','#c0392b',5);txt('ーす！',0,34,22,'#fff','#c0392b',5);ctx.restore();}
 for(let i=0;i<5;i++)drawStar(30+i*45,250+Math.sin(S.t*6+i)*6,6,'#ffd23f',S.t*4+i);}
function overlay(){ctx.fillStyle='rgba(0,0,20,.6)';ctx.fillRect(0,0,W,H);}
function drawTitle(){S.stage=1;drawBG();ctx.fillStyle='rgba(0,0,40,.35)';ctx.fillRect(0,0,W,H);
 ctx.save();ctx.translate(W/2,54);ctx.rotate(-.05);burst(0,0,118,40,'#fff');ctx.restore();
 txt('羊毛タルト宮梨の',W/2,30,10,'#2f4fa8',null);
 txt('ギャグ一発！',W/2,52,24,'#ffd23f','#c0392b',5);txt('大作戦',W/2,78,17,'#ff4d6d','#000',4);
 txt('〜モヤモヤ軍団をぶっとばせ〜',W/2,104,9,'#fff','#000',3);
 const bob=Math.abs(Math.sin(S.t*3))*-6;dimg(IMG.point,W/2+4,GR+bob,118);
 ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(W/2-24,GR-2,48,4);
 if(Math.floor(S.t*2)%2)txt('▼ タップでスタート ▼',W/2,252,11,'#fff','#c0392b',3);
 txt('HI-SCORE '+String(S.hi).padStart(6,'0'),W/2,272,8,'#ffe680','#000',2);
 txt('※パケット定額のご利用をおすすめします',W/2,288,6.5,'#fff','#000',2);}
function drawHowto(){drawBG();overlay();txt('あそびかた',W/2,22,14,'#ffd23f','#c0392b',4);
 const rows=[['1','お股ホッピング','#ff4d6d','ジャンプして着地の衝撃波で','地上の敵をふっとばす！'],['2','眉間からテレパシー','#29c8ff','眉間ビームで','空の敵を撃ちおとす！ジャンプ中もOK'],['3','おじにゃにゃーす！','#ff9a2e','ゲージMAXで発動。','ネコ大行進で画面の敵を全滅！']];
 rows.forEach((r,i)=>{const y=52+i*58;ctx.fillStyle='rgba(255,255,255,.92)';ctx.fillRect(10,y,W-20,50);ctx.strokeStyle=r[2];ctx.lineWidth=2;ctx.strokeRect(10,y,W-20,50);
  txt(r[0],26,y+25,20,r[2],'#000',3);txt(r[1],44,y+13,11,r[2],'#000',3,'left');txt(r[3],44,y+29,8,'#222',null,'left');txt(r[4],44,y+40,8,'#222',null,'left');
  if(i===0)dspr(SP.bug,196,y+16,2);if(i===1)dspr(SP.bird,196,y+14,2);if(i===2)dspr(SP.cat,200,y+16,2);});
 txt('ボス戦は、ボスの攻撃をギャグではね返せ！',W/2,236,8,'#fff','#000',2);
 txt('敵にふれるとダメージ。ハートが0でゲームオーバー',W/2,250,7.5,'#fff','#000',2);
 if(Math.floor(S.t*2)%2)txt('▼ タップでゲーム開始 ▼',W/2,276,11,'#fff','#c0392b',3);}
function rank(){const s=S.score;return s<20000?'前座':s<35000?'二ツ目':s<50000?'真打':'伝説の一発屋';}
function draw(){resetT();ctx.clearRect(0,0,W,H);
 if(S.state==='title'){drawTitle();return;}
 if(S.state==='howto'){drawHowto();return;}
 ctx.save();if(S.shake>0)ctx.translate((Math.random()-.5)*6,(Math.random()-.5)*5);
 drawBG();drawBoss();drawEnemies();drawBeam();drawPlayer();drawFx();ctx.restore();
 if(S.flash>0){ctx.fillStyle=`rgba(255,255,255,${S.flash*2.5})`;ctx.fillRect(0,0,W,H);}
 drawHUD();drawGag();
 if(S.state==='intro'){overlay();txt('STAGE '+S.stage,W/2,110,22,'#ffd23f','#c0392b',5);txt(STAGES[S.stage-1].name,W/2,138,14,'#fff','#000',4);txt(S.st<1.4?'READY…':'GO!!',W/2,178,18,S.st<1.4?'#fff':'#ff4d6d','#000',4);}
 if(S.state==='warn'){if(Math.floor(S.st*4)%2){ctx.fillStyle='rgba(255,0,40,.35)';ctx.fillRect(0,0,W,H);}ctx.fillStyle='#000';ctx.fillRect(0,110,W,60);txt('WARNING!!',W/2,128,20,'#ff3040','#fff',3);txt('ボス「ダイモヤモヤ」出現！',W/2,154,11,'#fff',null);}
 if(S.nyaT>0)drawCutin();
 if(S.state==='clear'){overlay();txt('STAGE CLEAR!!',W/2,96,20,'#ffd23f','#c0392b',5);txt('ライフボーナス +'+S.bonus,W/2,128,10,'#fff','#000',3);txt('SCORE '+S.score,W/2,146,11,'#7fe3ff','#000',3);dimg(IMG.nya,W/2,232,72);
  if(S.st>1.2&&Math.floor(S.t*2)%2)txt(S.stage<3?'▼ タップで次のステージへ ▼':'▼ タップでエンディングへ ▼',W/2,240,10,'#fff','#c0392b',3);}
 if(S.state==='over'){overlay();txt('GAME OVER',W/2,92,24,'#ff4d6d','#000',5);dimg(IMG.hop,W/2+(Math.random()-.5)*2,184,76);txt('宮梨「…おじにゃにゃーす」',W/2,190,10,'#fff','#000',3);txt('SCORE '+S.score,W/2,212,12,'#ffd23f','#000',3);if(S.newHi)txt('★ハイスコア更新！★',W/2,230,10,'#7fe3ff','#000',3);
  if(S.lock<=0&&Math.floor(S.t*2)%2)txt('▼ タップでタイトルへ ▼',W/2,262,10,'#fff','#c0392b',3);}
 if(S.state==='end'){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#ff8a00');g.addColorStop(1,'#ffd23f');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<10;i++)drawStar((i*37+S.t*30)%260-10,(i*53)%300,5,'#fff',S.t*3+i);
  txt('ALL CLEAR!!',W/2,40,24,'#fff','#c0392b',5);txt('モヤモヤ軍団は去った！',W/2,66,11,'#fff','#000',3);
  dimg(IMG.nya,W/2,170,96);for(let i=0;i<4;i++)dspr(SP.cat,30+i*52+(i>1?24:0)-(i>1?0:0),152+Math.abs(Math.sin(S.t*6+i))*-6,2);
  txt('宮梨「みんな、おじにゃにゃーす！」',W/2,182,10,'#fff','#c0392b',3);
  txt('SCORE '+S.score,W/2,206,13,'#fff','#000',3);txt('芸人ランク：'+rank(),W/2,226,12,'#2f4fa8','#fff',3);if(S.newHi)txt('★ハイスコア更新！★',W/2,244,9,'#c0392b','#fff',3);
  txt('THANK YOU FOR PLAYING',W/2,264,8,'#fff','#000',2);if(S.lock<=0&&Math.floor(S.t*2)%2)txt('▼ タップでタイトルへ ▼',W/2,282,9,'#fff','#c0392b',3);}
 if(S.paused){overlay();txt('一時停止中',W/2,130,18,'#fff','#000',4);txt('［ﾒﾆｭｰ］でゲームにもどる',W/2,160,9,'#ffe680',null);}}

/* ---------- 入力 ---------- */
function advance(){
 if(S.state==='title'){SFX.sel();S.state='howto';S.lock=.3;return true;}
 if(S.state==='howto'){if(S.lock>0)return true;SFX.sel();newGame();return true;}
 if(S.state==='clear'){if(S.st>1.2){if(S.stage<3){S.stage++;S.hp=Math.min(3,S.hp+1);startStage();}else{S.state='end';S.lock=1.5;saveHi();bgmStart('main');}}return true;}
 if(S.state==='over'||S.state==='end'){if(S.lock<=0){S.state='title';bgmStop();}return true;}
 return false;}
function press(k){initAudio();if(S.paused)return;if(advance())return;gag(k);}
const keys=[1,2,3].map(i=>document.getElementById('k'+i));
keys.forEach((el,i)=>{el.addEventListener('pointerdown',ev=>{ev.preventDefault();el.classList.add('on');press(i+1);});
 ['pointerup','pointerleave','pointercancel'].forEach(t=>el.addEventListener(t,()=>el.classList.remove('on')));
 el.addEventListener('contextmenu',e=>e.preventDefault());});
cv.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();if(!S.paused)advance();});
document.addEventListener('keydown',e=>{if(e.repeat)return;const m={'1':1,'2':2,'3':3,'z':1,'x':2,'c':3};if(m[e.key]){press(m[e.key]);const el=keys[m[e.key]-1];el.classList.add('on');setTimeout(()=>el.classList.remove('on'),100);}
 else if(e.key===' '||e.key==='Enter'){initAudio();advance();e.preventDefault();}else if(e.key==='p'||e.key==='Escape')togglePause();});
function togglePause(){initAudio();if(['play','intro','warn'].includes(S.state)){S.paused=!S.paused;if(!S.paused&&AC)bNext=AC.currentTime+.05;}}
document.getElementById('sPause').addEventListener('pointerdown',e=>{e.preventDefault();togglePause();});
const sBtn=document.getElementById('sSound');
sBtn.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();muted=!muted;sBtn.textContent=muted?'［音:OFF］':'［音:ON］';if(!muted&&AC)bNext=AC.currentTime+.05;});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&['play','intro','warn'].includes(S.state))S.paused=true;});

/* ---------- ループ ---------- */
const clock=document.getElementById('clock');let lastClock='';
const cd1=keys[0].querySelector('.cd'),cd2=keys[1].querySelector('.cd'),g3=keys[2].querySelector('.g');
function ui(){const d=new Date();const c=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');if(c!==lastClock){clock.textContent=c;lastClock=c;}
 const inPlay=S.state==='play';cd1.style.height=(inPlay&&P.air?100:0)+'%';cd2.style.height=(inPlay?P.teleCD/.7*100:0)+'%';
 g3.style.width=(S.gauge||0)+'%';keys[2].classList.toggle('full',inPlay&&S.gauge>=100);}
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();ui();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
</script>
