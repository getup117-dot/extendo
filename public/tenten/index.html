<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('c'), ctx=cv.getContext('2d');
const app=$('app'), hud=$('hud'), slot=$('slot'), hint=$('hint');
const titleEl=$('title'), clearEl=$('clear'), endEl=$('ending');
const endText=$('endText'), againBtn=$('againBtn'), nextBtn=$('nextBtn'), soundBtn=$('soundBtn');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

const N=5, PAD=.06, CELL=(1-2*PAD)/N;
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(a,b,k)=>a.map((v,i)=>v+(b[i]-v)*k);
const rgb=(a,al=1)=>`rgba(${a[0]|0},${a[1]|0},${a[2]|0},${al})`;
const HUE={pink:'#FF7FA8',mint:'#3FC9A3',lemon:'#FFBA33',sky:'#58B4FF',lilac:'#9C82FF'};
const GREY=[138,128,136];
const cellU=(c,r)=>[PAD+CELL*(c+.5),PAD+CELL*(r+.5)];

function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

/* ---------- 盤面の下にあるもの ----------
   影絵を1枚の画像として持ち、なぞった線の通りに実際に削る。
   線で切り離された塊だけが落ちるので、落ちた物の切り口はプレイヤーが描いた線の形になる。
   座標は盤面の左上=0、右下=1。 */
const R=400, X0=-.1, Y0=-.1, RW=Math.round(1.2*R), RH=Math.round(1.3*R);
const HW=.0075*R+.5, MIN_A=150, THIN=4.5, FLOAT_A=320, INK='#070407';
const STACK=new Int32Array(RW*RH);
const toPx=(u,v)=>[(u-X0)*R,(v-Y0)*R];

const SHAPES={
  /* 吊るしたバナナ。切り落とされた端が落ち、いちばん大きな塊は残る */
  banana:{rule:'largest',density:30,tex:'soft',cut:'crisp',draw(c){
    c.lineCap='round'; c.lineWidth=.09;
    c.beginPath(); c.moveTo(.45,.21); c.quadraticCurveTo(.68,.5,.46,.79); c.stroke();
    c.lineWidth=.028; c.beginPath(); c.moveTo(.45,.21); c.lineTo(.42,.168); c.stroke();
  }},
  /* りんご。半分に割れたら両方落ちる（小さな欠けだけなら欠けが落ちる） */
  apple:{rule:'split',density:22,tex:'crisp',cut:'apple',draw(c){
    c.beginPath(); c.arc(.5,.43,.16,0,Math.PI*2); c.fill();
    c.lineCap='round'; c.lineWidth=.022; c.beginPath(); c.moveTo(.5,.29); c.quadraticCurveTo(.5,.24,.525,.205); c.stroke();
    c.beginPath(); c.ellipse(.565,.225,.045,.02,-.45,0,Math.PI*2); c.fill();
  }},
  /* こけし。台座につながっている部分は残る */
  doll:{rule:'anchor',anchors:[[.5,.89]],density:18,tex:'wood',cut:'wood',draw(c){
    c.beginPath(); c.arc(.5,.31,.13,0,Math.PI*2); c.fill();
    c.beginPath(); c.ellipse(.5,.30,.145,.135,0,Math.PI,Math.PI*2); c.lineTo(.645,.37); c.lineTo(.355,.37); c.closePath(); c.fill();
    c.beginPath(); c.arc(.6,.205,.03,0,Math.PI*2); c.fill();
    c.beginPath(); c.arc(.635,.238,.022,0,Math.PI*2); c.fill();
    c.fillRect(.47,.42,.06,.15);
    rr(c,.37,.55,.26,.34,.06); c.fill();
    c.beginPath(); c.ellipse(.5,.89,.16,.03,0,0,Math.PI*2); c.fill();
  }},
  /* 人。重い塊が切り離されると、少し遅れて残りも崩れ落ちる */
  person:{rule:'anchor',anchors:[[.5,.97]],collapse:true,hair:true,density:32,tex:'flesh',cut:'neck',draw(c){
    c.beginPath(); c.ellipse(.5,.335,.115,.14,0,0,Math.PI*2); c.fill();
    c.beginPath(); c.ellipse(.5,.30,.135,.135,0,0,Math.PI*2); c.fill();
    for(const s of [-1,1]){ c.beginPath(); c.moveTo(.5+s*.135,.30); c.quadraticCurveTo(.5+s*.16,.42,.5+s*.125,.47); c.lineTo(.5+s*.065,.43); c.lineTo(.5+s*.075,.32); c.closePath(); c.fill(); }
    c.fillRect(.465,.44,.07,.17);
    c.beginPath(); c.moveTo(.455,.585); c.bezierCurveTo(.40,.62,.25,.62,.21,.72); c.lineTo(.18,1.0); c.lineTo(.82,1.0); c.lineTo(.79,.72); c.bezierCurveTo(.75,.62,.60,.62,.545,.585); c.closePath(); c.fill();
    c.lineWidth=.008; c.lineCap='round';
    [[.45,.19,.425,.12,.44,.075],[.48,.178,.47,.11,.488,.062],[.52,.178,.535,.11,.515,.068],[.55,.19,.575,.13,.568,.085],[.505,.172,.492,.12,.503,.09]]
      .forEach(q=>{c.beginPath();c.moveTo(q[0],q[1]);c.quadraticCurveTo(q[2],q[3],q[4],q[5]);c.stroke();});
  }}
};

function buildObj(id){
  const sh=SHAPES[id], cvs=document.createElement('canvas'); cvs.width=RW; cvs.height=RH;
  const c=cvs.getContext('2d',{willReadFrequently:true});
  c.setTransform(R,0,0,R,-X0*R,-Y0*R); c.fillStyle=c.strokeStyle=INK; sh.draw(c); c.setTransform(1,0,0,1,0,0);
  const d=c.getImageData(0,0,RW,RH).data, mask=new Uint8Array(RW*RH);
  for(let i=0;i<mask.length;i++) mask[i]=d[i*4+3]>127?1:0;
  return {id,sh,cv:cvs,c,mask,label:new Int32Array(RW*RH),collapsing:false};
}
/* なぞった1マス分の線で削る。削れた量を返す */
function slit(o,p0,p1){
  const [ax,ay]=toPx(p0[0],p0[1]), [bx,by]=toPx(p1[0],p1[1]), r=HW, m=o.mask;
  const x0=Math.max(0,Math.floor(Math.min(ax,bx)-r-1)), x1=Math.min(RW-1,Math.ceil(Math.max(ax,bx)+r+1));
  const y0=Math.max(0,Math.floor(Math.min(ay,by)-r-1)), y1=Math.min(RH-1,Math.ceil(Math.max(ay,by)+r+1));
  const dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy||1; let n=0;
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){
    const i=y*RW+x; if(!m[i]) continue;
    const px=x+.5, py=y+.5; let t=((px-ax)*dx+(py-ay)*dy)/L2; t=t<0?0:t>1?1:t;
    const ex=ax+dx*t-px, ey=ay+dy*t-py; if(ex*ex+ey*ey<=r*r){m[i]=0;n++;}
  }
  if(n){ const c=o.c; c.save(); c.globalCompositeOperation='destination-out'; c.lineCap='round'; c.lineWidth=2*r; c.beginPath(); c.moveTo(ax,ay); c.lineTo(bx,by); c.stroke(); c.restore(); }
  return n;
}
/* つながっている塊ごとに番号を振る */
function labelComps(o){
  const m=o.mask, Lb=o.label, st=STACK, comps=[]; Lb.fill(0); let id=0;
  for(let i=0;i<m.length;i++){
    if(!m[i]||Lb[i]) continue;
    id++; let sp=0; st[sp++]=i; Lb[i]=id;
    let area=0,sx=0,sy=0,minx=RW,miny=RH,maxx=0,maxy=0;
    while(sp){
      const j=st[--sp], x=j%RW, y=(j/RW)|0;
      area++; sx+=x; sy+=y; if(x<minx)minx=x; if(x>maxx)maxx=x; if(y<miny)miny=y; if(y>maxy)maxy=y;
      if(x>0&&m[j-1]&&!Lb[j-1]){Lb[j-1]=id;st[sp++]=j-1;}
      if(x<RW-1&&m[j+1]&&!Lb[j+1]){Lb[j+1]=id;st[sp++]=j+1;}
      if(y>0&&m[j-RW]&&!Lb[j-RW]){Lb[j-RW]=id;st[sp++]=j-RW;}
      if(y<RH-1&&m[j+RW]&&!Lb[j+RW]){Lb[j+RW]=id;st[sp++]=j+RW;}
    }
    comps.push({id,area,cx:sx/area+.5,cy:sy/area+.5,minx,miny,maxx,maxy});
  }
  return comps;
}
function labelNear(o,u,v){
  const [px,py]=toPx(u,v), cx=Math.round(px), cy=Math.round(py);
  for(let r=0;r<=10;r++) for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
    const x=cx+dx, y=cy+dy; if(x<0||y<0||x>=RW||y>=RH) continue; const l=o.label[y*RW+x]; if(l) return l;
  }
  return 0;
}
/* どの塊が落ちるかを決める */
function resolve(o,comps,info){
  const sh=o.sh, big=[], specks=[], hairs=[];
  for(const k of comps){
    /* 細い切れ端は消す。人の髪の毛だけは、ふわりと落とす */
    const thin=k.area/Math.max(k.maxx-k.minx+1,k.maxy-k.miny+1)<THIN;
    if(thin&&sh.hair&&k.area>=14) hairs.push(k);
    else if(thin||k.area<MIN_A) specks.push(k);
    else big.push(k);
  }
  let falls=[];
  if(big.length>1){
    big.sort((a,b)=>b.area-a.area);
    if(sh.rule==='split') falls=big[1].area>=big[0].area*.35?big:big.slice(1);
    else if(sh.rule==='largest') falls=big.slice(1);
    else { const keep=new Set(sh.anchors.map(([u,v])=>labelNear(o,u,v)).filter(Boolean)); falls=big.filter(k=>!keep.has(k.id)); }
  }
  falls=falls.concat(hairs);
  if(!falls.length&&!specks.length) return;
  const made=extract(o,falls,specks,info);
  if(made.length) onCut(o,made);
}
/* 切り離された塊を影絵から抜き取り、落ちる物にする */
function extract(o,falls,specks,info){
  const c=o.c, img=c.getImageData(0,0,RW,RH), d=img.data, Lb=o.label, m=o.mask, made=[], s=board.s;
  for(const k of specks) for(let y=k.miny;y<=k.maxy;y++) for(let x=k.minx;x<=k.maxx;x++){ const i=y*RW+x; if(Lb[i]===k.id){m[i]=0; d[i*4+3]=0;} }
  for(const k of falls){
    const x0=Math.max(0,k.minx-2), y0=Math.max(0,k.miny-2), x1=Math.min(RW-1,k.maxx+2), y1=Math.min(RH-1,k.maxy+2), w=x1-x0+1, h=y1-y0+1, id=k.id;
    const pc=document.createElement('canvas'); pc.width=w; pc.height=h;
    const pctx=pc.getContext('2d'), pd=pctx.createImageData(w,h), q=pd.data, edge=[];
    for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){
      const i=y*RW+x, l=Lb[i];
      if(l!==id){
        if(l!==0||d[i*4+3]===0) continue;
        if(!((x>0&&Lb[i-1]===id)||(x<RW-1&&Lb[i+1]===id)||(y>0&&Lb[i-RW]===id)||(y<RH-1&&Lb[i+RW]===id))) continue;
      } else {
        m[i]=0;
        if((x>0&&Lb[i-1]!==id)||(x<RW-1&&Lb[i+1]!==id)||(y>0&&Lb[i-RW]!==id)||(y<RH-1&&Lb[i+RW]!==id)) edge.push(x,y);
      }
      const a=i*4, b=((y-y0)*w+(x-x0))*4; q[b]=d[a]; q[b+1]=d[a+1]; q[b+2]=d[a+2]; q[b+3]=d[a+3]; d[a+3]=0;
    }
    pctx.putImageData(pd,0,0);
    const pts=[], stp=Math.max(1,Math.floor(edge.length/2/140));
    for(let j=0;j<edge.length;j+=2*stp) pts.push([(edge[j]+.5-k.cx)/R,(edge[j+1]+.5-k.cy)/R]);
    if(!pts.length) pts.push([0,0]);
    const u=k.cx/R+X0, v=k.cy/R+Y0, fl=k.area<FLOAT_A;
    const b={img:pc,ox:k.cx-x0,oy:k.cy-y0,pts,x:board.x+u*s,y:board.y+v*s,s0:s,rot:0,vx:0,vy:0,vr:0,w:0,
      state:'fall',bounces:0,t:0,ph:Math.random()*6,float:fl,weight:Math.min(3.6,k.area/(R*R)*o.sh.density)};
    if(info){
      /* なぞった向き・速さで押し出し、刃の当たった位置で回転させる */
      const sp=Math.min(1,info.speed/900), dx=info.dir[0], dy=info.dir[1], push=fl?20:20+100*sp;
      b.vx=dx*push; b.vy=fl?10:dy*push*.5;
      const rcx=info.contact[0]-u, rcy=info.contact[1]-v;
      b.vr=fl?0:Math.max(-3.5,Math.min(3.5,(rcx*dy-rcy*dx)*12*(.5+sp)));
      const side=Math.sign((u-info.contact[0])*(-dy)+(v-info.contact[1])*dx); b.vx+=(-dy)*side*45;
    } else { const ld=o.lastDir?o.lastDir[0]:0; b.vx=-ld*90+(Math.random()-.5)*20; b.vr=ld?-ld*.6:(Math.random()<.5?-1:1)*.3; }  /* 崩れる胴は、頭と反対側へ */

    locked=true; dragging=null;
    if(cfg.final){ setTimeout(ending,160); return; }
    state='clearing'; clearWait=0;
  }
}

/* ---------- 進行 ---------- */
function startLevel(i){
  level=i; const lv=L(), cfg=LVc();
  paths={}; complete={};
  lv.pairs.forEach(p=>{paths[p.k]=[];complete[p.k]=false;});
  dk.fill(0); objs=lv.objs.map(buildObj); dirty=true;
  locked=false; dragging=null; flash=0; pending=0;
  setTargets(cfg,!!cfg.final);
  $('stageLabel').textContent=`ステージ ${i+1} / 5`; hint.textContent=cfg.hint;
  hud.classList.remove('off'); hint.classList.remove('off');
  clearEl.hidden=true; titleEl.hidden=true;
  setMusic(cfg.music); state='play'; showBoard=true;
  layout();
}
function showClear(){
  state='clear'; const cfg=LVc();
  const sub=$('clearSub'); sub.textContent=cfg.sub; sub.hidden=!cfg.sub;
  $('clearTitle').textContent=cfg.clear;
  clearEl.hidden=false; chime(level);
  try{nextBtn.focus({preventScroll:true});}catch(_){}
}
function ending(){
  state='ending'; locked=true; dragging=null;
  setMusic('none'); droneTo(0,true);
  sfx.ding(); CUT.crisp();
  endEl.hidden=false; endText.classList.remove('show'); againBtn.classList.remove('show');
  hud.classList.add('off'); hint.classList.add('off');
  setTimeout(()=>{sfx.thud(3.4); buzz([60,40,140]);},1500);
  setTimeout(()=>endText.classList.add('show'),3300);
  setTimeout(()=>againBtn.classList.add('show'),5400);
}

$('startBtn').addEventListener('click',()=>{audioInit(); startLevel(0);});
nextBtn.addEventListener('click',()=>{ if(state!=='clear') return; startLevel(level+1); });
againBtn.addEventListener('click',()=>{
  endEl.hidden=true; showBoard=false; state='title'; played=true; level=0; objs=[];
  setTargets(titleCfg(),true); titleEl.hidden=false; setMusic('box');
});
soundBtn.addEventListener('click',()=>{
  A.on=!A.on; soundBtn.textContent=A.on?'おと ON':'おと OFF'; soundBtn.setAttribute('aria-pressed',String(A.on));
  if(A.master) A.master.gain.setTargetAtTime(A.on?.9:0,A.ctx.currentTime,.05);
});
document.addEventListener('visibilitychange',()=>{ if(!A.ctx) return; if(document.hidden) A.ctx.suspend().catch(()=>{}); else A.ctx.resume().catch(()=>{}); });

/* ---------- 入力 ---------- */
cv.addEventListener('pointerdown',e=>{
  if(state!=='play'||locked) return;
  const cl=cellAt(e.clientX,e.clientY,false); if(!cl) return;
  const [c,r]=cl, d=dotAt(c,r);
  if(d){ dragging=d.k; paths[d.k]=[[c,r]]; complete[d.k]=false; sfx.pop(); addDark(c,r,LVc().gain*.5); }
  else { const k=pathOwner(c,r); if(!k) return; const p=paths[k]; p.length=p.findIndex(q=>q[0]===c&&q[1]===r)+1; complete[k]=false; dragging=k; }
  lastPt={x:e.clientX,y:e.clientY,t:e.timeStamp}; fingerSpeed=0;
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  e.preventDefault();
});
cv.addEventListener('pointermove',e=>{
  if(!dragging||locked) return;
  if(lastPt){ const dt=(e.timeStamp-lastPt.t)/1000; if(dt>0){ const v=Math.hypot(e.clientX-lastPt.x,e.clientY-lastPt.y)/dt; fingerSpeed=fingerSpeed*.6+Math.min(v,3000)*.4; } }
  lastPt={x:e.clientX,y:e.clientY,t:e.timeStamp};
  const [c,r]=cellAt(e.clientX,e.clientY,true); walkTo(c,r);
});
const release=()=>{dragging=null; lastPt=null;};
cv.addEventListener('pointerup',release); cv.addEventListener('pointercancel',release);

/* ---------- 描画 ---------- */
function dotColor(k){return mix(hex(HUE[k]),GREY,cur.dim);}
function drawBodies(){
  for(const b of bodies){ ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.rot); const k=b.s0/R; ctx.scale(k,k); ctx.drawImage(b.img,-b.ox,-b.oy); ctx.restore(); }
}
function drawBoard(){
  const {x,y,s}=board, {pad,cell}=geo(), cfg=LVc();
  ctx.save();
  ctx.shadowColor='rgba(60,40,70,.16)'; ctx.shadowBlur=26; ctx.shadowOffsetY=10;
  rr(ctx,x,y,s,s,s*.075); ctx.fillStyle=rgb(cur.board); ctx.fill();
  ctx.shadowColor='transparent'; ctx.shadowBlur=0; ctx.shadowOffsetY=0;
  ctx.clip();
  ctx.fillStyle=rgb(cur.tile);
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){const m=cell*.08; rr(ctx,x+pad+c*cell+m,y+pad+r*cell+m,cell-2*m,cell-2*m,cell*.24); ctx.fill();}
  if(dirty) recompose();
  ctx.drawImage(darkC,x,y,s,s);
  ctx.lineCap='round'; ctx.lineJoin='round';
  for(const pr of L().pairs){
    const p=paths[pr.k]; if(!p||p.length<2) continue;
    ctx.strokeStyle=rgb(dotColor(pr.k)); ctx.lineWidth=cell*.34; ctx.beginPath();
    p.forEach(([c,r],i)=>{const [X,Y]=center(c,r); i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);}); ctx.stroke();
  }
  if(dragging){const p=paths[dragging], [c,r]=p[p.length-1], [X,Y]=center(c,r); ctx.fillStyle=rgb(dotColor(dragging),.22); ctx.beginPath(); ctx.arc(X,Y,cell*.62,0,Math.PI*2); ctx.fill();}
  for(const pr of L().pairs) for(const [c,r] of [pr.a,pr.b]){
    const [X,Y]=center(c,r);
    ctx.fillStyle=rgb(dotColor(pr.k)); ctx.beginPath(); ctx.arc(X,Y,cell*.3,0,Math.PI*2); ctx.fill();
    if(cfg.eyes){
      ctx.fillStyle='#3B2B3E';
      for(const sx of [-1,1]){ctx.beginPath(); ctx.arc(X+sx*cell*.085,Y-cell*.02,cell*.036,0,Math.PI*2); ctx.fill();}
      ctx.fillStyle='rgba(255,255,255,.55)'; ctx.beginPath(); ctx.arc(X-cell*.12,Y-cell*.13,cell*.05,0,Math.PI*2); ctx.fill();
    }
  }
  ctx.restore();
}
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(shake>.2&&!reduced) ctx.translate((Math.random()-.5)*shake*2,(Math.random()-.5)*shake*2);
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,rgb(cur.bg0)); g.addColorStop(1,rgb(cur.bg1));
  ctx.fillStyle=g; ctx.fillRect(-30,-30,W+60,H+60);
  if(cur.deco>.01) for(const d of DECO){ctx.fillStyle=rgb(d.c,.2*cur.deco); ctx.beginPath(); ctx.arc(d.x*W,d.y*H+Math.sin(t*.8+d.ph)*5,d.r,0,Math.PI*2); ctx.fill();}
  drawBodies();
  const fg=ctx.createLinearGradient(0,H*.58,0,H); fg.addColorStop(0,'rgba(10,6,10,0)'); fg.addColorStop(1,`rgba(10,6,10,${cur.floor})`);
  ctx.fillStyle=fg; ctx.fillRect(-30,H*.58,W+60,H*.42+30);
  if(showBoard) drawBoard();
  if(cur.vig>.005){
    const v=ctx.createRadialGradient(W/2,H*.42,Math.min(W,H)*.25,W/2,H*.42,Math.hypot(W,H)*.62);
    v.addColorStop(0,'rgba(6,3,6,0)'); v.addColorStop(1,`rgba(6,3,6,${Math.min(.97,cur.vig)})`);
    ctx.fillStyle=v; ctx.fillRect(-30,-30,W+60,H+60);
  }
  if(flash>.01){ctx.fillStyle=`rgba(4,2,4,${flash})`; ctx.fillRect(-30,-30,W+60,H+60);}
}
function step(dt){
  t+=dt; lerpCur(dt);
  if(state==='play'){
    const cfg=LVc();
    if(dragging){const p=paths[dragging], q=p[p.length-1]; addDark(q[0],q[1],dt*.5*cfg.gain);}
    if(cfg.creep){creepT+=dt; if(creepT>.3){creepT=0; diffuse(cfg.creep*.3);}}
    if(cfg.final){const p=paths.pink||[]; target.vig=.04+.9*Math.min(1,Math.max(0,(p.length-1)/4));}
  }
  if(hitstop>0) hitstop-=dt; else for(const b of bodies) stepBody(b,dt);
  if(state==='clearing'){
    const busy=pending>0||bodies.some(b=>b.state==='fall'&&!b.float);
    if(busy) clearWait=0; else if((clearWait+=dt)>.9) showClear();
  }
  shake*=Math.exp(-dt*7); flash*=Math.exp(-dt*2.5);
}
let last=0;
function frame(ts){const dt=Math.min(.04,last?(ts-last)/1000:0); last=ts; step(dt); draw(); requestAnimationFrame(frame);}

setTargets(titleCfg(),true);
layout();
window.addEventListener('resize',layout);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(layout);
requestAnimationFrame(frame);
})();
</script>

</body></html>
