const $ = (s, r = document) => r.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const imgCache = {};
function loadImg(name) {
  if (!imgCache[name]) imgCache[name] = new Promise(res => {
    const tryExt = exts => {
      if (!exts.length) return res(null);
      const im = new Image();
      im.onload = () => res(im.src);
      im.onerror = () => tryExt(exts.slice(1));
      im.src = ASSET_DIR + name + exts[0];
    };
    tryExt([".webp", ".png"]);
  });
  return imgCache[name];
}
ASSETS.forEach(loadImg);
function kindOf(name) {
  if (/blood|letters/.test(name)) return "k-blood";
  const p = name.split("_")[0];
  if (p === "bg" || p === "zoom" || p === "end") return "bg";
  return "k-" + p;
}
/* 要素に画像を割り当てる。無ければ名前つきの仮の箱 */
function art(el, name) {
  el.dataset.art = name;
  el.dataset.label = name;
  el.classList.add("ph", kindOf(name));
  el.style.backgroundImage = "";
  loadImg(name).then(src => {
    if (el.dataset.art !== name) return;
    if (src) { el.style.backgroundImage = `url("${src}")`; el.classList.remove("ph"); }
  });
  return el;
}
function mk(tag, cls, parent, text) {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  if (text != null) el.textContent = text;
  if (parent) parent.appendChild(el);
  return el;
}
function place(el, r) {
  el.style.left = r.x + "%"; el.style.top = r.y + "%"; el.style.width = r.w + "%";
  el.style.height = r.h != null ? r.h + "%" : "";
  if (r.z != null) el.style.zIndex = r.z;
  return el;
}
function layer(name, r, cls = "", parent = scene) {
  const el = mk("div", "layer " + cls, parent);
  if (r) place(el, r);
  if (name) art(el, name);
  if (r && r.h == null && name && META[name]) el.style.aspectRatio = META[name].w / META[name].h;
  return el;
}

let chrEl = null, chrTimer = null;
/* 主人公：足元の位置（cx, by：%）で置く。ポーズごとに絵の縮尺をそろえる */
const CHR_H = 36;            /* 立ちポーズの身長（画面幅に対する%） */
const CHR_NORM = { chr_idle: 1, chr_check: 1, chr_wipe: 1, chr_pickup: .85, chr_scrub: .82 };
function setChrArt(name) {
  art(chrEl, name);
  const m = META[name];
  if (!m) { chrEl.style.width = "24cqw"; chrEl.style.height = CHR_H + "cqw"; return; }
  const h = m.srcH * (CHR_H / META.chr_idle.srcH) * (CHR_NORM[name] || 1);
  chrEl.style.height = h + "cqw"; chrEl.style.width = (h * m.w / m.h) + "cqw";
}
function addChr(f) {

let msgTimer = null;
function say(text, { wait = false, ms = 2600 } = {}) {

function waitTap() {

function fx(name, el, scale = 1.2) {
  const rect = el.getBoundingClientRect(), sr = stage.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height) * scale;
  const f = mk("div", "fxbox sp3", stage);
  f.style.left = (rect.left - sr.left + rect.width / 2 - size / 2) + "px";
  f.style.top = (rect.top - sr.top + rect.height / 2 - size / 2) + "px";
  f.style.width = f.style.height = size + "px";
  f.style.backgroundSize = "300% 100%";
  loadImg(name).then(src => { if (src) f.style.backgroundImage = `url("${src}")`; else f.classList.add("ph"); });
  setTimeout(() => f.remove(), 700);
}
function floatLabel(text, el) {

  f.style.left = (rect.left - sr.left) + "px";
  f.style.top = (rect.top - sr.top - 20) + "px";
  setTimeout(() => f.remove(), 1500);
}

/* ---------------- ヒント（しばらく触らないと光る） ---------------- */
function clearHints() { document.querySelectorAll(".hint").forEach(e => e.classList.remove("hint")); }
setInterval(() => {
  if (busy || !currentRoom) return;
  if (Date.now() - lastAct < 9000) return;
  if (document.querySelector(".hint")) return;
  const t = currentRoom.tasks.find(t => !t.done && (!t.gate || t.gate()));
  if (t && t.el) t.el.classList.add("hint");
}, 1000);

/* ---------------- 触り方（タップとスワイプ） ---------------- */
function bindPointer(el, { onTap, onStroke, inZoom = false }) {
  let s = null;
  const blocked = () => busy && !inZoom;
  el.addEventListener("pointerdown", e => {
    if (blocked()) return;
    s = { x: e.clientX, y: e.clientY };
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
    e.stopPropagation();
  });
  el.addEventListener("pointerup", e => {
    if (!s) return;
    const d = Math.hypot(e.clientX - s.x, e.clientY - s.y);
    s = null;
    if (blocked()) return;
    if (d >= 18) onStroke ? onStroke() : onTap && onTap();
    else onTap && onTap();
  });
  el.addEventListener("pointercancel", () => { s = null; });
}

/* ---------------- 部屋の進行 ---------------- */
const CLEAN_LINES = ["きれいになりました！", "ぴかぴかです！", "よし、きれい！", "すっきりしました！"];
let tapHintShown = false;
function runRoom(room) {
  currentRoom = room;
  return new Promise(resolve => {
    room.finish = () => { currentRoom = null; resolve(); };
    for (const t of room.tasks) setupTask(room, t);
  });
}
function done(room, t) {
  t.done = true;
  if (t.after) t.after();
  if (t.el) t.el.classList.remove("hit", "hint");
  if (room.tasks.every(x => x.done || x.optional)) room.finish();
}
function gated(t) {
  if (t.gate && !t.gate()) { say(t.gateSay || "先に、ほかの場所を片付けますね！"); return true; }
  return false;
}
function setupTask(room, t) {
  if (t.art !== undefined && !t.el) t.el = layer(t.art, t.r, t.cls || "");
  const el = t.el;
  el.classList.add("hit");
  if (t.art && t.r && t.r.w < 10) mk("i", "hitpad", el);
  if (t.type === "clean") {
    t.k = 0; const n = t.n || 3;
    el.classList.add("fade");
    bindPointer(el, {
      onStroke: () => {
        if (t.done || gated(t)) return;
        t.k++; chrAct(t.scrub ? "scrub" : "wipe");
        el.style.opacity = t.k >= n ? 0 : .45;
        if (t.k >= n) {
          el.style.pointerEvents = "none";
          fx("fx_sparkle", el);
          say(t.say || CLEAN_LINES[Math.floor(Math.random() * CLEAN_LINES.length)]);
          done(room, t);
        }
      },
      onTap: () => {
        if (t.done || gated(t)) return;
        if (!tapHintShown) { tapHintShown = true; say("汚れは、指でこすってきれいにします！"); }
      }
    });
  } else {
    bindPointer(el, {
      onTap: async () => {
        if (t.done || gated(t)) return;
        busy = true;
        let r;
        try { r = await t.act(el); } finally { busy = false; }
        if (r === false) return;
        done(room, t);
      }
    });
  }
}

/* ---------------- 拡大画面・紙 ---------------- */
function openZoom(name, setup, { tall = false } = {}) {
  const zr = $("#zoom");
  const z = mk("div", "zlayer", zr);
  const box = mk("div", "zbox" + (tall ? " tall" : ""), z);
  if (name) art(box, name);
  const m = name && META[name];
  if (m) {
    const a = m.w / m.h;
    box.style.aspectRatio = a;
    box.style.width = (a >= 1 ? 86 : Math.min(78, 102 * a)) + "cqw";
    if (/^(ui_|item_)/.test(name)) box.classList.add("clear");
  }
  const close = mk("button", "btn hide", z, "もどる");
  zr.classList.add("on");
  return new Promise(resolve => {
    const api = {
      box,
      allowClose() { close.classList.remove("hide"); },
      close() { z.remove(); if (!zr.children.length) zr.classList.remove("on"); resolve(); }
    };
    close.addEventListener("click", () => api.close());
    const r = setup ? setup(box, api) : null;
    if (!setup || r !== "manual") api.allowClose();
  });
}
/* 紙：罫線に合わせて文字を置く（top＝1行目の上端%、gap＝罫線の間隔%） */
function openPaper(name, text, { top = 6, gap = 7, left = 12, right = 9, size = 3.9 } = {}) {
  return openZoom(name, box => {
    const t = mk("div", "paperText", box, text);
    const m = META[name], a = m ? m.w / m.h : .72;
    const wcq = a >= 1 ? 86 : Math.min(78, 102 * a), hcq = wcq / a;
    Object.assign(t.style, { inset: "auto", left: left + "%", right: right + "%", top: top + "%", fontSize: size + "cqw", lineHeight: (hcq * gap / 100) + "cqw" });
  }, { tall: true });
}

/* ---------------- 分類カード ---------------- */
const CATS = [
  { id: "important", label: "大切なもの", art: "ui_card_important" },
  { id: "bulky", label: "粗大ごみ", art: "ui_card_bulky" },
  { id: "raw", label: "生ゴミ", art: "ui_card_raw" }
];
function sortUI({ itemArt, name, allow, wrongSay }) {
  const s = $("#sort");
  s.innerHTML = "";
  const tg = mk("div", "target", s);
  const ta = mk("div", "tart", tg);
  if (itemArt) art(ta, itemArt); else ta.classList.add("blank");
  mk("div", "tname", tg, name);
  mk("div", "sortHint", s, "カードを選んで、上へスワイプ");
  const row = mk("div", "cards", s);
  s.classList.add("on");
  return new Promise(resolve => {
    let finished = false;
    for (const c of CATS) {
      const card = mk("div", "card", row);
      card.dataset.cat = c.id;
      art(mk("div", "cart", card), c.art);
      mk("div", "clabel", card, c.label);
      if (allow && !allow.includes(c.id)) card.classList.add("dim");
      let sy = null, dy = 0;
      card.addEventListener("pointerdown", e => {
        if (finished) return;
        sy = e.clientY; dy = 0;
        try { card.setPointerCapture(e.pointerId); } catch (_) {}
        row.querySelectorAll(".card").forEach(x => x.classList.toggle("sel", x === card));
        card.style.transition = "none";
      });
      card.addEventListener("pointermove", e => {
        if (sy == null) return;
        dy = Math.min(0, e.clientY - sy);
        card.style.transform = `translateY(calc(-4cqw + ${dy}px))`;
      });
      const up = async () => {
        if (sy == null) return;
        sy = null;
        card.style.transition = "";
        card.style.transform = "";
        const h = card.getBoundingClientRect().height;
        if (dy < -h * 0.35) {
          if (allow && !allow.includes(c.id)) {
            card.classList.add("shake"); setTimeout(() => card.classList.remove("shake"), 400);
            if (wrongSay) say(wrongSay);
            return;
          }
          finished = true;
          card.classList.add("fly");
          card.style.transform = "translateY(-60cqw) scale(.6)";
          fx("fx_pon", ta, 1.4);
          await sleep(420);
          tg.style.transition = "opacity .3s"; tg.style.opacity = 0;
          await sleep(300);
          s.classList.remove("on"); s.innerHTML = "";
          resolve(c.id);
        }
      };
      card.addEventListener("pointerup", up);
      card.addEventListener("pointercancel", () => { sy = null; card.style.transform = ""; });
    }
  });
}

/* 拡大画面の中でこする汚れ */
function zoomClean(el, n, onDone) {
  let k = 0;
  el.classList.add("fade", "hit");
  bindPointer(el, { inZoom: true, onStroke: () => {
    if (k >= n) return;
    k++; chrAct("wipe"); el.style.opacity = k >= n ? 0 : .45;
    if (k >= n) { el.style.pointerEvents = "none"; fx("fx_sparkle", el); onDone(); }
  } });
}

async function keypad() {
  let fails = 0, opened = false;
  await openZoom("zoom_keypad", (box, api) => {
    const disp = mk("div", "kpDisp", box, "");
    const grid = mk("div", "kpGrid", box);
    let code = "";
    const show = () => disp.textContent = code.padEnd(4, "・");
    show();
    ["1","2","3","4","5","6","7","8","9","C","0","OK"].forEach(k => {
      const b = mk("button", "", grid, k);
      if (k === "OK") b.style.fontSize = "4.2cqw";
      b.addEventListener("click", async () => {
        if (opened) return;
        if (k === "C") { code = ""; show(); return; }
        if (k === "OK") {
          if (code === "0417") { opened = true; disp.textContent = "OPEN"; await sleep(700); api.close(); return; }
          fails++; box.classList.add("shake"); setTimeout(() => box.classList.remove("shake"), 400);
          code = ""; show();
          if (fails >= 2) say("写真と日記に、何か書いてあったような……");
          return;
        }
        if (code.length < 4) { code += k; show(); }
      });
    });
    api.allowClose();
    return "manual";
  });
  return opened;
}

  for (let i = ROOM_ORDER.indexOf(from); i < ROOM_ORDER.length; i++) {
    const area = ROOM_ORDER[i];

    if (area === "workspace") { chrAct("check", 1400); await sleep(400); }
    else { await says([ROOM_LABEL[area] + "、完了です！"]); }

function longPressErase(el, ms) {
  return new Promise(resolve => {
    el.classList.add("hit", "hint");
    el.style.pointerEvents = "auto";
    let t0 = null, raf = null, ring = null;
    const stop = () => { t0 = null; cancelAnimationFrame(raf); if (ring) { ring.remove(); ring = null; } };
    el.addEventListener("pointerdown", e => {
      e.stopPropagation(); el.classList.remove("hint");
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
      t0 = performance.now();
      ring = mk("div", "ring", stage);
      const sr = stage.getBoundingClientRect(), r = el.getBoundingClientRect();
      ring.style.left = (r.left - sr.left + r.width / 2) + "px"; ring.style.top = (r.top - sr.top + r.height / 2) + "px";
      ring.style.transform = "translate(-50%,-50%)";
      const tick = now => {
        if (t0 == null) return;
        const p = Math.min(1, (now - t0) / ms);
        ring.style.setProperty("--p", p);
        el.style.opacity = 1 - p * .9;
        if (p >= 1) { stop(); el.style.opacity = 0; el.style.pointerEvents = "none"; resolve(); return; }
        raf = requestAnimationFrame(tick);
      };
      raf = requestAnimationFrame(tick);
    });
    const cancel = () => { if (t0 != null) { stop(); el.style.opacity = 1; } };
    el.addEventListener("pointerup", cancel);
    el.addEventListener("pointercancel", cancel);
  });
}
function buildPhotoCard() {

  const im = mk("div", "pimg", c);

function swipeAway(el, note) {
  const n = mk("div", "swipeNote", stage, note);
  return new Promise(resolve => {
    let sy = null, dy = 0;
    const base = getComputedStyle(el).transform === "none" ? "" : el.style.transform;
    el.addEventListener("pointerdown", e => { sy = e.clientY; dy = 0; try { el.setPointerCapture(e.pointerId); } catch (_) {} el.style.transition = "none"; });
    el.addEventListener("pointermove", e => { if (sy == null) return; dy = Math.min(0, e.clientY - sy); el.style.transform = `translate(-50%, calc(-50% + ${dy}px))`; });
    el.addEventListener("pointerup", async () => {
      if (sy == null) return; sy = null; el.style.transition = "";
      if (dy < -50) {
        el.style.transform = "translate(-50%, -260%)"; el.style.opacity = 0;
        n.remove();
        await sleep(450); el.remove(); resolve();
      } else el.style.transform = "";
    });
  });
}

  const e = $("#ends");
  e.innerHTML = "";
  const ends = store.get("osouji_ends", []);
  const names = { important: "大切なもの", bulky: "粗大ごみ", raw: "生ゴミ" };
  mk("h2", "", e, cat ? "分類結果：" + names[cat] : "分類結果");
  const list = mk("div", "endList", e);
  [["A", "大切なもの"], ["B", "粗大ごみ"], ["C", "生ゴミ"]].forEach(([k, label]) => {
    const d = mk("div", ends.includes(k) ? "" : "no", list);
    mk("span", "", d, label); mk("span", "", d, ends.includes(k) ? "分類済み" : "未分類");
  });
  const b1 = mk("button", "btn", e, "最終分類からやり直す");
  b1.addEventListener("click", () => { showScreen("ends", false); play("final"); });
  const b2 = mk("button", "btn", e, "タイトルへ");
  b2.addEventListener("click", () => { showScreen("ends", false); scene.innerHTML = ""; setProgress(null); hideMsg(); titleScreen(); });
  showScreen("ends");
}

/* ---------------- 素材チェック（?check） ---------------- */
async function checkScreen() {
  const c = $("#check");
  c.classList.add("on");
  const rows = await Promise.all(ASSETS.map(async n => [n, !!(await loadImg(n))]));
  const ok = rows.filter(r => r[1]).length;
  c.innerHTML = `<p><b>素材チェック</b>　${ok} / ${rows.length}</p><p>assets/ フォルダに「名前.png」で置いてください。</p><br>` +
    rows.map(([n, f]) => `<div><b class="${f ? "ok" : "ng"}">${f ? "○" : "×"}</b> ${n}.png</div>`).join("") +
    `<br><button class="btn" onclick="document.getElementById('check').classList.remove('on')">閉じる</button>`;
}

/* ---------------- 起動 ---------------- */
const q = new URLSearchParams(location.search);
if (q.has("check") || location.hash === "#check") checkScreen();
if (q.get("area")) { play(q.get("area")); } else titleScreen();
</script>
