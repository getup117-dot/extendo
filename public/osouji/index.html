/* =========================================================
   ぴかぴか！清家きらりのおそうじ代行
   画像は assets/ フォルダに、プロンプト集のファイル名（.png）で置くと自動で差し替わります。
   無い画像は、名前つきの仮の箱で表示されます。
   URLの最後に ?check（または #check）を付けて開くと、そろっている素材の一覧が出ます。
   ========================================================= */
:root{
  --ink:#3b2a2a; --cream:#f6ead3; --paper:#fbf4e4; --teal:#5f9c93; --teal-d:#3f7169;
  --sage:#9db88f; --salmon:#e59a7f; --wood:#b7865a; --plum:#4a3340; --blood:#7a2a2a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#1e1519;overflow:hidden;overscroll-behavior:none}
body{display:flex;justify-content:center;align-items:flex-start;
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","BIZ UDPGothic","Noto Sans JP",system-ui,sans-serif;color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:relative;width:min(100vw,480px,calc((100dvh - 110px) / 1.42));height:100dvh;
  background:var(--plum);container-type:inline-size;display:flex;flex-direction:column;overflow:hidden;touch-action:none}
#top{flex:none;height:9cqw;display:flex;align-items:center;gap:2.5cqw;padding:0 3cqw;background:var(--plum)}
#memoBtn{flex:none;font:700 3.4cqw/1 inherit;font-family:inherit;color:var(--ink);background:#f2d04b;border:.6cqw solid var(--ink);border-radius:2cqw;padding:1.4cqw 2.4cqw;cursor:pointer}
#memoBtn.hide{display:none}
#app:has(#sort.on) #memoBtn,#app:has(#cine.on) #memoBtn{visibility:hidden}
#memoBtn.new{animation:pulse 1s ease-in-out 3}
.memoList{width:78cqw;max-height:96cqw;overflow-y:auto;background:var(--paper);border:.8cqw solid var(--ink);border-radius:3cqw;padding:4cqw 4cqw;display:flex;flex-direction:column;gap:1.8cqw}
.memoList h3{margin:0 0 1cqw;text-align:center;font-size:4.8cqw}
.memoList button{flex:none;display:flex;align-items:center;gap:3cqw;min-height:11.5cqw;text-align:left;font:700 3.9cqw/1.4 inherit;font-family:inherit;color:var(--ink);background:#fff;border:.6cqw solid var(--ink);border-radius:2cqw;padding:1.2cqw 3cqw;cursor:pointer}
.memoList button i{flex:none;width:9cqw;height:9cqw;background-size:contain;background-repeat:no-repeat;background-position:center}
.memoList p{margin:0;font-size:3.4cqw;color:#7a7166;text-align:center}
#roomName{flex:none;min-width:20cqw;padding:.8cqw 2cqw;background:var(--cream);border:.6cqw solid var(--ink);border-radius:2cqw;
  font-size:3.3cqw;font-weight:700;text-align:center}
#prog{flex:1;display:flex;gap:1cqw;padding:1cqw;background:var(--cream);border:.6cqw solid var(--ink);border-radius:5cqw}
#prog i{flex:1;height:2.6cqw;border-radius:2cqw;background:#cbbdb3}
#prog i.done{background:var(--sage)} #prog i.now{background:#c9dcb9;animation:blink 1.6s steps(2) infinite}
@keyframes blink{50%{background:var(--sage)}}
#stage{position:relative;flex:none;width:100cqw;height:133.333cqw;overflow:hidden;background:#2a2024;filter:saturate(var(--sat,1));transition:filter 1.5s}
#scene{position:absolute;inset:0}
.layer{position:absolute;background-size:100% 100%;background-repeat:no-repeat;background-position:center}
.layer.bg{inset:0}
.layer.hit{cursor:pointer}
.dlock{position:absolute;left:18%;right:18%;top:18%;z-index:5;background:#fff6e6;border:.7cqw solid var(--ink);border-radius:3cqw;padding:2.5cqw}
.dlDisp{text-align:center;font:700 7cqw/1.3 ui-monospace,Menlo,monospace;letter-spacing:2cqw;color:var(--ink);background:#2c2a28;color:#f3e7c9;border-radius:1.5cqw;margin-bottom:2cqw}
.dlGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6cqw}
.dlGrid button{min-height:8cqw;border:.5cqw solid var(--ink);border-radius:2cqw;background:var(--cream);font:700 5cqw/1 ui-monospace,Menlo,monospace;color:var(--ink)}
.dlock.shake{animation:shake .35s}
.kpSeen{position:absolute;right:3cqw;top:3cqw;z-index:5;font:700 3.6cqw/1 inherit;padding:2.4cqw 3cqw;min-height:11.5cqw;border:.6cqw solid var(--ink);border-radius:2cqw;background:var(--cream);color:var(--ink)}
.kpSeen.glow{animation:kpglow 1.4s ease-out 1}
@keyframes kpglow{30%{box-shadow:0 0 0 1.4cqw #fff3a8}}
#stage.freeze *,#stage.freeze *::before,#stage.freeze *::after{animation-play-state:paused!important}
.layer.lieDoll{rotate:68deg}
.layer.drop{animation:dropIn .6s ease-in}
@keyframes dropIn{from{translate:0 -10cqw;opacity:0}to{translate:0 0;opacity:1}}
.hitpad{position:absolute;left:50%;top:50%;width:max(150%,12cqw);height:max(150%,12cqw);transform:translate(-50%,-50%);border-radius:30%}
.layer.gone{opacity:0!important;transform:scale(.6);transition:opacity .45s,transform .45s;pointer-events:none}
.layer.fade{transition:opacity .35s}
.spot{border-radius:30%}
/* しばらく触らないと、物そのものがふわっと光る（丸や枠では囲まない） */
.layer.hint{animation:glowf 1.6s ease-in-out infinite}
@keyframes glowf{0%,100%{filter:none}50%{filter:brightness(1.3) drop-shadow(0 0 1.4cqw #fff7c8)}}
.spot.hint::after{content:"";position:absolute;inset:-10%;border-radius:40%;background:radial-gradient(closest-side,rgba(255,247,200,.6),rgba(255,247,200,0));animation:glows 1.6s ease-in-out infinite;pointer-events:none}
@keyframes glows{0%,100%{opacity:0}50%{opacity:1}}
.hintFinger{animation:tapf 1s ease-in-out infinite;translate:-30% -15%}
@keyframes tapf{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5cqw)}}
/* 仮の箱 */
.ph{background-color:rgba(246,234,211,.55);outline:.5cqw dashed rgba(59,42,42,.7);outline-offset:-.5cqw}
.ph::before{content:attr(data-label);position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;
  font:700 2.4cqw/1.2 ui-monospace,Menlo,monospace;color:var(--ink);word-break:break-all;white-space:pre-line;padding:0 .5cqw;pointer-events:none}
.ph.bg{background-color:#d9c6a8} .ph.k-st{background-color:rgba(150,120,90,.55)} .ph.k-blood{background-color:rgba(122,42,42,.7)}
.ph.k-blood::before{color:#fff}
.ph.k-doll{background-color:rgba(229,154,127,.6)} .ph.k-hiyori{background-color:rgba(214,170,70,.6)} .ph.k-chr{background-color:rgba(95,156,147,.7)}
.ph.k-item,.ph.k-obj{background-color:rgba(183,134,90,.6)}
/* スプライト（横に並んだコマ） */
.sp2:not(.ph){background-size:200% 100%;animation:sp2 .9s infinite}
@keyframes sp2{0%,49.9%{background-position:0% 0}50%,100%{background-position:100% 0}}
.sp3:not(.ph){background-size:300% 100%;animation:sp3 .45s forwards}
@keyframes sp3{0%,33%{background-position:0% 0}33.4%,66%{background-position:50% 0}66.4%,100%{background-position:100% 0}}
.still #scene *,.still #prog *{animation-play-state:paused!important}
.fxbox{position:absolute;pointer-events:none;z-index:66}
.sweep{position:absolute;inset:0;z-index:60;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,240,0) 38%,rgba(255,252,225,.75) 50%,rgba(255,255,240,0) 62%);background-size:300% 100%;background-position:100% 0;animation:sweep 1s ease-in-out forwards}
@keyframes sweep{to{background-position:0 0}}
.fxbox.twinkle{animation:twk 1s ease-out forwards}
@keyframes twk{0%{opacity:0;scale:.4}30%{opacity:1;scale:1}100%{opacity:0;scale:.8}}
.fxbox.ph{outline:none;background:radial-gradient(circle,#fff 0 18%,rgba(255,255,255,0) 19%);animation:fxph .45s forwards}
.fxbox.ph::before{content:none}
@keyframes fxph{from{transform:scale(.3);opacity:1}to{transform:scale(1.4);opacity:0}}
/* メッセージ */
#bottom{position:relative;flex:1;min-height:20cqw;background:var(--plum);padding:2cqw 3cqw 3cqw}
#msg{display:flex;gap:2.5cqw;align-items:flex-start;height:100%;max-height:34cqw;background:var(--cream);border:.7cqw solid var(--ink);
  border-radius:3cqw;padding:2.2cqw;opacity:0;transition:opacity .2s}
#msg.on{opacity:1}
#face{flex:none;width:13cqw;height:13cqw;border-radius:2cqw;background-color:#cfe3dd;position:relative;background-size:contain;background-repeat:no-repeat;background-position:center bottom}
#msgText{font-size:4cqw;line-height:1.55;font-weight:700;white-space:pre-wrap}
#msg .more{position:absolute;right:6cqw;bottom:5cqw;font-size:3.2cqw;animation:blink2 .8s steps(2) infinite;display:none}
#msg.wait .more{display:block}
@keyframes blink2{50%{opacity:0}}
/* 拡大・紙 */
#zoom{position:absolute;inset:0;z-index:60;display:none}
#zoom.on{display:block}
.zlayer{position:absolute;inset:0;z-index:1;background:rgba(30,21,25,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3cqw}
.zbox{position:relative;width:86cqw;aspect-ratio:1/1;background-size:100% 100%;border:.8cqw solid var(--ink);border-radius:2cqw;overflow:hidden;background-color:#d9c6a8}
.zbox.tall{width:72cqw;aspect-ratio:2/3}
.zbox .layer{z-index:2}
.zbox.clear{border:none;background-color:transparent;overflow:visible}
.paperText{position:absolute;inset:14% 12% 10%;font-size:3.8cqw;line-height:2;white-space:pre-wrap;color:#3b2a2a;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;z-index:3}
.photoText{position:absolute;left:6%;right:6%;top:82%;height:15%;display:flex;flex-direction:column;justify-content:center;align-items:center;
  font:700 4cqw/1.35 "Hiragino Maru Gothic ProN",sans-serif;color:#5b4232;opacity:0;transition:opacity 1.2s;z-index:3;text-align:center}
.photoText.on{opacity:1}
.btn{font:700 4.2cqw/1 inherit;font-family:inherit;color:var(--ink);background:var(--cream);border:.7cqw solid var(--ink);border-radius:3cqw;padding:2.6cqw 6cqw;cursor:pointer}
.btn:active{transform:translateY(.5cqw)}
.btn.hide{visibility:hidden}
/* テンキー */
.kpDisp{position:absolute;left:37%;right:37%;top:12.5%;height:11%;color:#3b2a2a;
  display:flex;align-items:center;justify-content:center;font:700 5.4cqw/1 ui-monospace,Menlo,monospace;letter-spacing:1cqw;text-indent:1cqw;white-space:nowrap;overflow:hidden;z-index:3}
.kpGrid{position:absolute;left:34%;right:34%;top:27.5%;bottom:28.5%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);z-index:3}
.kpGrid button{justify-self:center;align-self:center;width:84%;color:#f6efe2;aspect-ratio:1/1;border:none;border-radius:50%;background:transparent;font:700 5.6cqw/1 ui-monospace,Menlo,monospace;color:#3b2a2a;cursor:pointer;padding:0}
.kpGrid button:active{background:rgba(95,156,147,.45)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-2cqw)}75%{transform:translateX(2cqw)}}
/* 分類カード */
#sort{position:absolute;left:0;right:0;bottom:0;top:0;background:rgba(30,21,25,.6);z-index:70;display:none;flex-direction:column;justify-content:space-between;align-items:center;padding:5cqw 0 4cqw}
#sort.on{display:flex}
.target{width:46cqw;background:var(--paper);border:.8cqw solid var(--ink);border-radius:3cqw;padding:2.5cqw;text-align:center;position:relative}
.target .tart{width:100%;aspect-ratio:1/1;background-size:contain;background-repeat:no-repeat;background-position:center;position:relative;border-radius:1.5cqw}
.target .tart.blank{background:repeating-linear-gradient(45deg,#efe4cc 0 2cqw,#e9dcc0 2cqw 4cqw)}
.target .tname{margin-top:2cqw;font-size:4.4cqw;font-weight:700}
.sortHint{color:var(--cream);font-size:4.2cqw;margin-bottom:15cqw;font-weight:700;background:rgba(30,21,25,.92);border:.5cqw solid var(--cream);border-radius:5cqw;padding:1.6cqw 4.5cqw}
.cards{display:flex;gap:3cqw;padding:0 3cqw}
.card{width:29cqw;background:var(--paper);border:.8cqw solid var(--ink);border-radius:3cqw;padding:2cqw;text-align:center;touch-action:none;cursor:grab;transition:transform .15s}
.card .cart{width:100%;aspect-ratio:1/1;background-size:contain;background-repeat:no-repeat;background-position:center;position:relative;border-radius:1.5cqw}
.card .clabel{margin-top:1.5cqw;font-size:3.7cqw;font-weight:700;white-space:nowrap}
.card[data-cat=important]{background:#f9e3da} .card[data-cat=bulky]{background:#e5ecd9} .card[data-cat=raw]{background:#efe6cf}
.card.sel{transform:translateY(-4cqw);box-shadow:0 0 0 1cqw #fff7c8}
.card{position:relative}
.card.dim{filter:grayscale(1) brightness(.72)}
.upArrow{position:absolute;left:50%;bottom:100%;margin-bottom:1.5cqw;width:12cqw;height:14cqw;z-index:2;display:none;pointer-events:none;
  background-size:contain;background-repeat:no-repeat;background-position:center bottom;animation:arrowup 1s ease-in-out infinite}
.upArrow.css::before{content:"";position:absolute;left:50%;top:0;transform:translateX(-50%);border-left:6cqw solid transparent;border-right:6cqw solid transparent;border-bottom:7cqw solid #fff7c8;filter:drop-shadow(0 .7cqw 0 #3b2a2a)}
.upArrow.css::after{content:"";position:absolute;left:50%;top:6.8cqw;transform:translateX(-50%);width:4.4cqw;height:6cqw;background:#fff7c8;box-shadow:0 .7cqw 0 #3b2a2a}
.card.sel .upArrow,.cards:not(.has-sel) .card:not(.dim) .upArrow{display:block}
@keyframes arrowup{0%{transform:translate(-50%,2.5cqw);opacity:.6}50%{opacity:1}100%{transform:translate(-50%,-3cqw);opacity:.6}}
.finger{position:absolute;width:14cqw;height:14cqw;z-index:80;pointer-events:none;background-size:contain;background-repeat:no-repeat;background-position:center;
  transform:translate(-50%,-30%);animation:fingerdrag 1.6s ease-in-out 3 forwards}
.finger.css{width:10cqw;height:10cqw;border-radius:50%;background:rgba(255,255,255,.75);border:.8cqw solid #3b2a2a;box-shadow:0 0 0 1.5cqw rgba(255,255,255,.35)}
@keyframes fingerdrag{0%{translate:0 0;opacity:0}15%{opacity:1}75%{translate:var(--fx) var(--fy);opacity:1}100%{translate:var(--fx) var(--fy);opacity:0}}
@keyframes fingerup{0%{transform:translate(-50%,0);opacity:0}15%{opacity:1}70%{transform:translate(-50%,-32cqw);opacity:1}100%{transform:translate(-50%,-36cqw);opacity:0}}
.target{touch-action:none;cursor:grab;position:relative;z-index:3}
.target.dragging{cursor:grabbing;box-shadow:0 3cqw 5cqw rgba(0,0,0,.45)}
.card.hover{transform:translateY(2cqw) scale(1.08);box-shadow:0 0 0 1.2cqw #fff7c8}
.cart.cwash{background:radial-gradient(circle at 35% 40%,#fff 0 12%,#cfeaf0 13% 24%,transparent 25%),radial-gradient(circle at 62% 58%,#fff 0 10%,#cfeaf0 11% 20%,transparent 21%),radial-gradient(circle at 50% 30%,#fff 0 7%,#cfeaf0 8% 13%,transparent 14%),#6fb6b3;border-radius:2cqw}
.layer.grime{filter:brightness(.55) saturate(.8)}
.cthumbs{display:flex;justify-content:center;align-items:center;gap:1cqw;margin-top:1cqw;height:6.5cqw}
.cthumbs i{width:6.5cqw;height:6.5cqw;background-size:contain;background-repeat:no-repeat;background-position:center;opacity:.8;transition:transform .2s}
.cthumbs b{font-size:2.8cqw;color:#7a6a5c}
.card.hover .cthumbs i{transform:translateY(-.6cqw)}
.target .upArrow{display:block}
.target.dragging .upArrow{display:none}
.card.got{animation:pop .3s}
.downArrow{position:absolute;left:50%;bottom:100%;margin-bottom:1.5cqw;width:11cqw;height:12cqw;display:none;pointer-events:none;
  background-size:contain;background-repeat:no-repeat;background-position:center;animation:arrowdown 1s ease-in-out infinite}
.card:not(.dim) .downArrow{display:block}
.downArrow.css::before{content:"";position:absolute;left:50%;top:0;transform:translateX(-50%);width:4.4cqw;height:5.5cqw;background:#fff7c8;box-shadow:0 0 0 .7cqw #3b2a2a}
.downArrow.css::after{content:"";position:absolute;left:50%;top:5cqw;transform:translateX(-50%);border-left:6cqw solid transparent;border-right:6cqw solid transparent;border-top:7cqw solid #fff7c8;filter:drop-shadow(0 .7cqw 0 #3b2a2a)}
@keyframes arrowdown{0%{transform:translate(-50%,-2.5cqw);opacity:.6}50%{opacity:1}100%{transform:translate(-50%,2cqw);opacity:.6}}
#sort.final{background:rgba(14,2,4,.8)}
#sort.final .tart{background-color:#2b1a17;border-radius:1.5cqw}
#sort.final .tname{color:#7a2a2a}
.vig{position:absolute;inset:0;z-index:35;pointer-events:none;transition:background 2s;
  background:radial-gradient(ellipse at 45% 62%,transparent 40%,rgba(18,4,8,.5) 75%,rgba(10,2,4,.8) 100%);animation:flick 9s infinite}
.vig.deep{background:radial-gradient(ellipse at 45% 66%,rgba(90,0,0,.1) 15%,rgba(22,4,8,.68) 60%,rgba(6,0,2,.92) 100%)}
@keyframes flick{0%,45%,100%{opacity:1}46%{opacity:.7}47%{opacity:1}48%{opacity:.8}49%{opacity:1}}
.tint{position:absolute;inset:0;z-index:34;pointer-events:none;mix-blend-mode:multiply;transition:opacity 1.5s}
.t-kitchen{background:rgba(255,170,120,.32)}
.t-workspace{background:linear-gradient(rgba(130,95,170,.62),rgba(110,85,150,.55))}
.t-atelier{background:rgba(80,70,140,.55)}
.ledger{position:absolute;left:11%;right:9%;top:6%;z-index:3;font:3.1cqw/1.9 "Hiragino Mincho ProN","Yu Mincho",serif;color:#2f3550}
.ledger h4{font-size:3.8cqw;margin:0 0 1cqw}
.ledger table{width:100%;border-collapse:collapse}
.ledger td{padding:.4cqw .6cqw;white-space:nowrap}
.ledger td.n{text-align:right}
.ledger td.bad{color:#b0443a;border:.45cqw solid #b0443a;border-radius:50%}
.ledger .memo{margin-top:2cqw;color:#b0443a;font-size:4cqw;transform:rotate(-4deg);display:inline-block}
.ledger .who{margin-top:1cqw;font-size:3cqw;color:#555}
#logbook{background:#1e1519;color:var(--ink);padding:5cqw}
.logPaper{color:var(--ink);width:90cqw;max-height:150cqw;overflow:auto;background:#f8efdc;border:.8cqw solid #6b4a32;border-radius:2cqw;padding:6cqw 5cqw;text-align:left;
  background-image:repeating-linear-gradient(transparent 0 8.4cqw,rgba(120,150,170,.35) 8.4cqw 8.7cqw);background-size:100% 8.7cqw;background-position:0 11cqw}
.logPaper h3{text-align:center;font-size:5.2cqw;margin:0 0 4cqw;letter-spacing:.4em}
.logRow{display:flex;justify-content:space-between;gap:2cqw;font-size:3.5cqw;line-height:8.7cqw;white-space:nowrap}
.logRow .u{color:#b0443a;font-weight:700}
.logRow.me{font-weight:700}
.logSign{margin-top:4cqw;font-size:4cqw;font-weight:700;text-align:center;line-height:1.8}
.pool{transition:transform 1.4s ease-out,opacity .8s;transform-origin:70% 40%}
.bubfx.red{border-color:#e7b0a8;background:radial-gradient(circle at 35% 35%,#f4d2cc 0 18%,rgba(150,40,40,.35) 22%)}

const imgCache = {};
function loadImg(name) {
  /* META にない名前は、取りに行かずに「なし」とする（404を出さない） */
  if (!META[name]) return Promise.resolve(null);
  if (!imgCache[name]) imgCache[name] = new Promise(res => {
    const tryExt = exts => {
      if (!exts.length) return res(null);

      im.onload = () => res(im.src);
      im.onerror = () => tryExt(exts.slice(1));

    };

  });

}

const CHR_H = 36;            /* 立ちポーズの身長（画面幅に対する%） */

const CHR_FOOTB = {"chr_idle": 0.0091, "chr_check": 0.0159, "chr_wipe": 0.0114, "chr_pickup": 0.0205, "chr_scrub": 0.0091};

/* ---------------- 触り方（タップとスワイプ） ---------------- */
function bindPointer(el, { onTap, onStroke, onRub, inZoom = false }) {
  let s = null, acc = 0, lx = 0, ly = 0;
  const blocked = () => busy && !inZoom;
  el.addEventListener("pointerdown", e => {
    if (blocked()) return;
    s = { x: e.clientX, y: e.clientY }; acc = 0; lx = e.clientX; ly = e.clientY;
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
    e.stopPropagation();
  });
  el.addEventListener("pointermove", e => {
    if (!s || !onRub) return;
    acc += Math.hypot(e.clientX - lx, e.clientY - ly); lx = e.clientX; ly = e.clientY;
    if (acc > 16) { acc = 0; onRub(e.clientX, e.clientY); }
  });
  el.addEventListener("pointerup", e => {
    if (!s) return;
    const d = Math.hypot(e.clientX - s.x, e.clientY - s.y);
    s = null;
    if (blocked()) return;
    if (d >= 18) onStroke ? onStroke() : onTap && onTap();
    else onTap && onTap();
  });

const RUB_STEP = 4;   /* こすりイベント何回で1段きれいになるか（床・ズーム・血文字で共通） */
/* こすったときの泡（fx_bubble があれば絵、無ければ丸い泡） */

const CLEAN_LINES = ["きれいになりました！", "ぴかぴかです！", "よし、きれい！", "すっきりしました！"];
let tapHintShown = false;
function runRoom(room) {
  currentRoom = room;
  return new Promise(resolve => {
    room.finish = () => { currentRoom = null; resolve(); };
    for (const t of room.tasks) setupTask(room, t);
  });
}
function done(room, t) {
  t.done = true;
  if (t.after) t.after();
  if (t.el) { t.el.classList.remove("hint"); if (!t.revisit) t.el.classList.remove("hit"); }
  (t.extras || []).forEach(x => x.classList.remove("hint", "hit"));
  if (room.tasks.every(x => x.done || x.optional)) room.finish();
}
function gated(t) {
  if (t.gate && !t.gate()) { say(t.gateSay || "先に、ほかの場所を片付けますね！"); return true; }
  return false;
}
function setupTask(room, t) {
  if (t.art !== undefined && !t.el) t.el = layer(t.art, t.r, t.cls || "");
  const el = t.el;
  el.classList.add("hit");
  if (t.art && t.r && t.r.w < 12) mk("i", "hitpad", el);
  if (t.type === "clean") {
    t.k = 0; const n = t.n || 3;
    el.classList.add("fade");
    const nd = nudger(1);
    bindPointer(el, {
      /* 指を離さなくても、こすった距離で少しずつ落ちる */
      onRub: (x, y) => {
        if (t.done || gated(t)) return;
        rubFx(x, y, /blood|st_ws_/.test(t.art || "")); chrAct(t.scrub ? "scrub" : "wipe");
        t.rubs = (t.rubs || 0) + 1;
        nd.poke(t.rubs >= RUB_STEP);
        if (t.rubs % RUB_STEP) return;
        t.k++;
        el.style.opacity = t.k >= n ? 0 : 1 - .7 * t.k / n;
        popEl(el);
        if (t.k < n) fx("fx_sparkle", el, .7);
        if (t.k >= n) {
          nd.stop();
          el.style.pointerEvents = "none";
          fx("fx_sparkle", el, 1.8);
          say(t.say || CLEAN_LINES[Math.floor(Math.random() * CLEAN_LINES.length)]);
          done(room, t);
        }
      },
      onStroke: () => {},
      onTap: () => {
        if (t.done || gated(t)) return;
        if (!tapHintShown) { tapHintShown = true; say("汚れは、指でこすってきれいにします！"); }
      }
    });
  } else {
    bindPointer(el, { onTap: () => activate(room, t, el) });
    (t.extras || []).forEach(x => { x.classList.add("hit"); if (t.r && t.r.w < 12) mk("i", "hitpad", x); bindPointer(x, { onTap: () => activate(room, t, el) }); });
  }
}
async function activate(room, t, el) {
  if (t.done) {
    if (t.revisit) { busy = true; try { await t.act(el, true); } finally { busy = false; } }
    return;
  }
  if (gated(t)) return;
  busy = true;
  let r;
  try { r = await t.act(el); } finally { busy = false; }
  if (r === false) return;
  done(room, t);
}

/* つかんで運び、どれかの上で離す（heavy＝重く、少し遅れてついてくる） */
function dragOnto(el, targets, { onHover, heavy = false, pad = 0, flick = null } = {}) {
  return new Promise(resolve => {
    let start = null, cur = { x: 0, y: 0 }, goal = { x: 0, y: 0 }, raf = null, over = null;
    const hit = (x, y) => targets.find(t => {
      const r = t.getBoundingClientRect();
      return x >= r.left - pad && x <= r.right + pad && y >= r.top - pad && y <= r.bottom + pad;
    }) || null;
    const apply = () => { el.style.translate = `${cur.x}px ${cur.y}px`; };
    const loop = () => { cur.x += (goal.x - cur.x) * .2; cur.y += (goal.y - cur.y) * .2; apply(); raf = requestAnimationFrame(loop); };
    const down = e => {
      start = { x: e.clientX - cur.x, y: e.clientY - cur.y };
      el.style.transition = "none"; el.classList.add("dragging");
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
      e.stopPropagation();
      if (heavy) raf = requestAnimationFrame(loop);
    };
    const move = e => {
      if (!start) return;
      goal = { x: e.clientX - start.x, y: e.clientY - start.y };
      if (!heavy) { cur = { ...goal }; apply(); }
      const h = hit(e.clientX, e.clientY);
      if (h !== over) { over = h; onHover && onHover(h); }
    };
    const back = () => { el.style.transition = "translate .25s"; el.style.translate = "0px 0px"; cur = { x: 0, y: 0 }; goal = { x: 0, y: 0 }; };
    const up = e => {
      if (!start) return;
      start = null; cancelAnimationFrame(raf); el.classList.remove("dragging");
      let h = hit(e.clientX, e.clientY);
      if (!h && flick) h = flick(e.clientX, e.clientY, goal.x, goal.y);
      over = null; onHover && onHover(null);
      if (h) { cleanup(); resolve(h); } else back();
    };
    const cancel = () => { if (!start) return; start = null; cancelAnimationFrame(raf); el.classList.remove("dragging"); back(); };
    const cleanup = () => {
      el.removeEventListener("pointerdown", down); el.removeEventListener("pointermove", move);
      el.removeEventListener("pointerup", up); el.removeEventListener("pointercancel", cancel);
    };
    el.addEventListener("pointerdown", down); el.addEventListener("pointermove", move);
    el.addEventListener("pointerup", up); el.addEventListener("pointercancel", cancel);
  });
}
/* 運んだ物を、相手の中へ吸い込ませる */
async function sinkInto(el, target) {
  const er = el.getBoundingClientRect(), tr = target.getBoundingClientRect();
  const cur = (el.style.translate || "0px 0px").split(" ").map(v => parseFloat(v) || 0);
  const dx = tr.left + tr.width / 2 - (er.left + er.width / 2) + cur[0];
  const dy = tr.top + tr.height / 2 - (er.top + er.height / 2) + (cur[1] || 0);
  el.style.transition = "translate .32s ease-in, scale .32s ease-in, opacity .32s";
  el.style.translate = `${dx}px ${dy}px`; el.style.scale = ".2"; el.style.opacity = "0";
  await sleep(340);
}

let fingerShown = false;
function sortUI({ itemArt, name, allow, wrongSay, final = false, thumbs = null, cats = CATS }) {
  const s = $("#sort");
  s.innerHTML = "";
  s.classList.toggle("final", final);
  const row = mk("div", "cards", s);
  mk("div", "sortHint", s, "カードを、分類へ上スワイプ");
  const tg = mk("div", "target", s);
  const ta = mk("div", "tart", tg);
  if (itemArt) art(ta, itemArt); else ta.classList.add("blank");
  mk("div", "tname", tg, name);
  const upA = mk("div", "upArrow", tg);
  loadImg("ui_arrow_up").then(src => {
    if (src) { upA.style.backgroundImage = `url("${src}")`; return; }
    loadImg("ui_arrow_down").then(src2 => { if (src2) { upA.style.backgroundImage = `url("${src2}")`; upA.style.rotate = "180deg"; } else upA.classList.add("css"); });
  });
  const cards = cats.map(c => {
    const card = mk("div", "card", row);
    card.dataset.cat = c.id;
    const ca = mk("div", "cart", card);
    if (META[c.art]) art(ca, c.art); else ca.classList.add("cwash");
    mk("div", "clabel", card, c.label);
    if (allow && !allow.includes(c.id)) card.classList.add("dim");
    if (thumbs) {
      const mine = thumbs.filter(i => i.cat === c.id).reverse();
      if (mine.length) {
        const th = mk("div", "cthumbs", card);
        mine.slice(0, 2).forEach(i => art(mk("i", "", th), i.art));
        if (mine.length > 2) mk("b", "", th, "＋" + (mine.length - 2));
      }
    }
    return card;
  });
  s.classList.add("on");
  /* 最初の1回だけ、指の手本（品物のカードから分類のカードへ） */
  if (!fingerShown) {
    fingerShown = true;
    setTimeout(() => {
      if (!s.contains(tg)) return;
      const to = cards.find(c => !c.classList.contains("dim") && allow) || cards[1];
      const sr = s.getBoundingClientRect(), a = tg.getBoundingClientRect(), b = to.getBoundingClientRect();
      const f = mk("div", "finger", s);
      f.style.left = (a.left - sr.left + a.width / 2) + "px";
      f.style.top = (a.top - sr.top + a.height / 2) + "px";
      f.style.setProperty("--fx", (b.left - a.left + (b.width - a.width) / 2) + "px");
      f.style.setProperty("--fy", (b.top - a.top + (b.height - a.height) / 2) + "px");
      loadImg("ui_finger").then(src => { if (src) f.style.backgroundImage = `url("${src}")`; else f.classList.add("css"); });
      tg.addEventListener("pointerdown", () => f.remove(), { once: true });
      setTimeout(() => f.remove(), 5000);
    }, 500);
  }
  return new Promise(async resolve => {
    while (true) {
      const card = await dragOnto(tg, cards, { heavy: final, pad: 8,
        onHover: h => cards.forEach(c => c.classList.toggle("hover", c === h)),
        flick: (x, y, dx, dy) => {
          if (dy > -tg.getBoundingClientRect().height * .3) return null;
          /* 練習で正解が1つのときは、上へはじけばそこへ入る */
          if (allow && allow.length === 1) return cards.find(c => c.dataset.cat === allow[0]);
          /* はじいた向きをそのまま上へのばして、当たる分類を選ぶ */
          const r0 = cards[0].getBoundingClientRect(), rowY = r0.top + r0.height / 2;
          const ox = x - dx, oy = y - dy, px = ox + dx * (rowY - oy) / dy;
          let best = null, bd = 1e9;
          cards.forEach(c => { const r = c.getBoundingClientRect(); const d = Math.abs(r.left + r.width / 2 - px); if (d < bd) { bd = d; best = c; } });
          return best;
        } });
      const id = card.dataset.cat;
      if (allow && !allow.includes(id)) {
        tg.style.transition = "translate .25s"; tg.style.translate = "0px 0px";
        card.classList.add("shake"); setTimeout(() => card.classList.remove("shake"), 400);
        if (wrongSay) say(wrongSay);
        continue;
      }
      card.classList.add("got");
      fx("fx_pon", card, 1.3);
      await sinkInto(tg, card);
      await sleep(150);
      s.classList.remove("on"); s.innerHTML = "";
      resolve(id);
      return;
    }
  });
}

function zoomClean(el, n, onDone, red = false) {

  const nd = nudger(1);
  el.classList.add("fade", "hit");
  let r = 0;
  const foams = [];
  /* こするたびに泡が増えて、洗い終わると泡がはじけてキラッ */

    const host = el.parentNode;
    for (let i = 0; i < cnt; i++) {

      f.style.top = (el.offsetTop + el.offsetHeight * (.15 + Math.random() * .7)) + "px";
      foams.push(f);
    }
  };
  bindPointer(el, { inZoom: true, onStroke: () => {}, onRub: (x, y) => {
    if (k >= n) return;
    rubFx(x, y, red, !red); chrAct("wipe");
    if (r % 2 === 0) addFoam(1);
    ++r; nd.poke(r >= RUB_STEP);
    if (r % RUB_STEP) return;
    k++; el.style.opacity = k >= n ? 0 : 1 - .7 * k / n; popEl(el);
    addFoam(2);
    if (k < n) fx("fx_sparkle", el, .7);
    if (k >= n) {
      nd.stop();
      el.style.pointerEvents = "none";
      foams.forEach((f, i) => setTimeout(() => { f.classList.add("out"); setTimeout(() => f.remove(), 500); }, i * 25));
      fx("fx_sparkle", el, 1.8);
      setTimeout(() => fx("fx_sparkle", el, 1.2), 260);
      onDone();
    }
  } });
}

let diaryOpen = false;
async function showDiary() {
  if (!diaryOpen) {
    const ok = await codeLock();
    if (!ok) return;
  }
  seeClue("diary");
  /* 文字入りの日記の絵は旧文面なので使わず、無地の紙に重ねる */
  return openPaper("ui_paper_diary", "10月2日\nれおの様子がおかしい。\n正直、ちょっと怖い。\nお互いのためにも、\n距離を取ったほうが\nいいのかな…。\n念のため、\nアトリエのロック番号だけ\n変えておこう。\n幸せだった、\nはじまりの日付に。", { first: 12.44, gap: 6.97, size: 3.9 });
}
function codeLock() {
  let fails = 0;
  return new Promise(res => {
    openZoom("item_diary", (box, api) => {
      say("日記ですね。鍵がかかっています。");
      const pad = mk("div", "dlock", box);
      const disp = mk("div", "dlDisp", pad, "");
      const grid = mk("div", "dlGrid", pad);
      let code = "";
      const show = () => disp.textContent = code.padEnd(4, "•");
      show();
      ["1","2","3","4","5","6","7","8","9","C","0","OK"].forEach(k => {
        const b = mk("button", "", grid, k);
        b.addEventListener("click", async e => {
          e.stopPropagation();
          if (diaryOpen) return;
          if (k === "C") { code = ""; show(); return; }
          if (k === "OK") {
            if (code === "1018") { diaryOpen = true; disp.textContent = "OPEN"; await sleep(600); api.close(); return; }
            fails++; pad.classList.add("shake"); setTimeout(() => pad.classList.remove("shake"), 400);
            code = ""; show();
            if (fails >= 2) say("暗証番号といえば誕生日が定番ですよね。");
            return;
          }
          if (code.length < 4) { code += k; show(); }
        });
      });
      api.allowClose();
      return "manual";
    }).then(() => res(diaryOpen));
  });
}

function fadeAway(el) { if (!el) return; el.style.transition = "opacity .8s"; el.style.opacity = 0; setTimeout(() => el.remove(), 850); }
/* こすって消す（いつもと同じ泡とキラキラ） */
function rubErase(el, n, { nudge = 1, bleed = false, still = false } = {}) {
  return new Promise(resolve => {
    let k = 0;
    el.classList.add("hit", "hint", "fade");
    el.style.pointerEvents = "auto";
    let r = 0;
    const nd = nudger(nudge, () => { el.classList.add("hint"); setTimeout(() => el.classList.remove("hint"), 1300); });
    bindPointer(el, { inZoom: true, onStroke: () => {}, onRub: (x, y) => {
      if (k >= n) return;
      /* 最初の一筆だけ、血が横ににじんで一度濃く見える */
      if (bleed && r === 0 && el.animate) el.animate([{ filter: "none" }, { filter: "brightness(.7) contrast(1.6)" }, { filter: "none" }], { duration: 650 });
      rubFx(x, y, /blood|letters/.test(el.dataset.art || "")); chrAct("scrub"); el.classList.remove("hint");
      ++r; nd.poke(r >= RUB_STEP);
      if (r % RUB_STEP) return;
      k++; if (!still) popEl(el);
      el.style.opacity = Math.max(0, 1 - k / n);
      if (k < n) fx("fx_sparkle", el, .7);
      if (k >= n) { nd.stop(); el.style.pointerEvents = "none"; fx("fx_sparkle", el, 1.8); resolve(); }
    } });
  });
}

function swipeAway(el, note) {
  const n = mk("div", "swipeNote", stage, note);
  return new Promise(resolve => {
    let sy = null, dy = 0;
    const base = getComputedStyle(el).transform === "none" ? "" : el.style.transform;
    el.addEventListener("pointerdown", e => { sy = e.clientY; dy = 0; try { el.setPointerCapture(e.pointerId); } catch (_) {} el.style.transition = "none"; });
    el.addEventListener("pointermove", e => { if (sy == null) return; dy = Math.min(0, e.clientY - sy); el.style.transform = `translate(-50%, calc(-50% + ${dy}px))`; });
    el.addEventListener("pointerup", async () => {
      if (sy == null) return; sy = null; el.style.transition = "";
      if (dy < -50) {
        el.style.transform = "translate(-50%, -260%)"; el.style.opacity = 0;
        n.remove();
        await sleep(450); el.remove(); resolve();
      } else el.style.transform = "";
    });
  });
}

/* ---------------- 分類結果 ---------------- */
function endScreen(cat) {
  const e = $("#ends");
  e.innerHTML = "";
  const ends = store.get("osouji_ends", []);
  const names = { important: "大切なもの", bulky: "粗大ごみ", raw: "生ゴミ" };
  mk("h2", "", e, cat ? "分類結果：" + names[cat] : "分類結果");
  const list = mk("div", "endList", e);
  [["A", "大切なもの"], ["B", "粗大ごみ"], ["C", "生ゴミ"]].forEach(([k, label]) => {
    const d = mk("div", ends.includes(k) ? "" : "no", list);
    mk("span", "", d, label); mk("span", "", d, ends.includes(k) ? "分類済み" : "未分類");
  });
  if (cat) store.set("osouji_lastcat", cat);
  const last = cat || store.get("osouji_lastcat", null);
  const items = savedItems();
  if (items.length || last) {
    const lab = { important: "大切なもの", bulky: "粗大ごみ", raw: "生ゴミ", wash: "洗濯した", trash: "廃棄した" };
    const my = mk("div", "myList", e);
    mk("b", "", my, "あなたの分類");
    items.forEach(i => { const r = mk("div", "", my); if (i.art) art(mk("i", "", r), i.art); mk("span", "", r, i.name); mk("em", "", r, lab[i.cat] || ""); });
    if (last) { const r = mk("div", "last", my); mk("i", "", r); mk("span", "", r, "朝倉ひより"); mk("em", "", r, names[last]); }
    const cl = mk("div", "myList", e);
    mk("b", "", cl, "あなたがきれいにしたもの");
    ["ソファ横の、赤い点", "排水口の、赤いにじみ", "扉の、手のあと", "床の、引きずったあと", "床の、足あと", "血のついた包丁（キッチンに戻した）", "床の、手のあと", "床の文字「れお」"]
      .forEach(t => mk("div", "", cl, t));
  }
  if (["A", "B", "C"].every(k => ends.includes(k))) {
    const lb = mk("button", "btn", e, "作業日誌をひらく");
    lb.style.background = "#f2d04b";
    lb.addEventListener("click", () => logbook());
    const nb = mk("button", "btn", e, "あの夜の記録");
    nb.style.background = "#d9c7a8";
    nb.addEventListener("click", () => nightRecord());
  }
  const b1 = mk("button", "btn", e, "最終分類からやり直す");
  b1.addEventListener("click", () => { showScreen("ends", false); play("final"); });
  const b2 = mk("button", "btn", e, "タイトルへ");
  b2.addEventListener("click", () => { showScreen("ends", false); scene.innerHTML = ""; setProgress(null); hideMsg(); titleScreen(); });
  showScreen("ends");
}

/* ---------------- 素材チェック（?check） ---------------- */
async function checkScreen() {
  const c = $("#check");
  c.classList.add("on");
  const rows = await Promise.all(ASSETS.map(async n => [n, !!(await loadImg(n))]));
  const ok = rows.filter(r => r[1]).length;
  c.innerHTML = `<p><b>素材チェック</b>　${ok} / ${rows.length}</p><p>assets/ フォルダに「名前.png」で置いてください。</p><br>` +
    rows.map(([n, f]) => `<div><b class="${f ? "ok" : "ng"}">${f ? "○" : "×"}</b> ${n}.png</div>`).join("") +
    `<br><button class="btn" onclick="document.getElementById('check').classList.remove('on')">閉じる</button>`;
}

/* ---------------- 起動 ---------------- */
const q = new URLSearchParams(location.search);
if (q.has("check") || location.hash === "#check") checkScreen();
if (q.get("area")) { play(q.get("area")); } else titleScreen();
